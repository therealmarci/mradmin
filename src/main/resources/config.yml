# ==============================================================================
#   MRadmin - Konfiguration
# ==============================================================================
#   Nach Änderungen:  /mradmin reload   (kein Neustart nötig)
#   Dashboard:        /mradmin        Befehlsliste: /mradmin help
#
#   Zeitangaben: d = Tage, h = Stunden, m = Minuten, s = Sekunden,
#                z.B. "30s", "15m", "1h30m". Eine reine Zahl zählt als Minuten.
#
#   Texte & Nachrichten (auch Ankündigungs-Presets und Discord): lang/de.yml bzw. lang/en.yml.
#
#   Diese Datei ist UTF-8-kodiert. Falls Umlaute (ä, ö, ü) falsch angezeigt werden,
#   im Editor die Kodierung auf "UTF-8" stellen.
# ==============================================================================

# Nicht ändern - wird für automatische Config-Updates verwendet.
config-version: 14

# Sprache aller Texte: de = Deutsch, en = English. Die Texte stehen in plugins/MRadmin/lang/<sprache>.yml
# und können dort angepasst werden. Eigene Sprache: Datei kopieren (z.B. fr.yml), übersetzen, language: fr.
language: de

# Zeitzone für alle angezeigten Uhrzeiten, z.B. "Europe/Vienna" oder "Europe/Berlin". Leer = Zeitzone des Servers.
timezone: ""

# Funktionen ein- und ausschalten. Eine ausgeschaltete Funktion verschwindet komplett: ihre Befehle melden
# "ausgeschaltet", ihre Knöpfe fehlen in den Menüs und sie greift nirgends mehr ein. Gespeicherte Daten (Tickets,
# geplante Wartungen ...) bleiben erhalten und sind nach dem Einschalten wieder da. Wirkt mit /mradmin reload.
# Discord-Logs, Discord-Ankündigungen, Uptime Kuma und der Update-Check haben ihren Schalter (enabled) im
# jeweiligen Abschnitt weiter unten.
features:
  # Wartungsmodus: Countdown, Bossbar, MOTD, Join-Sperre (inkl. Uptime-Kuma-Anbindung).
  maintenance: true
  # Ankündigungen: /mradmin announce und das Ankündigungs-Menü.
  announce: true
  # Admin-Modus: /mradmin mode und der Admin-Kompass. Wer beim Ausschalten im Admin-Modus ist, bekommt sein
  # Inventar sofort zurück (offline: beim nächsten Join).
  admin-mode: true
  # Spieler-Werkzeuge im Spieler-Menü: zu Spielern teleportieren (auch /mradmin tp), Spieler herholen, Inventar und
  # Enderchest ansehen, einfrieren (beim Ausschalten sind eingefrorene Spieler sofort frei).
  teleport: true
  summon: true
  inventory: true
  freeze: true
  # Serverzustand: /mradmin status und die Server-Kachel im Dashboard.
  server-status: true
  # Tickets & Reports: /report und /mradmin tickets.
  tickets: true
  # Staff-Chat: /sc.
  staff-chat: true

# Zusammenarbeit mit meinen anderen Plugins. MRadmin erkennt sie automatisch - auch wenn sie später geladen oder
# entfernt werden - und passt die Menüs von selbst an: Knopf im Dashboard mit Live-Infos, Infos im Spieler-Menü,
# bei MRchunks auffällige Chunkloader im Serverzustand. Ist ein Plugin nicht installiert, fehlt nur sein Teil.
# Alle Plugins laufen auch einzeln. false = nicht verbinden, auch wenn das Plugin installiert ist.
integrations:
  mrsleep: true
  mrchunks: true
  # LibertyBans: Banns, Mutes, Warns und Kicks auf der Spielerseite im Web. Es gelten die Permissions von LibertyBans
  # (z.B. libertybans.ban.do.target.uuid, libertybans.list.history), auch seine Dauer-Permissions, falls eingeschaltet.
  libertybans: true

# Schnellauswahl für Banns und Mutes auf der Spielerseite im Web ("perm" = dauerhaft).
libertybans:
  durations: ["1h", "1d", "7d", "30d", "perm"]


# ------------------------------------------------------------------------------
#   1) WARTUNGSARBEITEN
# ------------------------------------------------------------------------------
# Während einer Wartung können nur Spieler mit der Permission "mradmin.maintenance.bypass" joinen
# (in LuckPerms z.B. der Staff-Gruppe geben: /lp group staff permission set mradmin.maintenance.bypass true).
# Wartungen kommen aus Uptime Kuma (Abschnitt uptime-kuma unten) oder per Befehl:
#   /mradmin maintenance           Status
#   /mradmin maintenance on [dauer]             sofort starten (ohne Dauer: bis "off")
#   /mradmin maintenance schedule <in> [dauer]  geplante Wartung mit Countdown, z.B. "schedule 15m 1h"
#   /mradmin maintenance off                    beenden bzw. Planung aufheben
maintenance:
  # So lange vor Beginn erscheint die Bossbar mit Countdown.
  warn-before: "15m"

  # Bossbar mit Countdown vor Beginn (alle Spieler) und mit der Restzeit während der Wartung (nur Staff).
  bossbar:
    enabled: true
    # Farben: PINK, BLUE, RED, GREEN, YELLOW, PURPLE, WHITE
    color: YELLOW
    # In den letzten "final-seconds" Sekunden vor Beginn wechselt die Farbe auf final-color.
    final-color: RED
    final-seconds: 60
    # Unterteilung: PROGRESS (durchgehend), NOTCHED_6, NOTCHED_10, NOTCHED_12, NOTCHED_20
    overlay: NOTCHED_10
    # Während der Wartung eine Bossbar mit der Restzeit für Staff anzeigen (wenn das Ende bekannt ist).
    show-during-maintenance: true
    during-color: PURPLE

  # Zusätzliche Erinnerungen vor Beginn (Chat-Nachricht maintenance-reminder), jeweils so lange vorher.
  reminders: ["15m", "10m", "5m", "2m", "1m", "30s"]
  # Ab so vielen Sekunden vor Beginn läuft zusätzlich ein großer Countdown auf dem Bildschirm (0 = aus).
  title-countdown-seconds: 10
  # Ton bei Erinnerungen und Countdown ("" = kein Ton). Namen: https://jd.papermc.io/paper/org/bukkit/Sound.html
  sound: BLOCK_NOTE_BLOCK_PLING

  # Spieler ohne Bypass-Permission beim Start der Wartung vom Server kicken.
  kick-on-start: true
  # So viele Sekunden nach dem Start wird gekickt (Zeit, um die Nachricht noch zu lesen).
  kick-delay-seconds: 5

  # Serverliste während der Wartung: Text aus der Sprachdatei (maintenance-motd) statt der normalen MOTD.
  motd:
    enabled: true
    # Statt der Spieleranzahl erscheint rechts "Wartung" (maintenance-version-text) in rot.
    replace-version: true


# ------------------------------------------------------------------------------
#   2) UPTIME KUMA
# ------------------------------------------------------------------------------
# MRadmin meldet sich wie die Weboberfläche bei Uptime Kuma an und liest die Wartungen live mit:
# geplante Wartungen lösen den Countdown aus, Änderungen in Kuma (Verlängern, Verschieben, Pausieren,
# Löschen) werden sofort übernommen. Gedacht für Uptime Kuma 2.x (1.23 sollte ebenfalls funktionieren).
# Uptime Kuma kennt nur einen Benutzer - hier also deinen Kuma-Login eintragen. Er wird nur an Kuma geschickt.
uptime-kuma:
  enabled: false
  # Adresse der Weboberfläche, z.B. "https://status.deinserver.de" oder "http://192.168.1.10:3001"
  url: ""
  # Login: Benutzername + Passwort ...
  username: ""
  password: ""
  # ... oder stattdessen ein Login-Token (nötig, wenn 2FA aktiv ist): im Browser bei Kuma einloggen,
  # Entwicklertools (F12) -> Anwendung/Speicher -> Local Storage -> Wert von "token" kopieren.
  # Der Token bleibt gültig, bis das Kuma-Passwort geändert wird.
  token: ""

  # Welche Wartungen gelten für DIESEN Server? (Beide Listen leer = jede Wartung in Kuma.)
  # monitor-ids: Wartungen, die einen dieser Monitore betreffen. Die ID steht in der Adresse des Monitors,
  #              z.B. https://status.deinserver.de/dashboard/12  ->  12
  monitor-ids: []
  # maintenance-ids: genau diese Wartungen (ID aus https://status.deinserver.de/maintenance/3  ->  3)
  maintenance-ids: []

  # So oft wird die Liste zusätzlich neu abgefragt (Änderungen kommen sonst sofort).
  refresh-seconds: 60
  # Nach einem Verbindungsabbruch wird es nach so vielen Sekunden erneut versucht.
  reconnect-seconds: 30
  # Ist Kuma nicht erreichbar, bleibt die zuletzt bekannte Planung gültig (true) oder wird verworfen (false).
  keep-schedule-when-offline: true


# ------------------------------------------------------------------------------
#   3) ANKÜNDIGUNGEN
# ------------------------------------------------------------------------------
# /mradmin announce <text>               eigener Text (MiniMessage erlaubt, z.B. <red>Achtung!)
# /mradmin announce <preset> [werte...]  vorbereitete Ankündigung aus der Sprachdatei (announce-presets)
# Auch von der Konsole/RCON nutzbar, z.B. im Restart-Script:  mradmin announce restart 5m
announce:
  # Wie lange der Text auf dem Bildschirm steht (in Sekunden).
  fade-in: 0.5
  stay: 6
  fade-out: 1
  # Zusätzlich im Chat ausgeben.
  chat: true
  # Ton ("" = kein Ton) mit Lautstärke und Tonhöhe.
  sound: BLOCK_NOTE_BLOCK_BELL
  volume: 1.0
  pitch: 1.0


# ------------------------------------------------------------------------------
#   4) ADMIN-MODUS
# ------------------------------------------------------------------------------
# /mradmin mode on   Inventar, Rüstung, XP, Leben, Hunger, Effekte und Position werden gespeichert,
#                    du kommst in den Creative-Modus und bekommst nur den Admin-Kompass (Menü: Teleport, Plugins, Wartung).
# /mradmin mode off  alles wird exakt wiederhergestellt und du landest wieder am Ausgangspunkt.
# Der gespeicherte Stand liegt in plugins/MRadmin/admin-mode/ und übersteht auch Abstürze und Neustarts.
admin-mode:
  # Spielmodus im Admin-Modus: CREATIVE oder SPECTATOR
  gamemode: CREATIVE
  # Beim Beenden zum Ausgangspunkt zurück teleportieren.
  return-to-start: true
  # Teleport-Kompass: Material und Slot in der Hotbar (0-8).
  compass-material: COMPASS
  compass-slot: 4
  # Items im Admin-Modus nicht fallen lassen / nicht aufheben (schützt vor Creative-Items im Survival).
  prevent-drop: true
  prevent-pickup: true
  # Was passiert, wenn ein Admin im Admin-Modus den Server verlässt?
  #   true  = Admin-Modus wird beendet (alles zurück, Teleport zum Ausgangspunkt)
  #   false = bleibt aktiv, beim nächsten Join geht es im Admin-Modus weiter
  end-on-quit: false

  # Eigene Knöpfe im Dashboard (Reihe "Werkzeuge"), z.B. für das Admin-Menü eines anderen Plugins. MRsleep und
  # MRchunks brauchen hier keinen Eintrag, sie kommen automatisch (siehe integrations oben). Jeder Knopf führt einen
  # Befehl als Spieler aus, die Rechte prüft dann das jeweilige Plugin selbst. Höchstens 6 Knöpfe inkl. MRsleep und
  # MRchunks, Reihenfolge wie hier.
  #   plugin:     nur anzeigen, wenn dieses Plugin installiert ist ("" = immer)
  #   permission: nur anzeigen, wenn der Spieler diese Permission hat ("" = alle mit Dashboard)
  #   enabled:    false = Knopf ausblenden (z.B. statt ihn zu löschen)
  # Name und Beschreibung stehen in der Sprachdatei unter gui-hub-buttons.<name> (fehlt er dort: der Name von hier).
  # Beispiel:
  #   chunky:
  #     plugin: Chunky
  #     material: MAP
  #     command: "chunky progress"
  menu:
    buttons: {}


# ------------------------------------------------------------------------------
#   5) TICKETS & REPORTS
# ------------------------------------------------------------------------------
# /report öffnet für alle Spieler (Permission mradmin.tickets.create) das Ticket-Menü: "Ticket erstellen" (Kategorie wählen,
# dann ein Formular), die offenen Tickets und das Archiv mit den geschlossenen. Im Ticket schreiben Spieler und
# Team hin und her wie in einem Chat.
# Das Team (mradmin.tickets.notify) bekommt eine Meldung mit [Öffnen] und [Teleport]. Alle Tickets stehen im
# Dashboard bzw. unter /mradmin tickets (mradmin.tickets.view, dazu .reply, .claim, .close, .reopen, .teleport).
# Texte: lang/<sprache>.yml, Abschnitte ticket-... und ticket-categories.
tickets:
  # So lange muss ein Spieler zwischen zwei neuen Tickets warten (Team: kein Cooldown).
  cooldown: "60s"
  # Mindestabstand zwischen zwei Nachrichten eines Spielers im Ticket (gegen Spam).
  reply-cooldown: "3s"
  # Höchstens so viele offene Tickets pro Spieler (alle Kategorien zusammen).
  max-open-per-player: 3
  # Länge des Titels (alle Kategorien außer Spieler-Reports) und der Texte. Das Formular lässt nicht mehr zu.
  min-subject-length: 3
  max-subject-length: 50
  min-text-length: 10
  max-text-length: 500
  # Dem Spieler Bescheid geben, wenn das Team sein Ticket geschlossen hat (falls er online ist). Neue Antworten
  # werden immer gemeldet, offline beim nächsten Join.
  notify-creator: true
  # Namen der Teammitglieder im Ticket zeigen. false = Spieler sehen nur "Team".
  show-staff-names: true
  # Bild neben Team-Nachrichten, wenn die Namen ausgeblendet sind (sonst der Kopf des Teammitglieds).
  team-icon: "NETHER_STAR"
  # Wer als Erster aus dem Team antwortet, übernimmt das Ticket automatisch (weitere Nachrichten des Spielers gehen
  # dann nur an ihn, solange er online ist).
  auto-claim: true
  # So viele der letzten Nachrichten zeigt das Ticket (ältere werden ausgeblendet).
  shown-messages: 20
  # Ton bei Meldungen über neue Tickets und Antworten (Bukkit-Name oder Key). Leer = kein Ton.
  sound: "BLOCK_NOTE_BLOCK_PLING"
  # Geschlossene Tickets so lange aufheben (auch für den Spieler sichtbar), danach werden sie gelöscht.
  keep-closed: "7d"
  # Mit MRchunks: Wird ein Chunkloader wegen Lag gesperrt, bekommt sein Owner automatisch ein Ticket mit allen
  # Details der Sperre (Link im Chat). Darin kann er erklären, was passiert ist. Schließen kann es nur das Team, das
  # den Loader über "Chunkloader-Menü" im Ticket entsperren kann. Wird er erneut gesperrt oder entsperrt, steht das im selben Ticket.
  chunkloader-locks: true
  # Symbol aller Tickets in den Menüs (Item-Name).
  icon: "NAME_TAG"
  # Kategorien, die beim Erstellen zur Auswahl stehen (in dieser Reihenfolge). Eigene einfach ergänzen, nicht
  # benötigte löschen oder mit enabled: false ausblenden. Pro Kategorie:
  #   name:       Anzeigename. Leer = Text aus der Sprachdatei (ticket-categories.<id>), sonst die ID.
  #   player:     true = Spieler-Report: erst wird der Spieler ausgewählt, dann der Vorfall beschrieben.
  #               false = normales Ticket mit Titel und Beschreibung.
  #   permission: nur Spieler mit dieser Permission sehen die Kategorie. Leer = alle mit mradmin.tickets.create.
  #   enabled:    false = ausgeblendet (bestehende Tickets bleiben erhalten).
  # Beispiel für eine eigene Kategorie:
  #   bewerbung:
  #     name: "Bewerbung fürs Team"
  #     player: false
  #     permission: ""
  # Die ID (hier "bewerbung") wird im Ticket gespeichert - nicht mehr ändern, sobald es Tickets damit gibt.
  categories:
    cheating:
      name: ""
      player: true
    chat:
      name: ""
      player: true
    griefing:
      name: ""
      player: true
    scam:
      name: ""
      player: true
    bug:
      name: ""
      player: false
    other:
      name: ""
      player: false


# ------------------------------------------------------------------------------
#   6) DISCORD-LOGS (Admin)
# ------------------------------------------------------------------------------
# Webhook anlegen: Discord-Kanal -> Kanal bearbeiten -> Integrationen -> Webhooks
#                  -> Neuer Webhook -> Webhook-URL kopieren.
# Die Texte der Events stehen in der Sprachdatei (lang/<sprache>.yml, Abschnitt discord).
# Ein Event mit "enabled: false" oder leerem Text wird nicht gesendet.
# Funktioniert es nicht? -> /mradmin discord zeigt den Status, /mradmin discord test schickt eine Testnachricht.
discord:
  enabled: false
  # Komplette URL in Anführungszeichen, z.B. "https://discord.com/api/webhooks/123456/abcdef"
  webhook-url: ""
  username: "MRadmin"
  avatar-url: ""
  use-embeds: true
  footer: "Minecraft-Server"
  events:
    maintenance-scheduled:
      enabled: true
      color: "#F1C40F"
    maintenance-changed:
      enabled: true
      color: "#3498DB"
    maintenance-cancelled:
      enabled: true
      color: "#95A5A6"
    maintenance-start:
      enabled: true
      color: "#E74C3C"
    maintenance-end:
      enabled: true
      color: "#2ECC71"
    kuma-connected:
      enabled: false
      color: "#2ECC71"
    kuma-disconnected:
      enabled: true
      color: "#E67E22"
    announce:
      enabled: true
      color: "#9B59B6"
    admin-mode-on:
      enabled: true
      color: "#E67E22"
    admin-mode-off:
      enabled: true
      color: "#1ABC9C"
    admin-reload:
      enabled: true
      color: "#3498DB"
    ticket:
      enabled: true
      color: "#E67E22"
    # Jede Nachricht in einem Ticket (standardmäßig aus).
    ticket-message:
      enabled: false
      color: "#3498DB"
    ticket-closed:
      enabled: true
      color: "#2ECC71"
    ticket-reopened:
      enabled: true
      color: "#F1C40F"
    player-freeze:
      enabled: true
      color: "#3498DB"
    player-unfreeze:
      enabled: true
      color: "#95A5A6"
    player-kick:
      enabled: true
      color: "#E67E22"
    player-freeze-quit:
      enabled: true
      color: "#E74C3C"
    # Jede Staff-Chat-Nachricht auch im Admin-Discord (standardmäßig aus).
    staff-chat:
      enabled: false
      color: "#7F8C8D"
    # Anmeldungen in der Weboberfläche und Einrichtung/Zurücksetzen eines Web-Kontos.
    web-login:
      enabled: true
      color: "#3498DB"
    web-setup:
      enabled: true
      color: "#9B59B6"
    # Jeder Befehl aus der Web-Konsole.
    web-console:
      enabled: true
      color: "#E74C3C"
    # Der Server laggt länger (health.alert) bzw. hat sich wieder erholt.
    health-alert:
      enabled: true
      color: "#E74C3C"
    health-recovered:
      enabled: true
      color: "#2ECC71"


# ------------------------------------------------------------------------------
#   7) DISCORD-ANKÜNDIGUNGEN (Community)
# ------------------------------------------------------------------------------
# Eigener Webhook für den öffentlichen Ankündigungs-Channel deines Discords - getrennt von den Admin-Logs oben.
# Bewusst sparsam: pro Wartung höchstens 3 Posts (geplant, gestartet, beendet). Verschieben, Verlängern und
# Absagen werden in den letzten Post eingearbeitet, statt neu zu posten. Zeiten erscheinen als Discord-Zeitstempel
# (jeder sieht sie in seiner eigenen Zeitzone, mit "in 2 Stunden").
# Texte: lang/<sprache>.yml, Abschnitt discord-announce. Testen: /mradmin discord test announce
discord-announce:
  enabled: false
  webhook-url: ""
  username: ""
  avatar-url: ""
  footer: ""
  # Rolle, die beim ersten Post erwähnt wird (z.B. @Server-News). Leer = niemand wird gepingt.
  # ID: Discord-Einstellungen -> Erweitert -> Entwicklermodus an, dann Rechtsklick auf die Rolle -> "ID kopieren".
  ping-role-id: ""

  maintenance:
    enabled: true
    # Erst posten, wenn die Wartung höchstens so lange entfernt ist (später angelegte: sofort).
    # Verhindert, dass wiederkehrende Wartungen weit im Voraus gepostet werden.
    announce-ahead: "24h"
    # Kürzere Wartungen gar nicht posten ("0" = alle posten).
    min-length: "0"
    # Eigener Post beim Start bzw. beim Ende ("Server wieder online"). false = nur der Post "geplant".
    post-start: true
    post-end: true
    # ping-role-id beim ersten Post einer Wartung erwähnen (nie bei Bearbeitungen oder beim Ende).
    ping: true
    # Mehrere Änderungen in Kuma kurz hintereinander werden zu einer Bearbeitung zusammengefasst.
    debounce-seconds: 60

  announcements:
    # Ankündigungen posten: Presets mit "discord"-Text in der Sprachdatei automatisch (außer mit -q),
    # eigene Texte nur mit -d, z.B. /mradmin announce -d Heute Abend Event!
    enabled: true
    # Dasselbe Preset höchstens einmal in dieser Zeit posten (Restart-Script mit 5m/1m = ein Post).
    cooldown: "10m"
    ping: false

  colors:
    scheduled: "#F1C40F"
    started: "#E74C3C"
    ended: "#2ECC71"
    cancelled: "#95A5A6"
    announce: "#9B59B6"


# ------------------------------------------------------------------------------
#   8) UPDATE-CHECK
# ------------------------------------------------------------------------------
update-checker:
  enabled: true
  # Quelle: "github" (GitHub Releases, Standard) oder "modrinth"
  source: github
  # Auch Beta-/Alpha-Versionen melden. Läuft selbst eine Vorabversion (0.x), werden sie immer gemeldet.
  include-prereleases: false
  interval-hours: 6
  # Spieler mit "mradmin.admin.update" beim Betreten des Servers informieren.
  notify-on-join: true


# ------------------------------------------------------------------------------
#   SERVERZUSTAND (Health)
# ------------------------------------------------------------------------------
# MRadmin misst jede Sekunde TPS, MSPT (Durchschnitt, 95 %, Spitze), CPU, Arbeitsspeicher, Garbage Collection,
# Spieler, Chunks und Entities - wie der Health-Report von spark. Zu sehen in der Weboberfläche unter "Health"
# (Permission mradmin.status.health). Die Messung kostet praktisch nichts: es werden nur Werte gelesen, die Java
# und Paper ohnehin führen.
health:
  # Wie lange der Verlauf aufbewahrt wird: 24h, 7d oder 30d. Die letzte Stunde ist sekündlich da, 24 Stunden im 10-Sekunden-Takt,
  # ältere Werte als 5-Minuten-Mittel (mit storage sqlite/mysql bzw. der Datei health.log - übersteht Neustarts).
  history: 7d
  # Warnung an das Team (ingame, mradmin.status.health) und ins Discord-Log, wenn die TPS so lange unter der Grenze
  # liegt - und Entwarnung, sobald sie sich erholt hat.
  alert:
    enabled: true
    below-tps: 15
    minutes: 5


# ------------------------------------------------------------------------------
#   9) MENÜS
# ------------------------------------------------------------------------------
gui:
  # Wie oft offene Menüs aktualisiert werden (in Ticks, 20 = 1 Sekunde).
  refresh-ticks: 20
  sounds: true


# ------------------------------------------------------------------------------
#   10) SPEICHER
# ------------------------------------------------------------------------------
# Wo MRadmin Tickets, Wartungen, eingefrorene Spieler und (später) die Web-Konten speichert.
#   yaml   = Dateien im Plugin-Ordner (Standard, wie bisher)
#   sqlite = eine Datei plugins/MRadmin/mradmin.db - empfohlen ab vielen Tickets und für die Weboberfläche
#   mysql  = MySQL oder MariaDB (z.B. für mehrere Server mit gemeinsamen Tickets)
# Gespeichert wird immer im Hintergrund, der Server laggt dabei nicht. Änderungen hier wirken erst nach einem
# Neustart. Beim ersten Start mit sqlite/mysql werden die bisherigen YAML-Daten automatisch übernommen (die Dateien
# bleiben als *.migrated.yml). Ist die Datenbank nicht erreichbar, nutzt MRadmin vorerst die YAML-Dateien.
# Die Treiber lädt Paper beim ersten Start selbst herunter (Ordner libraries/ im Server).
storage:
  type: yaml
  mysql:
    host: localhost
    port: 3306
    database: mradmin
    username: ""
    password: ""
    # Gleichzeitige Verbindungen zur Datenbank.
    pool-size: 4
  # Name dieses Servers in der Datenbank - nur wichtig, wenn sich später mehrere Server eine Datenbank teilen.
  server-id: "main"
  # Vor jeden Tabellennamen (z.B. mradmin_tickets), falls die Datenbank auch für anderes genutzt wird.
  table-prefix: "mradmin_"


# ------------------------------------------------------------------------------
#   11) WEBOBERFLÄCHE
# ------------------------------------------------------------------------------
# MRadmin vom Handy, Tablet oder PC bedienen (zuerst Tickets und Server-Status). Der eingebaute Webserver lauscht
# nur lokal - erreichbar wird er über deinen Reverse Proxy (nginx, Caddy, Traefik, Cloudflare ...) mit HTTPS und
# Domain, z.B. https://admin.deinserver.de -> http://127.0.0.1:8125. Für die Weboberfläche empfiehlt sich
# storage.type: sqlite (siehe oben).
#
# Konto einrichten: ingame /mradmin web setup (Permission mradmin.web) oder in der Konsole
# /mradmin web invite <spieler> -> Link (10 Minuten, einmalig) -> Passwort + Code einer Authenticator-App
# (z.B. Google Authenticator, Aegis). Dazu gibt es Wiederherstellungscodes. Passwort oder Handy weg? Einfach einen
# neuen Einrichtungslink holen. Im Web gelten dieselben Permissions wie ingame.
web:
  enabled: false
  # Nur ändern, wenn der Reverse Proxy auf einem anderen Rechner läuft (dann z.B. "0.0.0.0" + Firewall!).
  bind: "127.0.0.1"
  port: 8125
  # Öffentliche Adresse, unter der die Oberfläche erreichbar ist (für Links und Anmeldungen), z.B.
  # "https://admin.deinserver.de". Ohne HTTPS werden Anmelde-Cookies nicht als "Secure" markiert - nur zum Testen.
  public-url: ""
  # Adressen deines Reverse Proxys. Nur denen glaubt MRadmin die echte Besucher-IP (X-Forwarded-For) - wichtig für
  # die Begrenzung der Anmeldeversuche und das Protokoll.
  trusted-proxies: ["127.0.0.1"]
  # So lange bleibt ein Gerät angemeldet (Tage). Abmelden geht jederzeit im Web oder mit /mradmin web logout.
  session-days: 30
  login:
    # Passkeys (Fingerabdruck, Face ID, Windows Hello) - folgt in einer der nächsten Versionen.
    passkeys: true
    # Passwort - immer zusammen mit einem Code aus der Authenticator-App.
    password: true
  # Nur OHNE LuckPerms: welche Rechte Web-Nutzer haben. Mit LuckPerms gelten einfach die normalen Permissions.
  # Operatoren dürfen alles; sonst Rolle -> Permissions ("*" = alles, "mradmin.*" = alles von MRadmin) und
  # Spieler (Name oder UUID) -> Rolle. Beispiel:
  #   roles:
  #     support: ["mradmin.support", "mradmin.status"]
  #   players:
  #     Steve: support
  roles: {}
  players: {}
  # Impressum und Datenschutzerklärung - verlinkt in der Fußzeile jeder Seite (auch auf der Anmeldeseite).
  # Leer = die Texte aus plugins/MRadmin/web/impressum.md und datenschutz.md (beim ersten Start als Vorlage angelegt,
  # bitte ausfüllen). Oder hier die Adresse eigener Seiten eintragen, z.B. "https://deinserver.de/impressum".
  legal:
    imprint-url: ""
    privacy-url: ""
  privacy:
    # Einträge im Protokoll der Weboberfläche (mit IP-Adressen) nach dieser Zeit automatisch löschen.
    audit-retention: "90d"
    # IP-Adressen nur gekürzt speichern (1.2.3.4 -> 1.2.3.0) - im Protokoll und bei den angemeldeten Geräten.
    # Weniger personenbezogen, Missbrauch lässt sich aber schlechter nachverfolgen.
    mask-ip: false
  # Web-Konsole: Live-Log (Permission mradmin.web.console.view) und Befehle (mradmin.web.console.execute). Beide
  # stecken in keinem Paket (auch nicht in mradmin.admin) und müssen bewusst einzeln vergeben werden. Vor dem Öffnen
  # fragt die Oberfläche noch einmal nach dem Code aus der Authenticator-App. Jeder Befehl landet im Web-Protokoll
  # und im Discord-Log (web-console).
  console:
    enabled: true
    # So lange bleibt die Konsole nach dem Code offen (Minuten, pro Gerät).
    unlock-minutes: 15
    # So viele der neuesten Zeilen hält MRadmin vor.
    lines: 1000
    # Diese Befehle gehen über die Web-Konsole nie - auch nicht versteckt in "execute ... run". Verglichen wird der
    # Anfang des Befehls, ohne "/" und ohne Namespace ("minecraft:op" = "op"). Mehrere Wörter gehen auch ("mradmin web").
    blocked: ["op", "deop", "stop", "restart", "reload", "lp", "luckperms", "perm", "perms", "permissions", "pex",
      "mradmin web", "whitelist off", "save-off"]
    # Links und IP-Adressen in der Ausgabe ausblenden (z.B. Einrichtungslinks, IPs beim Join).
    hide-links: true
    hide-ips: true
