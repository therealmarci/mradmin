# ==============================================================================
#   MRadmin - Configuration
# ==============================================================================
#   After changes:   /mradmin reload   (no restart needed)
#   Dashboard:       /mradmin        Command list: /mradmin help
#   Help & docs:     https://mrtechnology.marcelr.at/docs/mradmin/
#
#   Durations: d = days, h = hours, m = minutes, s = seconds,
#              e.g. "30s", "15m", "1h30m". A plain number counts as minutes.
#
#   Texts & messages (also announcement presets and Discord): lang/de.yml or lang/en.yml.
#
#   This file is UTF-8 encoded. If special characters (ä, ö, ü) look wrong,
#   set the encoding in your editor to "UTF-8".
# ==============================================================================

# Do not change - used for automatic config updates.
config-version: 22

# Language of the texts (chat, menus, titles, boss bars). The texts are in plugins/MRadmin/lang/<language>.yml.
#   auto = every player gets the language set in their Minecraft client:
#          German (also Austria/Switzerland) -> de.yml, English -> en.yml, a language without a file -> fallback-language.
#   de / en / ... = fixed language for all players.
# The console is always English. Own language: copy a file (e.g. as fr.yml) and translate it - with "auto"
# French players then get it automatically. The web interface follows the browser language.
language: auto

# Language for players whose Minecraft language has no file of its own.
fallback-language: en

# Language of texts that are not meant for a single player: Discord logs and announcements, the server list
# during maintenance, push notifications, mails, notes in tickets.
server-language: en

# Time zone for all displayed times, e.g. "Europe/Vienna" or "Europe/Berlin". Empty = the server's time zone.
timezone: ""

# Switch features on and off. A switched-off feature disappears completely: its commands report
# "switched off", its buttons are missing from the menus and it no longer interferes anywhere. Stored data (tickets,
# scheduled maintenance ...) is kept and is back after switching it on again. Takes effect with /mradmin reload.
# Discord logs, Discord announcements, Uptime Kuma and the update check have their switch (enabled) in their
# own section further down.
features:
  # Maintenance mode: countdown, boss bar, MOTD, join lock (including the Uptime Kuma connection).
  maintenance: true
  # Announcements: /mradmin announce and the announcement menu.
  announce: true
  # Admin mode: /mradmin mode and the admin compass. Whoever is in admin mode when this is switched off gets their
  # inventory back immediately (offline: on the next join).
  admin-mode: true
  # Player tools in the player menu: teleport to players (also /mradmin tp), summon players, view inventory and
  # ender chest, freeze (when switched off, frozen players are free immediately).
  teleport: true
  summon: true
  inventory: true
  freeze: true
  # Server status: /mradmin status and the server tile in the dashboard.
  server-status: true
  # Tickets & reports: /report and /mradmin tickets.
  tickets: true
  # Staff chat: /sc.
  staff-chat: true

# Working together with my other plugins. MRadmin detects them automatically - also when they are loaded or
# removed later - and adapts the menus by itself: button in the dashboard with live info, info in the player menu,
# suspicious chunk loaders in the server status with MRchunks, a player's belts with MRtoolbar (view only, like
# inventory and ender chest). If a plugin is not installed, only its part is missing.
# All plugins also run on their own. false = do not connect, even if the plugin is installed.
integrations:
  mrsleep: true
  mrchunks: true
  mrtoolbar: true
  mrpvp: true
  # LibertyBans: bans, mutes, warns and kicks on the player page in the web interface. LibertyBans' permissions apply
  # (e.g. libertybans.ban.do.target.uuid, libertybans.list.history), also its duration permissions, if switched on.
  libertybans: true

# Quick choices for bans and mutes on the player page in the web interface ("perm" = permanent).
libertybans:
  durations: ["1h", "1d", "7d", "30d", "perm"]


# ------------------------------------------------------------------------------
#   1) MAINTENANCE
# ------------------------------------------------------------------------------
# During maintenance only players with the permission "mradmin.maintenance.bypass" can join
# (in LuckPerms e.g. give it to the staff group: /lp group staff permission set mradmin.maintenance.bypass true).
# Maintenance comes from Uptime Kuma (section uptime-kuma below) or by command:
#   /mradmin maintenance                        status
#   /mradmin maintenance on [duration]          start now (without duration: until "off")
#   /mradmin maintenance schedule <in> [duration]  scheduled maintenance with countdown, e.g. "schedule 15m 1h"
#   /mradmin maintenance off                    end it or cancel the schedule
maintenance:
  # The boss bar with countdown appears this long before the start.
  warn-before: "15m"

  # Boss bar with a countdown before the start (all players) and with the remaining time during maintenance (staff only).
  bossbar:
    enabled: true
    # Colours: PINK, BLUE, RED, GREEN, YELLOW, PURPLE, WHITE
    color: YELLOW
    # In the last "final-seconds" seconds before the start the colour changes to final-color.
    final-color: RED
    final-seconds: 60
    # Segments: PROGRESS (continuous), NOTCHED_6, NOTCHED_10, NOTCHED_12, NOTCHED_20
    overlay: NOTCHED_10
    # During maintenance show staff a boss bar with the remaining time (if the end is known).
    show-during-maintenance: true
    during-color: PURPLE

  # Additional reminders before the start (chat message maintenance-reminder), each this long before.
  reminders: ["15m", "10m", "5m", "2m", "1m", "30s"]
  # From this many seconds before the start, a big countdown also runs on screen (0 = off).
  title-countdown-seconds: 10
  # Sound for reminders and countdown ("" = no sound). Names: https://jd.papermc.io/paper/org/bukkit/Sound.html
  sound: BLOCK_NOTE_BLOCK_PLING

  # Kick players without the bypass permission from the server when maintenance starts.
  kick-on-start: true
  # Kick this many seconds after the start (time to still read the message).
  kick-delay-seconds: 5

  # Server list during maintenance: text from the language file (maintenance-motd) instead of the normal MOTD.
  motd:
    enabled: true
    # Instead of the player count, "Maintenance" (maintenance-version-text) appears on the right in red.
    replace-version: true


# ------------------------------------------------------------------------------
#   2) UPTIME KUMA
# ------------------------------------------------------------------------------
# MRadmin logs in to Uptime Kuma like the web interface and follows the maintenance windows live:
# scheduled maintenance triggers the countdown, changes in Kuma (extending, moving, pausing,
# deleting) are applied immediately. Made for Uptime Kuma 2.x (1.23 should work as well).
# Uptime Kuma only knows one user - so enter your Kuma login here. It is only sent to Kuma.
uptime-kuma:
  enabled: false
  # Address of the web interface, e.g. "https://status.yourserver.com" or "http://192.168.1.10:3001"
  url: ""
  # Login: username + password ...
  username: ""
  password: ""
  # ... or a login token instead (needed if 2FA is active): log in to Kuma in the browser,
  # developer tools (F12) -> Application/Storage -> Local Storage -> copy the value of "token".
  # The token stays valid until the Kuma password is changed.
  token: ""

  # Which maintenance windows apply to THIS server? (Both lists empty = every maintenance in Kuma.)
  # monitor-ids: maintenance affecting one of these monitors. The ID is in the monitor's address,
  #              e.g. https://status.yourserver.com/dashboard/12  ->  12
  monitor-ids: []
  # maintenance-ids: exactly these maintenance windows (ID from https://status.yourserver.com/maintenance/3  ->  3)
  maintenance-ids: []

  # The list is additionally fetched again this often (otherwise changes arrive immediately).
  refresh-seconds: 60
  # After a lost connection, try again after this many seconds.
  reconnect-seconds: 30
  # If Kuma cannot be reached, the last known schedule stays valid (true) or is discarded (false).
  keep-schedule-when-offline: true


# ------------------------------------------------------------------------------
#   3) ANNOUNCEMENTS
# ------------------------------------------------------------------------------
# /mradmin announce <text>               own text (MiniMessage allowed, e.g. <red>Attention!)
# /mradmin announce <preset> [values...] prepared announcement from the language file (announce-presets)
# Also usable from the console/RCON, e.g. in the restart script:  mradmin announce restart 5m
#
# Freely combinable for scripts - every part is optional, only what is given is shown (values with spaces
# in "quotes"):
#   mradmin announce title="<red><bold>Restart" subtitle="<gray>in <white>5 minutes" chat="..." actionbar="..."
#                    discord="Restart in **5 minutes**" id=restart sound=BLOCK_NOTE_BLOCK_BELL stay=4 to=all
#   discord = text for the community Discord, id = name for the cooldown (so a countdown only posts once),
#   sound = Bukkit name or key ("none" = silent), stay/fade-in/fade-out in seconds,
#   to = "all" or a permission (e.g. mradmin.staffchat for the team only). -q = not to Discord.
# Own presets can use named values: <reason> in the text, called with  mradmin announce maintenance reason="Backup"
# (as {reason} in the discord text). The bundled presets use <args>:  mradmin announce restart 5m
announce:
  # How long the text stays on screen (in seconds).
  fade-in: 0.5
  stay: 6
  fade-out: 1
  # Also print it in the chat.
  chat: true
  # Sound ("" = no sound) with volume and pitch.
  sound: BLOCK_NOTE_BLOCK_BELL
  volume: 1.0
  pitch: 1.0


# ------------------------------------------------------------------------------
#   4) ADMIN MODE
# ------------------------------------------------------------------------------
# /mradmin mode on   inventory, armour, XP, health, hunger, effects and position are saved,
#                    you get into creative mode and only get the admin compass (menu: teleport, plugins, maintenance).
# /mradmin mode off  everything is restored exactly and you are back where you started.
# The saved state is in plugins/MRadmin/admin-mode/ and also survives crashes and restarts.
admin-mode:
  # Game mode in admin mode: CREATIVE or SPECTATOR
  gamemode: CREATIVE
  # Teleport back to the starting point when ending it.
  return-to-start: true
  # Teleport compass: material and slot in the hotbar (0-8).
  compass-material: COMPASS
  compass-slot: 4
  # Do not drop / pick up items in admin mode (protects against creative items in survival).
  prevent-drop: true
  prevent-pickup: true
  # What happens when an admin in admin mode leaves the server?
  #   true  = admin mode ends (everything back, teleport to the starting point)
  #   false = stays active, on the next join it continues in admin mode
  end-on-quit: false

  # Own buttons in the dashboard (row "Tools"), e.g. for the admin menu of another plugin. MRsleep,
  # MRchunks and MRtoolbar need no entry here, they come automatically (see integrations above). Every button runs a
  # command as the player, the respective plugin then checks the permissions itself. At most 6 buttons including MRsleep,
  # MRchunks and MRtoolbar, in the order given here.
  #   plugin:     only show if this plugin is installed ("" = always)
  #   permission: only show if the player has this permission ("" = everyone with the dashboard)
  #   enabled:    false = hide the button (e.g. instead of deleting it)
  # Name and description are in the language file under gui-hub-buttons.<name> (if missing there: the name from here).
  # Example:
  #   chunky:
  #     plugin: Chunky
  #     material: MAP
  #     command: "chunky progress"
  menu:
    buttons: {}


# ------------------------------------------------------------------------------
#   5) TICKETS & REPORTS
# ------------------------------------------------------------------------------
# /report opens the ticket menu for all players (permission mradmin.tickets.create): "Create ticket" (pick a category,
# then a form), the open tickets and the archive with the closed ones. In the ticket, players and
# team write back and forth like in a chat.
# The team (mradmin.tickets.notify) gets a message with [Open] and [Teleport]. All tickets are in the
# dashboard or under /mradmin tickets (mradmin.tickets.view, plus .reply, .claim, .close, .reopen, .teleport).
# Texts: lang/<language>.yml, sections ticket-... and ticket-categories.
tickets:
  # A player has to wait this long between two new tickets (team: no cooldown).
  cooldown: "60s"
  # Minimum time between two messages of a player in a ticket (against spam).
  reply-cooldown: "3s"
  # At most this many open tickets per player (all categories together).
  max-open-per-player: 3
  # Length of the subject (all categories except player reports) and of the texts. The form does not allow more.
  min-subject-length: 3
  max-subject-length: 50
  min-text-length: 10
  max-text-length: 500
  # Let the player know when the team has closed their ticket (if they are online). New replies
  # are always reported, when offline on the next join.
  notify-creator: true
  # Show the names of team members in the ticket. false = players only see "Team".
  show-staff-names: true
  # Picture next to team messages when the names are hidden (otherwise the team member's head).
  team-icon: "NETHER_STAR"
  # Whoever from the team answers first takes over the ticket automatically (further messages of the player then
  # only go to them while they are online).
  auto-claim: true
  # The ticket shows this many of the latest messages (older ones are hidden).
  shown-messages: 20
  # Sound for notices about new tickets and replies (Bukkit name or key). Empty = no sound.
  sound: "BLOCK_NOTE_BLOCK_PLING"
  # Keep closed tickets this long (also visible to the player), afterwards they are deleted.
  keep-closed: "7d"
  # With MRchunks: if a chunk loader is locked because of lag, its owner automatically gets a ticket with all
  # details of the lock (link in the chat). There they can explain what happened. Only the team can close it, and
  # the team can unlock the loader via "Chunk loader menu" in the ticket. If it is locked or unlocked again, that is noted in the same ticket.
  chunkloader-locks: true
  # Icon of all tickets in the menus (item name).
  icon: "NAME_TAG"
  # Categories offered when creating a ticket (in this order). Simply add your own, delete the ones you do not
  # need or hide them with enabled: false. Per category:
  #   name:       display name. Empty = text from the language file (ticket-categories.<id>), otherwise the ID.
  #   player:     true = player report: first the player is chosen, then the incident is described.
  #               false = normal ticket with subject and description.
  #   permission: only players with this permission see the category. Empty = everyone with mradmin.tickets.create.
  #   enabled:    false = hidden (existing tickets are kept).
  # Example of an own category:
  #   application:
  #     name: "Team application"
  #     player: false
  #     permission: ""
  # The ID (here "application") is stored in the ticket - do not change it any more once there are tickets with it.
  categories:
    cheating:
      name: ""
      player: true
    chat:
      name: ""
      player: true
    griefing:
      name: ""
      player: true
    scam:
      name: ""
      player: true
    bug:
      name: ""
      player: false
    other:
      name: ""
      player: false


# ------------------------------------------------------------------------------
#   6) DISCORD LOGS (admin)
# ------------------------------------------------------------------------------
# Create a webhook: Discord channel -> Edit Channel -> Integrations -> Webhooks
#                   -> New Webhook -> Copy Webhook URL.
# The texts of the events are in the language file (lang/<language>.yml, section discord).
# An event with "enabled: false" or an empty text is not sent.
# Not working? -> /mradmin discord shows the status, /mradmin discord test sends a test message.
discord:
  enabled: false
  # Full URL in quotes, e.g. "https://discord.com/api/webhooks/123456/abcdef"
  webhook-url: ""
  username: "MRadmin"
  avatar-url: ""
  use-embeds: true
  footer: "Minecraft-Server"
  events:
    maintenance-scheduled:
      enabled: true
      color: "#F1C40F"
    maintenance-changed:
      enabled: true
      color: "#3498DB"
    maintenance-cancelled:
      enabled: true
      color: "#95A5A6"
    maintenance-start:
      enabled: true
      color: "#E74C3C"
    maintenance-end:
      enabled: true
      color: "#2ECC71"
    kuma-connected:
      enabled: false
      color: "#2ECC71"
    kuma-disconnected:
      enabled: true
      color: "#E67E22"
    announce:
      enabled: true
      color: "#9B59B6"
    admin-mode-on:
      enabled: true
      color: "#E67E22"
    admin-mode-off:
      enabled: true
      color: "#1ABC9C"
    # Notices from other plugins, e.g. suspicious duels from MRpvp.
    plugin-alert:
      enabled: true
      color: "#E74C3C"
    admin-reload:
      enabled: true
      color: "#3498DB"
    ticket:
      enabled: true
      color: "#E67E22"
    # Every message in a ticket (off by default).
    ticket-message:
      enabled: false
      color: "#3498DB"
    ticket-closed:
      enabled: true
      color: "#2ECC71"
    ticket-reopened:
      enabled: true
      color: "#F1C40F"
    player-freeze:
      enabled: true
      color: "#3498DB"
    player-unfreeze:
      enabled: true
      color: "#95A5A6"
    player-kick:
      enabled: true
      color: "#E67E22"
    player-freeze-quit:
      enabled: true
      color: "#E74C3C"
    # Every staff chat message also in the admin Discord (off by default).
    staff-chat:
      enabled: false
      color: "#7F8C8D"
    # Logins to the web interface and setting up/resetting a web account.
    web-login:
      enabled: true
      color: "#3498DB"
    web-setup:
      enabled: true
      color: "#9B59B6"
    # Every command from the web console.
    web-console:
      enabled: true
      color: "#E74C3C"
    # The server lags for a longer time (health.alert) or has recovered.
    health-alert:
      enabled: true
      color: "#E74C3C"
    health-recovered:
      enabled: true
      color: "#2ECC71"
    plugin-update-downloaded:
      enabled: true
      color: "#3498DB"
    server-restart:
      enabled: true
      color: "#E67E22"
    server-restart-cancelled:
      enabled: true
      color: "#95A5A6"


# ------------------------------------------------------------------------------
#   7) DISCORD ANNOUNCEMENTS (community)
# ------------------------------------------------------------------------------
# Own webhook for the public announcement channel of your Discord - separate from the admin logs above.
# Deliberately sparing: at most 3 posts per maintenance (scheduled, started, ended). Moving, extending and
# cancelling are worked into the last post instead of posting again. Times appear as Discord timestamps
# (everyone sees them in their own time zone, with "in 2 hours").
# Texts: lang/<language>.yml, section discord-announce. Test: /mradmin discord test announce
discord-announce:
  enabled: false
  webhook-url: ""
  username: ""
  avatar-url: ""
  footer: ""
  # Role mentioned in the first post (e.g. @Server-News). Empty = nobody is pinged.
  # ID: Discord settings -> Advanced -> Developer Mode on, then right-click the role -> "Copy ID".
  ping-role-id: ""

  # Every maintenance gets ONE message that is edited as it goes: scheduled -> running -> ended (or cancelled).
  maintenance:
    enabled: true
    # Only post once the maintenance is at most this far away (ones created later: immediately).
    # Prevents recurring maintenance from being posted far in advance.
    announce-ahead: "24h"
    # Do not post shorter maintenance at all ("0" = post all).
    min-length: "0"
    # Mention ping-role-id when a maintenance is posted (never in the later edits).
    ping: true
    # New times or titles in quick succession are combined into one edit. Start and end are edited in right away.
    debounce-seconds: 60

  announcements:
    # Post announcements: presets with a "discord" text in the language file automatically (except with -q),
    # own texts only with -d, e.g. /mradmin announce -d Event tonight!
    enabled: true
    # Post the same preset at most once within this time (restart script with 5m/1m = one post).
    cooldown: "10m"
    ping: false

  colors:
    scheduled: "#F1C40F"
    started: "#E74C3C"
    ended: "#2ECC71"
    cancelled: "#95A5A6"
    announce: "#9B59B6"


# ------------------------------------------------------------------------------
#   8) UPDATE CHECK
# ------------------------------------------------------------------------------
update-checker:
  enabled: true
  # Source: "github" (GitHub Releases, default) or "modrinth"
  source: github
  # Also report beta/alpha versions. If a pre-release (0.x) is running, they are always reported.
  include-prereleases: false
  interval-hours: 6
  # Notify players with "mradmin.admin.update" when they join the server.
  notify-on-join: true


# ------------------------------------------------------------------------------
#   VERSIONS & RESTART (web interface, page "Versions")
# ------------------------------------------------------------------------------
# All installed MRtechnology plugins with their updates. Downloads come only from the official GitHub release of
# each plugin (for this Minecraft version, checked with the SHA-256 checksum) and go to plugins/update/ - Paper
# installs them on the next start. Nothing is replaced while the server runs.
versions:
  enabled: true
  # How often to look for new versions (hours).
  check-interval-hours: 6
  # Download new versions by themselves: "off", "patch" (only hotfixes 1.2.x), "minor" (1.x), "all".
  auto-download: "off"
  # Also offer beta/alpha versions. If a pre-release (0.x) is installed, newer 0.x versions are always offered.
  include-prereleases: false
  # Restart button in the web interface. A server cannot start itself again - something outside has to do it:
  #   none   = no restart button (default); after downloading, the page says "restart needed"
  #   stop   = the server stops; your start script with a loop, a watchdog or your hosting panel starts it again
  #   script = the server's own restart: runs restart-script from spigot.yml (settings.restart-script)
  # Only switch it on if you know the server comes back - otherwise the button just stops it.
  restart-method: none
  # Countdown choices of the restart button, announced like /mradmin announce restart ("now" = without countdown).
  restart-delays: ["5m", "1m", "now"]


# ------------------------------------------------------------------------------
#   SERVER HEALTH
# ------------------------------------------------------------------------------
# MRadmin measures TPS, MSPT (average, 95 %, peak), CPU, memory, garbage collection, players, chunks and
# entities every second - like spark's health report. Visible in the web interface under "Health"
# (permission mradmin.status.health). Measuring costs practically nothing: it only reads values Java
# and Paper keep anyway.
health:
  # How long the history is kept: 24h, 7d or 30d. The last hour is there per second, 24 hours in 10-second steps,
  # older values as 5-minute averages (with storage sqlite/mysql or the file health.log - survives restarts).
  history: 7d
  # Warning to the team (in game, mradmin.status.health) and to the Discord log when the TPS stays below the limit
  # for this long - and an all-clear as soon as it has recovered.
  alert:
    enabled: true
    below-tps: 15
    minutes: 5


# ------------------------------------------------------------------------------
#   9) MENUS
# ------------------------------------------------------------------------------
gui:
  # How often open menus are refreshed (in ticks, 20 = 1 second).
  refresh-ticks: 20
  sounds: true


# ------------------------------------------------------------------------------
#   10) STORAGE
# ------------------------------------------------------------------------------
# Where MRadmin stores tickets, maintenance, frozen players and the web accounts.
#   yaml   = files in the plugin folder (default)
#   sqlite = one file plugins/MRadmin/mradmin.db - recommended with many tickets and for the web interface
#   mysql  = MySQL or MariaDB (e.g. for several servers sharing tickets)
# Saving always happens in the background, the server does not lag. Changes here only take effect after a
# restart. On the first start with sqlite/mysql, the previous YAML data is taken over automatically (the files
# stay as *.migrated.yml). If the database cannot be reached, MRadmin uses the YAML files for the time being.
# Paper downloads the drivers itself on the first start (folder libraries/ of the server).
storage:
  type: yaml
  mysql:
    host: localhost
    port: 3306
    database: mradmin
    username: ""
    password: ""
    # Simultaneous connections to the database.
    pool-size: 4
  # Name of this server in the database - only relevant if several servers share one database later.
  server-id: "main"
  # Put before every table name (e.g. mradmin_tickets), in case the database is also used for other things.
  table-prefix: "mradmin_"


# ------------------------------------------------------------------------------
#   11) WEB INTERFACE
# ------------------------------------------------------------------------------
# Control MRadmin from your phone, tablet or PC. The built-in web server only listens
# locally - it becomes reachable through your reverse proxy (nginx, Caddy, Traefik, Cloudflare ...) with HTTPS and
# a domain, e.g. https://admin.yourserver.com -> http://127.0.0.1:8125. For the web interface,
# storage.type: sqlite is recommended (see above).
#
# Set up an account: in game /mradmin web setup (permission mradmin.web) or in the console
# /mradmin web invite <player> -> link (10 minutes, single use) -> password + code from an authenticator app
# (e.g. Google Authenticator, Aegis). There are also recovery codes. Password or phone gone? Simply get a
# new setup link. The web interface uses the same permissions as the game.
web:
  enabled: false
  # Only change this if the reverse proxy runs on another machine (then e.g. "0.0.0.0" + firewall!).
  bind: "127.0.0.1"
  port: 8125
  # Public address under which the interface can be reached (for links and logins), e.g.
  # "https://admin.yourserver.com". Without HTTPS, login cookies are not marked "Secure" - for testing only.
  public-url: ""
  # Addresses of your reverse proxy. MRadmin only trusts these for the real visitor IP (X-Forwarded-For) - important for
  # limiting login attempts and for the log.
  trusted-proxies: ["127.0.0.1"]
  # A device stays logged in this long (days). Logging out is possible at any time in the web or with /mradmin web logout.
  session-days: 30
  login:
    # Passkeys (fingerprint, Face ID, Windows Hello, password manager): add them in the web under "Account" (with a code
    # from the app), then log in without password and code. They only work for the address from public-url (without it:
    # only http://localhost for testing). A reset via setup link removes all passkeys of the account.
    passkeys: true
    # Password - always together with a code from the authenticator app.
    password: true
    # Log in with Discord: create a Discord application (https://discord.com/developers/applications), under OAuth2 add
    # the redirect "<public-url>/api/discord/callback" (without public-url: http://localhost:<port>/...),
    # enter client ID and secret here. Everyone links their Discord in the web under Account -> Security (only
    # possible while logged in). With Discord linked, 2FA can be switched off - like with a passkey.
    # The secret is secret: do not share it; if it happens anyway, regenerate it in Discord.
    discord:
      enabled: false
      client-id: ""
      client-secret: ""
  # Item pictures (inventories, kit editor): MRadmin fetches the textures and item names of your Minecraft version once
  # from Mojang (the official game client, about 40 MB, checked with its checksum) and keeps only the finished pictures
  # under plugins/MRadmin/items/. Nothing of it is in the plugin itself - Mojang does not allow passing it on.
  # false = no download; items then show short labels instead of pictures.
  item-icons: true
  # Only WITHOUT LuckPerms: which permissions web users have. With LuckPerms the normal permissions simply apply.
  # Operators may do everything; otherwise role -> permissions ("*" = everything, "mradmin.*" = everything of MRadmin) and
  # player (name or UUID) -> role. Example:
  #   roles:
  #     support: ["mradmin.groups.support", "mrpvp.groups.support"]
  #   players:
  #     Steve: support
  roles: {}
  players: {}
  # Imprint and privacy policy - linked in the footer of every page (also on the login page).
  # Empty = the texts from plugins/MRadmin/web/impressum.md and datenschutz.md (created as templates on the first start,
  # please fill them in). Or enter the address of your own pages here, e.g. "https://yourserver.com/imprint".
  legal:
    imprint-url: ""
    privacy-url: ""
  # Push notifications (Account -> Notifications).
  push:
    # Contact MRadmin sends along with every push message to the push services (Google, Mozilla, Apple):
    # "mailto:you@yourserver.com" or "https://yourserver.com". Empty = public-url (if it starts with https://).
    # Apple (iPhone, iPad, Safari) rejects push messages without a valid contact - i.e. without an https public-url and
    # without contact, or with localhost / .local. Then nothing arrives on Apple devices.
    contact: ""
  privacy:
    # Delete entries in the web interface's log (with IP addresses) automatically after this time.
    audit-retention: "90d"
    # Only store shortened IP addresses (1.2.3.4 -> 1.2.3.0) - in the log and for the logged-in devices.
    # Less personal, but misuse is harder to trace.
    mask-ip: false
  # Web console: live log (permission mradmin.web.console.view, in mradmin.groups.support) and commands
  # (mradmin.web.console.execute, in mradmin.groups.admin - as powerful as the server console). Before opening,
  # the interface asks once more for the code from the authenticator app. Every command ends up in the web log
  # and in the Discord log (web-console).
  console:
    enabled: true
    # The console stays open this long after the code (minutes, per device).
    unlock-minutes: 15
    # MRadmin keeps this many of the newest lines.
    lines: 1000
    # These commands never work through the web console - not even hidden in "execute ... run". The start of the
    # command is compared, without "/" and without namespace ("minecraft:op" = "op"). Several words work too ("mradmin web").
    blocked: ["op", "deop", "stop", "restart", "reload", "lp", "luckperms", "perm", "perms", "permissions", "pex",
      "mradmin web", "whitelist off", "save-off"]
    # Hide links and IP addresses in the output (e.g. setup links, IPs on join).
    hide-links: true
    hide-ips: true
  # Public forms of the web interface - reachable without logging in, they end up as tickets with you.
  requests:
    # Unban requests under <public-url>/entbannung (needs LibertyBans). Whoever is banned sees a personal code in
    # the ban message when joining - only with it a request can be made and the ban reason viewed.
    # There is one request per ban; if you decline it, one appeal. After that the decision is final.
    unban:
      enabled: true
      # Append the address and code to LibertyBans' ban message (text: "unban-kick" in the language file).
      kick-message: true
    # Contact form under <public-url>/kontakt, linked below the imprint. These requests only exist in the web,
    # they never show up in game. Replies go out by mail (see "mail" below).
    contact:
      enabled: true
    # Also send the team's replies and decisions by mail (if an address was given and "mail" is
    # set up). The status link is always shown right after submitting.
    notify-by-mail: true
    # Length of the message (justification, appeal, contact request).
    min-text-length: 20
    max-text-length: 3000
    # Spam protection, without any external services: an invisible honeypot field, a minimum time to fill in, a small
    # calculation the browser solves in the background, and these limits.
    spam:
      # At most this many requests per IP address and hour.
      per-ip-per-hour: 5
      # If this many contact requests are open, the form accepts no new ones until you have closed some.
      max-open-contact: 50
      # Difficulty of the calculation (0 = off, 16 = about one second on a phone, every +1 doubles the time).
      proof-of-work: 16

# Sending mail (SMTP) for replies to unban requests and contact requests. Everything works without sending
# mail too: requesters see replies via their status link, and for contact requests a button in the ticket opens
# your own mail program. Test: /mradmin mail test <address>
mail:
  enabled: false
  host: ""
  # ssl (usually port 465), starttls (usually 587) or none (only for a mail server on the same machine).
  security: "starttls"
  port: 587
  username: ""
  # Keep it secret. Many providers (Gmail, Outlook ...) need a separate app password.
  password: ""
  # Sender, e.g. "noreply@yourserver.com" - your mail server has to allow it.
  from: ""
  from-name: "MRadmin"
  # Where replies to the mails should go (empty = to the sender). Note: what arrives there does NOT end up in the
  # ticket - the mails point out to reply via the status link.
  reply-to: ""
