      - key: web.requests.application.enabled
        type: bool
        name: {de: Whitelist-Bewerbung, en: Whitelist application}
        help: {de: "Besucher bewerben sich auf der Startseite (Widget) oder unter /bewerben mit Name, Minecraft-Name und E-Mail. Nach der Bestätigung per Mail kommt die Bewerbung als Ticket. Braucht den Mailversand.", en: "Visitors apply on the start page (widget) or at /bewerben with name, Minecraft name and e-mail. After confirming by mail the application arrives as a ticket. Needs mail."}
      - key: web.requests.application.server-address
        type: string
        when: web.requests.application.enabled
        name: {de: Serveradresse in der Annahme-Mail, en: Server address in the acceptance mail}
        help: {de: "z.B. play.example.com - leer = Hinweis auf die Website.", en: "e.g. play.example.com - empty = see the website."}
      - key: web.requests.notify-by-mail
        type: bool
        name: {de: Antworten auch per Mail, en: Replies by mail too}
        help: {de: Wenn eine Adresse angegeben wurde und Mail eingerichtet ist., en: If an address was given and mail is set up.}
      - key: web.requests.min-text-length
        heading: {de: "Texte & Spamschutz", en: "Texts & spam protection"}
        advanced: true
        type: int
        min: 1
        max: 1000
        unit: {de: Zeichen, en: characters}
        name: {de: Text mindestens, en: Text at least}
        help: {de: "Mindestlänge der Nachricht (Begründung, Einspruch, Kontaktanfrage).", en: "Minimum length of the message (justification, appeal, contact request)."}
      - key: web.requests.max-text-length
        advanced: true
        type: int
        min: 100
        max: 20000
        unit: {de: Zeichen, en: characters}
        name: {de: Text höchstens, en: Text at most}
        help: {de: "Höchstlänge der Nachricht.", en: "Maximum length of the message."}
      - key: web.requests.spam.per-ip-per-hour
        advanced: true
        type: int
        min: 1
        max: 1000
        name: {de: Anträge pro IP und Stunde, en: Requests per IP and hour}
        help: {de: "Höchstens so viele Anfragen pro IP-Adresse und Stunde.", en: "At most this many requests per IP address and hour."}
      - key: web.requests.spam.max-open-contact
        advanced: true
        type: int
        min: 1
        max: 10000
        name: {de: Höchstens offene Kontaktanfragen, en: At most open contact requests}
        help: {de: "Sind so viele Kontaktanfragen offen, nimmt das Formular keine neuen an, bis welche geschlossen sind.", en: "If this many contact requests are open, the form takes no new ones until some are closed."}
      - key: web.requests.spam.proof-of-work
        advanced: true
        type: int
        min: 0
        max: 24
        name: {de: Rechenaufgabe gegen Spam, en: Calculation against spam}
        help: {de: "0 = aus, 16 = etwa eine Sekunde am Handy, jede +1 verdoppelt.", en: "0 = off, 16 = about one second on a phone, every +1 doubles."}

  - id: mail
    name: {de: Mail-Versand, en: Sending mail}
    group: {de: "Weboberfläche & Karte", en: "Web interface & map"}
    help: {de: "Für Antworten auf Entbannungsanträge und Kontaktanfragen. Test: /mradmin mail test <Adresse>.", en: "For replies to unban requests and contact requests. Test: /mradmin mail test <address>."}
    fields:
      - key: mail.enabled
        type: bool
        name: {de: Mails senden, en: Send mail}
        help: {de: "Mails senden für Antworten auf Entbannungs- und Kontaktanfragen. Ohne Mail sehen Antragsteller Antworten über ihren Statuslink. Test: /mradmin mail test.", en: "Send mail for replies to unban and contact requests. Without mail, requesters see replies via their status link. Test: /mradmin mail test."}
      - key: mail.host
        type: string
        when: mail.enabled
        max-length: 200
        name: {de: SMTP-Server, en: SMTP server}
        help: {de: "Adresse deines SMTP-Servers, z.B. smtp.example.com.", en: "Address of your SMTP server, e.g. smtp.example.com."}
      - key: mail.security
        type: choice
        when: mail.enabled
        name: {de: Verschlüsselung, en: Encryption}
        help: {de: "SSL (meist Port 465), STARTTLS (meist 587) oder keine (nur für einen Mailserver auf demselben Rechner).", en: "SSL (usually port 465), STARTTLS (usually 587) or none (only for a mail server on the same machine)."}
        options:
          - {value: starttls, de: STARTTLS (587), en: STARTTLS (587)}
          - {value: ssl, de: SSL (465), en: SSL (465)}
          - {value: none, de: Keine, en: None}
      - key: mail.port
        type: int
        when: mail.enabled
        min: 1
        max: 65535
        name: {de: Port, en: Port}
        help: {de: "Port des SMTP-Servers - passend zur Verschlüsselung.", en: "Port of the SMTP server - matching the encryption."}
      - key: mail.username
        type: string
        when: mail.enabled
        max-length: 200
        name: {de: Benutzer, en: User}
        help: {de: "Benutzer für die Anmeldung am SMTP-Server.", en: "User for the login to the SMTP server."}
      - key: mail.password
        type: secret
        when: mail.enabled
        max-length: 300
        name: {de: Passwort, en: Password}
        help: {de: "Viele Anbieter brauchen ein eigenes App-Passwort.", en: "Many providers need a separate app password."}
      - key: mail.from
        type: string
        when: mail.enabled
        max-length: 200
        name: {de: Absender, en: Sender}
        help: {de: "Absenderadresse, z.B. noreply@example.com - dein Mailserver muss sie erlauben.", en: "Sender address, e.g. noreply@example.com - your mail server has to allow it."}
      - key: mail.from-name
        type: string
        when: mail.enabled
        max-length: 100
        name: {de: Absendername, en: Sender name}
        help: {de: "Name, der beim Empfänger als Absender erscheint.", en: "Name the recipient sees as the sender."}
      - key: mail.reply-to
        type: string
        when: mail.enabled
        max-length: 200
        name: {de: Antwort an, en: Reply to}
        help: {de: "Leer = an den Absender. Was dort ankommt, landet nicht im Ticket.", en: "Empty = to the sender. What arrives there does not end up in the ticket."}

  - id: map
    name: {de: Karte, en: Map}
    group: {de: "Weboberfläche & Karte", en: "Web interface & map"}
    help: {de: "Die Karte der Spielerseite. squaremap rendert nur die Bilder - MRadmin installiert, aktualisiert und richtet es selbst ein.", en: "The map of the player page. squaremap only renders the pictures - MRadmin installs, updates and sets it up by itself."}
    fields:
      - key: map.enabled
        heading: {de: "Allgemein", en: "General"}
        type: bool
        name: {de: Karte an, en: Map on}
        help: {de: "Karte auf der Spielerseite (Tab Karte) und in /mradmin map. Die Bilder rendert squaremap.", en: "Map on the player page (tab Map) and in /mradmin map. squaremap renders the pictures."}
      - key: map.auto-configure
        advanced: true
        type: bool
        when: map.enabled
        name: {de: squaremap selbst einrichten, en: Set up squaremap by itself}
        help: {de: "Bei jedem Start. Von Hand geänderte Werte bleiben.", en: "On every start. Values changed by hand stay."}
      - key: map.hide-module-worlds
        type: bool
        when: map.enabled
        name: {de: Welten der Plugins ausblenden, en: Hide the worlds of plugins}
        help: {de: "Z.B. die Arena-Welt von MRpvp.", en: "E.g. MRpvp's arena world."}
      - key: map.squaremap.auto-install
        heading: {de: "squaremap", en: "squaremap"}
        type: bool
        when: map.enabled
        name: {de: squaremap selbst installieren, en: Install squaremap by itself}
        help: {de: "squaremap selbst installieren, wenn es fehlt: offizielles Release von Modrinth, nur mit passender SHA-512-Prüfsumme. Aktiv nach dem nächsten Neustart.", en: "Install squaremap by itself if missing: official release from Modrinth, only with a matching SHA-512 checksum. Active after the next restart."}
      - key: map.squaremap.auto-update
        type: bool
        when: map.enabled
        name: {de: squaremap selbst aktualisieren, en: Update squaremap by itself}
        help: {de: "Neue squaremap-Versionen nach plugins/update/ laden - Paper installiert sie beim nächsten Neustart.", en: "Download new squaremap versions into plugins/update/ - Paper installs them on the next restart."}
      - key: map.squaremap.full-render
        advanced: true
        type: bool
        when: map.enabled
        name: {de: Nach Installation alles neu zeichnen, en: Redraw everything after installing}
        help: {de: "Nach Installation oder Update alle Welten einmal komplett neu zeichnen (im Hintergrund), damit die Bilder zur neuen Version passen.", en: "After installing or updating, render all worlds once completely (in the background), so the pictures match the new version."}
      - key: map.squaremap.check-hours
        advanced: true
        type: int
        when: map.enabled
        min: 1
        max: 168
        unit: {de: Stunden, en: hours}
        name: {de: Nach squaremap-Updates sehen alle, en: Look for squaremap updates every}
        help: {de: "So oft fragt MRadmin bei Modrinth nach neuen squaremap-Versionen.", en: "This often MRadmin asks Modrinth for new squaremap versions."}
      - key: map.nether-roof.enabled
        heading: {de: "Netherdecke", en: "Nether ceiling"}
        type: bool
        when: map.enabled
        name: {de: Netherdecke als eigene Karte, en: Nether ceiling as its own map}
        help: {de: "Die Netherdecke (Bedrock und alles, was darauf gebaut ist) als eigene Karte - squaremap zeigt den Nether nur von innen.", en: "The Nether ceiling (bedrock and everything built on it) as its own map - squaremap only shows the Nether from inside."}
      - key: map.nether-roof.from-y
        advanced: true
        type: int
        when: map.nether-roof.enabled
        min: 100
        max: 320
        name: {de: Auf der Decke ab Höhe, en: On the ceiling from height}
        help: {de: "Ab dieser Höhe gilt ein Spieler als „auf der Decke“ und die Karte wechselt dorthin (die Bedrockdecke endet bei 127).", en: "From this height a player counts as on the ceiling and the map switches there (the bedrock ceiling ends at 127)."}
      - key: map.nether-roof.full-render
        advanced: true
        type: bool
        when: map.nether-roof.enabled
        name: {de: Decke einmal komplett zeichnen, en: Draw the ceiling once completely}
        help: {de: "Die Decke einmal komplett zeichnen (alle erzeugten Chunks). Danach kommen Änderungen beim Laden von Chunks dazu.", en: "Draw the ceiling once completely (all generated chunks). After that, changes are added when chunks load."}
      - key: map.nether-roof.chunks-per-second
        advanced: true
        type: int
        when: map.nether-roof.enabled
        min: 1
        max: 1000
        unit: {de: Chunks/s, en: chunks/s}
        name: {de: Tempo beim Zeichnen, en: Drawing speed}
        help: {de: Kleiner wenn der Server dabei langsamer wird., en: Lower it if the server gets slower meanwhile.}
      - key: map.player-page.open-at-player
        heading: {de: "Karte der Spielerseite", en: "Map of the player page"}
        type: bool
        when: map.enabled
        name: {de: Beim Spieler öffnen, en: Open at the player}
        help: {de: "Die Karte dort öffnen, wo der Spieler gerade steht (wenn er online ist). Ein Link auf eine Stelle hat Vorrang.", en: "Open the map where the player stands (if online). A link to a spot wins."}
      - key: map.player-page.follow
        type: bool
        when: map.enabled
        name: {de: "Knopf „Mir folgen“", en: "Button \"Follow me\""}
        help: {de: "Knopf „Mir folgen“: Die Karte hält den Spieler beim Laufen in der Mitte (nur online).", en: "Button Follow me: the map keeps the player in the middle while walking (only online)."}
      - key: map.player-page.chunk-grid
        type: bool
        when: map.enabled
        name: {de: Ebene Chunkraster, en: Layer chunk grid}
        help: {de: "Ebene „Chunkraster“ mit Linien an den Chunk-Grenzen - jeder Spieler schaltet sie selbst ein.", en: "Layer Chunk grid with lines along the chunk borders - each player switches it on themselves."}
      - key: map.player-page.players.self
        heading: {de: "Spieler auf der Karte", en: "Players on the map"}
        type: bool
        when: map.enabled
        name: {de: Sich selbst sehen, en: See oneself}
        help: {de: "Der Spieler sieht sich selbst auf der Karte (Kopf mit Blickrichtung).", en: "The player sees themselves on the map (head with viewing direction)."}
      - key: map.player-page.players.others
        type: bool
        when: map.enabled
        name: {de: Andere Spieler sehen, en: See other players}
        help: {de: "Braucht auch mradmin.map.players. Aus z.B. für Manhunt.", en: "Also needs mradmin.map.players. Off e.g. for a manhunt."}
      - key: map.player-page.players.update-seconds
        advanced: true
        type: int
        when: map.enabled
        min: 1
        max: 60
        unit: {de: Sekunden, en: seconds}
        name: {de: Positionen aktualisieren alle, en: Update positions every}
        help: {de: "So oft werden die Positionen aktualisiert, solange die Karte offen ist (1-60 Sekunden).", en: "This often the positions are updated while the map is open (1-60 seconds)."}
      - key: map.player-page.players.hide-admin-mode
        type: bool
        when: map.player-page.players.others
        name: {de: Admin-Modus verbergen, en: Hide admin mode}
        help: {de: "Spieler im Admin-Modus sehen andere nie auf der Karte.", en: "Others never see players in admin mode on the map."}
      - key: map.player-page.players.hide-spectators
        type: bool
        when: map.player-page.players.others
        name: {de: Zuschauer verbergen, en: Hide spectators}
        help: {de: "Spieler im Zuschauermodus sehen andere nie auf der Karte.", en: "Others never see players in spectator mode on the map."}
      - key: map.player-page.players.hide-invisible
        type: bool
        when: map.player-page.players.others
        name: {de: Unsichtbare verbergen, en: Hide invisible players}
        help: {de: "Unsichtbare Spieler sehen andere nie auf der Karte.", en: "Others never see invisible players on the map."}
      - key: map.player-page.players.hidden-worlds
        type: strings
        when: map.player-page.players.others
        name: {de: Welten ohne andere Spieler, en: Worlds without other players}
        help: {de: "Schlüssel wie minecraft:the_nether.", en: "Keys like minecraft:the_nether."}
      - key: map.player-page.players.allow-hide
        type: bool
        when: map.player-page.players.others
        name: {de: Spieler dürfen sich ausblenden, en: Players may hide themselves}
        help: {de: Wer sich ausblendet sieht auch keine anderen., en: Whoever hides sees no one else either.}

  - id: discord
    name: {de: Discord-Log (Team), en: Discord log (team)}
    group: {de: "Discord", en: "Discord"}
    help: {de: "Ereignisse in einen Team-Kanal. Webhook: Kanal bearbeiten → Integrationen → Webhooks → Neuer Webhook → URL kopieren.", en: "Events to a team channel. Webhook: Edit channel → Integrations → Webhooks → New webhook → copy URL."}
    fields:
      - key: discord.enabled
        heading: {de: "Webhook", en: "Webhook"}
        type: bool
        name: {de: Discord-Log senden, en: Send Discord log}
        help: {de: "Ereignisse von MRadmin (Wartung, Tickets, Neustarts, Abstürze …) per Webhook in einen Team-Kanal posten. Im Protokoll stehen sie immer.", en: "Post MRadmin's events (maintenance, tickets, restarts, crashes …) to a team channel via webhook. The log always has them."}
      - key: discord.webhook-url
        type: secret
        when: discord.enabled
        max-length: 300
        name: {de: Webhook-URL, en: Webhook URL}
        help: {de: "Webhook des Team-Kanals (Kanal-Einstellungen → Integrationen → Webhooks). Wird nie im Browser angezeigt.", en: "Webhook of the team channel (channel settings → integrations → webhooks). Never shown in the browser."}
      - key: discord.username
        type: string
        when: discord.enabled
        max-length: 80
        name: {de: Name im Kanal, en: Name in the channel}
        help: {de: "Name, unter dem die Nachrichten im Kanal erscheinen.", en: "Name the messages appear under in the channel."}
      - key: discord.avatar-url
        advanced: true
        type: string
        when: discord.enabled
        max-length: 300
        name: {de: Bild-URL, en: Avatar URL}
        help: {de: "Bild für die Nachrichten (Adresse einer PNG/JPG-Datei). Leer = Bild des Webhooks.", en: "Picture for the messages (address of a PNG/JPG file). Empty = picture of the webhook."}
      - key: discord.use-embeds
        advanced: true
        type: bool
        when: discord.enabled
        name: {de: Farbige Karten, en: Coloured embeds}
        help: {de: "Nachrichten als farbige Karten (Farbe je Ereignis). Aus = schlichter Text.", en: "Messages as coloured cards (colour per event). Off = plain text."}
      - key: discord.footer
        advanced: true
        type: string
        when: discord.enabled
        max-length: 120
        name: {de: Fußzeile, en: Footer}
        help: {de: "Kleiner Text unter jeder Karte, z.B. der Servername.", en: "Small text under every card, e.g. the server name."}
      - key: discord.events
        heading: {de: "Ereignisse", en: "Events"}
        type: table
        when: discord.enabled
        name: {de: Ereignisse, en: Events}
        help: {de: "Welche Ereignisse in den Kanal gehen und in welcher Farbe.", en: "Which events go to the channel and in which colour."}
        columns:
          - {key: enabled, type: bool, name: {de: Senden, en: Send}}
          - {key: color, type: color, name: {de: Farbe, en: Colour}}
        rows:
          maintenance-scheduled: {de: Wartung geplant, en: Maintenance scheduled}
          maintenance-changed: {de: Wartung geändert, en: Maintenance changed}
          maintenance-cancelled: {de: Wartung abgesagt, en: Maintenance cancelled}
          maintenance-start: {de: Wartung beginnt, en: Maintenance starts}
          maintenance-end: {de: Wartung endet, en: Maintenance ends}
          kuma-connected: {de: Kuma verbunden, en: Kuma connected}
          kuma-disconnected: {de: Kuma getrennt, en: Kuma disconnected}
          announce: {de: Ankündigung, en: Announcement}
          admin-mode-on: {de: Admin-Modus an, en: Admin mode on}
          admin-mode-off: {de: Admin-Modus aus, en: Admin mode off}
          plugin-alert: {de: Meldung eines Plugins, en: Alert of a plugin}
          admin-reload: {de: Neu geladen, en: Reloaded}
          ticket: {de: Neues Ticket, en: New ticket}
          ticket-message: {de: Ticket-Nachricht, en: Ticket message}
          ticket-closed: {de: Ticket geschlossen, en: Ticket closed}
          ticket-reopened: {de: Ticket wieder geöffnet, en: Ticket reopened}
          player-freeze: {de: Spieler eingefroren, en: Player frozen}
          player-unfreeze: {de: Spieler aufgetaut, en: Player unfrozen}
          player-kick: {de: Spieler gekickt, en: Player kicked}
          player-freeze-quit: {de: Eingefroren verlassen, en: Left while frozen}
          staff-chat: {de: Staff-Chat, en: Staff chat}
          web-login: {de: Web-Anmeldung, en: Web sign-in}
          web-setup: {de: Web-Konto eingerichtet, en: Web account set up}
          web-console: {de: Befehl in der Web-Konsole, en: Command in the web console}
          health-alert: {de: Server laggt, en: Server lags}
          health-recovered: {de: Server erholt, en: Server recovered}
          plugin-update-downloaded: {de: Update heruntergeladen, en: Update downloaded}
          server-restart: {de: Neustart geplant, en: Restart planned}
          server-restart-cancelled: {de: Neustart abgebrochen, en: Restart cancelled}
          server-schedule-paused: {de: Automatische Neustarts ausgesetzt, en: Planned restarts paused}
          server-schedule-resumed: {de: Automatische Neustarts wieder an, en: Planned restarts on again}
          server-stop: {de: Stopp geplant, en: Stop planned}
          server-stop-cancelled: {de: Stopp abgebrochen, en: Stop cancelled}
          server-crash: {de: Server abgestürzt (Starter), en: Server crashed (starter)}
          server-hang: {de: Server hing (Starter), en: Server hung (starter)}
          server-gave-up: {de: Starter gibt auf, en: Starter gave up}
          paper-updated: {de: Paper aktualisiert, en: Paper updated}
          paper-rollback: {de: Paper-Build zurückgesetzt, en: Paper build rolled back}

  - id: discord-announce
    name: {de: Discord-Ankündigungen (Community), en: Discord announcements (community)}
    group: {de: "Discord", en: "Discord"}
    help: {de: "Eigener Webhook für den öffentlichen Kanal - sparsam: eine Nachricht pro Wartung, die bearbeitet wird.", en: "Own webhook for the public channel - sparing: one message per maintenance that is edited."}
    fields:
      - key: discord-announce.enabled
        heading: {de: "Webhook", en: "Webhook"}
        type: bool
        name: {de: Ankündigungen senden, en: Send announcements}
        help: {de: "Öffentliche Ankündigungen (Wartungen, Ankündigungen, Neuigkeiten, Warnungen) per eigenem Webhook in einen Community-Kanal - getrennt vom Team-Log.", en: "Public announcements (maintenance, announcements, news, warnings) via an own webhook into a community channel - separate from the team log."}
      - key: discord-announce.webhook-url
        type: secret
        when: discord-announce.enabled
        max-length: 300
        name: {de: Webhook-URL, en: Webhook URL}
        help: {de: "Webhook des Community-Kanals. Wird nie im Browser angezeigt.", en: "Webhook of the community channel. Never shown in the browser."}
      - key: discord-announce.username
        type: string
        when: discord-announce.enabled
        max-length: 80
        name: {de: Name im Kanal, en: Name in the channel}
        help: {de: "Name, unter dem die Ankündigungen erscheinen. Leer = Name des Webhooks.", en: "Name the announcements appear under. Empty = name of the webhook."}
      - key: discord-announce.avatar-url
        advanced: true
        type: string
        when: discord-announce.enabled
        max-length: 300
        name: {de: Bild-URL, en: Avatar URL}
        help: {de: "Bild für die Ankündigungen. Leer = Bild des Webhooks.", en: "Picture for the announcements. Empty = picture of the webhook."}
      - key: discord-announce.footer
        advanced: true
        type: string
        when: discord-announce.enabled
        max-length: 120
        name: {de: Fußzeile, en: Footer}
        help: {de: "Kleiner Text unter jeder Ankündigung.", en: "Small text under every announcement."}
      - key: discord-announce.ping-role-id
        type: string
        when: discord-announce.enabled
        max-length: 32
        name: {de: Rolle zum Erwähnen (ID), en: Role to mention (ID)}
        help: {de: "Entwicklermodus an, Rechtsklick auf die Rolle → ID kopieren. Leer = niemand.", en: "Developer mode on, right-click the role → copy ID. Empty = nobody."}
      - key: discord-announce.maintenance.enabled
        heading: {de: "Wartungen", en: "Maintenance"}
        type: bool
        when: discord-announce.enabled
        name: {de: Wartungen posten, en: Post maintenance}
        help: {de: "Jede Wartung als eine Nachricht posten, die mitläuft: geplant → läuft → beendet bzw. abgesagt (wird bearbeitet statt neu gepostet).", en: "Post every maintenance as one message that is kept up to date: scheduled → running → ended or cancelled (edited instead of posted again)."}
      - key: discord-announce.maintenance.announce-ahead
        type: duration
        when: discord-announce.maintenance.enabled
        name: {de: Frühestens vorher, en: At the earliest before}
        help: {de: "Erst posten, wenn die Wartung höchstens so weit entfernt ist - verhindert, dass wiederkehrende Wartungen lange vorher erscheinen.", en: "Only post once the maintenance is at most this far away - prevents recurring maintenance from appearing long before."}
      - key: discord-announce.maintenance.min-length
        advanced: true
        type: duration
        when: discord-announce.maintenance.enabled
        name: {de: Kürzere nicht posten, en: Do not post shorter ones}
        help: {de: 0 = alle posten., en: 0 = post all.}
      - key: discord-announce.maintenance.ping
        type: bool
        when: discord-announce.maintenance.enabled
        name: {de: Bei Wartungen erwähnen, en: Mention on maintenance}
        help: {de: "Die Rolle beim ersten Post einer Wartung erwähnen (nie bei den späteren Änderungen).", en: "Mention the role in the first post of a maintenance (never in the later edits)."}
      - key: discord-announce.maintenance.debounce-seconds
        advanced: true
        type: int
        when: discord-announce.maintenance.enabled
        min: 0
        max: 3600
        unit: {de: Sekunden, en: seconds}
        name: {de: Änderungen zusammenfassen, en: Combine changes}
        help: {de: "Schnell aufeinanderfolgende Änderungen (Zeiten, Titel) zu einer Bearbeitung zusammenfassen. Beginn und Ende kommen sofort.", en: "Combine quick changes (times, titles) into one edit. Start and end come right away."}
      - key: discord-announce.announcements.enabled
        heading: {de: "Ankündigungen & Neuigkeiten", en: "Announcements & news"}
        type: bool
        when: discord-announce.enabled
        name: {de: Ankündigungen posten, en: Post announcements}
        help: {de: "Ankündigungen posten: Vorlagen mit Discord-Text automatisch (außer mit -q), eigene Texte nur mit -d.", en: "Post announcements: presets with a Discord text automatically (except with -q), own texts only with -d."}
      - key: discord-announce.announcements.cooldown
        advanced: true
        type: duration
        when: discord-announce.announcements.enabled
        name: {de: Gleiche Vorlage höchstens alle, en: Same preset at most every}
        help: {de: "Dieselbe Vorlage höchstens einmal in dieser Zeit posten (z.B. ein Neustart-Countdown = ein Post).", en: "Post the same preset at most once within this time (e.g. a restart countdown = one post)."}
      - key: discord-announce.announcements.ping
        type: bool
        when: discord-announce.announcements.enabled
        name: {de: Bei Ankündigungen erwähnen, en: Mention on announcements}
        help: {de: "Die Rolle bei Ankündigungen erwähnen.", en: "Mention the role with announcements."}
      - key: discord-announce.news.ping
        type: bool
        when: discord-announce.enabled
        name: {de: Bei Neuigkeiten erwähnen, en: Mention on news}
        help: {de: "Die Rolle bei Neuigkeiten und Changelogs erwähnen.", en: "Mention the role with news and changelogs."}
      - key: discord-announce.alerts.ping
        type: bool
