  - id: discord-announce
    name: {de: Discord-Ankündigungen (Community), en: Discord announcements (community)}
    help: {de: "Eigener Webhook für den öffentlichen Kanal - sparsam: eine Nachricht pro Wartung, die bearbeitet wird.", en: "Own webhook for the public channel - sparing: one message per maintenance that is edited."}
    fields:
      - key: discord-announce.enabled
        type: bool
        name: {de: Ankündigungen senden, en: Send announcements}
      - key: discord-announce.webhook-url
        type: secret
        when: discord-announce.enabled
        max-length: 300
        name: {de: Webhook-URL, en: Webhook URL}
      - key: discord-announce.username
        type: string
        when: discord-announce.enabled
        max-length: 80
        name: {de: Name im Kanal, en: Name in the channel}
      - key: discord-announce.avatar-url
        type: string
        when: discord-announce.enabled
        max-length: 300
        name: {de: Bild-URL, en: Avatar URL}
      - key: discord-announce.footer
        type: string
        when: discord-announce.enabled
        max-length: 120
        name: {de: Fußzeile, en: Footer}
      - key: discord-announce.ping-role-id
        type: string
        when: discord-announce.enabled
        max-length: 32
        name: {de: Rolle zum Erwähnen (ID), en: Role to mention (ID)}
        help: {de: "Entwicklermodus an, Rechtsklick auf die Rolle → ID kopieren. Leer = niemand.", en: "Developer mode on, right-click the role → copy ID. Empty = nobody."}
      - key: discord-announce.maintenance.enabled
        type: bool
        when: discord-announce.enabled
        name: {de: Wartungen posten, en: Post maintenance}
      - key: discord-announce.maintenance.announce-ahead
        type: duration
        when: discord-announce.maintenance.enabled
        name: {de: Frühestens vorher, en: At the earliest before}
      - key: discord-announce.maintenance.min-length
        type: duration
        when: discord-announce.maintenance.enabled
        name: {de: Kürzere nicht posten, en: Do not post shorter ones}
        help: {de: 0 = alle posten., en: 0 = post all.}
      - key: discord-announce.maintenance.ping
        type: bool
        when: discord-announce.maintenance.enabled
        name: {de: Bei Wartungen erwähnen, en: Mention on maintenance}
      - key: discord-announce.maintenance.debounce-seconds
        type: int
        when: discord-announce.maintenance.enabled
        min: 0
        max: 3600
        unit: {de: Sekunden, en: seconds}
        name: {de: Änderungen zusammenfassen, en: Combine changes}
      - key: discord-announce.announcements.enabled
        type: bool
        when: discord-announce.enabled
        name: {de: Ankündigungen posten, en: Post announcements}
      - key: discord-announce.announcements.cooldown
        type: duration
        when: discord-announce.announcements.enabled
        name: {de: Gleiche Vorlage höchstens alle, en: Same preset at most every}
      - key: discord-announce.announcements.ping
        type: bool
        when: discord-announce.announcements.enabled
        name: {de: Bei Ankündigungen erwähnen, en: Mention on announcements}
      - key: discord-announce.news.ping
        type: bool
        when: discord-announce.enabled
        name: {de: Bei Neuigkeiten erwähnen, en: Mention on news}
      - key: discord-announce.alerts.ping
        type: bool
        when: discord-announce.enabled
        name: {de: Bei kritischen Warnungen erwähnen, en: Mention on critical warnings}
      - key: discord-announce.kuma.enabled
        type: bool
        when: discord-announce.enabled
        name: {de: Vorfälle aus Kuma posten, en: Post incidents from Kuma}
      - key: discord-announce.kuma.ping
        type: bool
        when: discord-announce.kuma.enabled
        name: {de: Bei roten Vorfällen erwähnen, en: Mention on red incidents}
      - key: discord-announce.colors.scheduled
        type: color
        when: discord-announce.enabled
        name: {de: "Farbe: geplant", en: "Colour: scheduled"}
      - key: discord-announce.colors.started
        type: color
        when: discord-announce.enabled
        name: {de: "Farbe: läuft", en: "Colour: started"}
      - key: discord-announce.colors.ended
        type: color
        when: discord-announce.enabled
        name: {de: "Farbe: beendet", en: "Colour: ended"}
      - key: discord-announce.colors.cancelled
        type: color
        when: discord-announce.enabled
        name: {de: "Farbe: abgesagt", en: "Colour: cancelled"}
      - key: discord-announce.colors.announce
        type: color
        when: discord-announce.enabled
        name: {de: "Farbe: Ankündigung", en: "Colour: announcement"}
      - key: discord-announce.colors.news
        type: color
        when: discord-announce.enabled
        name: {de: "Farbe: Neuigkeit", en: "Colour: news"}
      - key: discord-announce.colors.changelog
        type: color
        when: discord-announce.enabled
        name: {de: "Farbe: Changelog", en: "Colour: changelog"}
      - key: discord-announce.colors.alert
