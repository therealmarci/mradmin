  - id: web
    name: {de: Weboberfläche, en: Web interface}
    help: {de: "Der eingebaute Webserver hört nur lokal - erreichbar über deinen Reverse-Proxy mit HTTPS. Änderungen starten den Webserver neu.", en: "The built-in web server only listens locally - reachable through your reverse proxy with HTTPS. Changes restart the web server."}
    fields:
      - key: web.enabled
        type: bool
        name: {de: Weboberfläche an, en: Web interface on}
        help: {de: "Aus schaltet auch diese Seite ab - zurück nur über die Datei.", en: "Off also switches this page off - back only through the file."}
      - key: web.bind
        type: string
        max-length: 64
        name: {de: Adresse des Webservers, en: Address of the web server}
        help: {de: "Nur ändern, wenn der Proxy auf einem anderen Rechner läuft (dann z.B. 0.0.0.0 + Firewall).", en: "Only change if the proxy runs on another machine (then e.g. 0.0.0.0 + firewall)."}
      - key: web.port
        type: int
        min: 1
        max: 65535
        name: {de: Port, en: Port}
      - key: web.public-url
        type: string
        max-length: 300
        name: {de: Öffentliche Adresse, en: Public address}
        help: {de: "Z.B. https://admin.deinserver.at - für Links, Anmeldung, Passkeys und die Spielerseite.", en: "E.g. https://admin.yourserver.com - for links, sign-in, passkeys and the player page."}
      - key: web.trusted-proxies
        type: strings
        name: {de: Vertrauenswürdige Proxys, en: Trusted proxies}
        help: {de: Nur ihnen glaubt MRadmin die echte Besucher-IP (X-Forwarded-For)., en: MRadmin only trusts these for the real visitor IP (X-Forwarded-For).}
      - key: web.session-days
        type: int
        min: 1
        max: 365
        unit: {de: Tage, en: days}
        name: {de: Team-Geräte angemeldet für, en: Team devices signed in for}
      - key: web.login.passkeys
        type: bool
        name: {de: Anmeldung mit Passkey, en: Sign-in with passkey}
      - key: web.login.password
        type: bool
        name: {de: Anmeldung mit Passwort, en: Sign-in with password}
        help: {de: Immer zusammen mit dem Code aus der App., en: Always together with the code from the app.}
      - key: web.login.discord.enabled
        type: bool
        name: {de: Anmeldung mit Discord, en: Sign-in with Discord}
        help: {de: "Discord-Anwendung anlegen, Weiterleitung <public-url>/api/discord/callback eintragen.", en: "Create a Discord application, add the redirect <public-url>/api/discord/callback."}
      - key: web.login.discord.client-id
        type: string
        when: web.login.discord.enabled
        max-length: 64
        name: {de: Discord Client-ID, en: Discord client ID}
      - key: web.login.discord.client-secret
        type: secret
        when: web.login.discord.enabled
        max-length: 200
        name: {de: Discord Client-Secret, en: Discord client secret}
      - key: web.item-icons
        type: bool
        name: {de: Item-Bilder, en: Item pictures}
        help: {de: "Texturen einmal aus dem offiziellen Minecraft-Client laden (ca. 40 MB). Aus = Kürzel statt Bilder.", en: "Load the textures once from the official Minecraft client (about 40 MB). Off = short labels instead of pictures."}
      - key: web.legal.imprint-url
        type: string
        max-length: 300
        name: {de: Impressum-Link, en: Imprint link}
        help: {de: Leer = Text aus plugins/MRadmin/web/impressum.md., en: Empty = text from plugins/MRadmin/web/impressum.md.}
      - key: web.legal.privacy-url
        type: string
        max-length: 300
        name: {de: Datenschutz-Link, en: Privacy link}
        help: {de: Leer = Text aus plugins/MRadmin/web/datenschutz.md., en: Empty = text from plugins/MRadmin/web/datenschutz.md.}
      - key: web.push.contact
        type: string
        max-length: 200
        name: {de: Kontakt für Push, en: Contact for push}
        help: {de: "mailto:du@deinserver.at oder https-Adresse. Leer = public-url. Apple braucht einen gültigen Kontakt.", en: "mailto:you@yourserver.com or an https address. Empty = public-url. Apple needs a valid contact."}
      - key: web.privacy.audit-retention
        type: duration
        name: {de: Protokoll aufheben, en: Keep the log}
      - key: web.privacy.mask-ip
        type: bool
        name: {de: IP-Adressen kürzen, en: Shorten IP addresses}
        help: {de: 1.2.3.4 → 1.2.3.0 im Protokoll und bei den Geräten., en: 1.2.3.4 → 1.2.3.0 in the log and for the devices.}

  - id: console
    name: {de: Web-Konsole, en: Web console}
    help: {de: "Live-Log und Befehle im Browser. Vor dem Öffnen fragt die Seite den Code aus der App ab.", en: "Live log and commands in the browser. Before opening, the page asks for the code from the app."}
    fields:
      - key: web.console.enabled
        type: bool
        name: {de: Web-Konsole an, en: Web console on}
      - key: web.console.unlock-minutes
        type: int
        when: web.console.enabled
        min: 1
        max: 240
        unit: {de: Minuten, en: minutes}
        name: {de: Offen bleiben nach dem Code, en: Stay open after the code}
      - key: web.console.lines
        type: int
        when: web.console.enabled
        min: 100
        max: 10000
        name: {de: Gemerkte Zeilen, en: Lines kept}
      - key: web.console.blocked
        type: strings
        when: web.console.enabled
        name: {de: Gesperrte Befehle, en: Blocked commands}
        help: {de: "Gehen nie über die Web-Konsole - auch nicht versteckt in execute … run.", en: "Never work through the web console - not even hidden in execute … run."}
      - key: web.console.hide-links
        type: bool
        when: web.console.enabled
        name: {de: Links ausblenden, en: Hide links}
      - key: web.console.hide-ips
        type: bool
        when: web.console.enabled
        name: {de: IP-Adressen ausblenden, en: Hide IP addresses}

  - id: requests
    name: {de: Öffentliche Formulare, en: Public forms}
    help: {de: "Entbannungsanträge und Kontaktformular - ohne Anmeldung erreichbar, sie landen als Tickets bei dir.", en: "Unban requests and contact form - reachable without signing in, they end up as tickets with you."}
    fields:
      - key: web.requests.unban.enabled
        type: bool
        name: {de: Entbannungsanträge, en: Unban requests}
        help: {de: Unter <public-url>/entbannung (braucht LibertyBans)., en: Under <public-url>/entbannung (needs LibertyBans).}
      - key: web.requests.unban.kick-message
        type: bool
        when: web.requests.unban.enabled
        name: {de: Adresse und Code in der Bann-Nachricht, en: Address and code in the ban message}
      - key: web.requests.contact.enabled
        type: bool
        name: {de: Kontaktformular, en: Contact form}
      - key: web.requests.notify-by-mail
        type: bool
        name: {de: Antworten auch per Mail, en: Replies by mail too}
        help: {de: Wenn eine Adresse angegeben wurde und Mail eingerichtet ist., en: If an address was given and mail is set up.}
      - key: web.requests.min-text-length
        type: int
        min: 1
        max: 1000
        unit: {de: Zeichen, en: characters}
        name: {de: Text mindestens, en: Text at least}
      - key: web.requests.max-text-length
        type: int
        min: 100
        max: 20000
        unit: {de: Zeichen, en: characters}
        name: {de: Text höchstens, en: Text at most}
      - key: web.requests.spam.per-ip-per-hour
        type: int
        min: 1
        max: 1000
        name: {de: Anträge pro IP und Stunde, en: Requests per IP and hour}
      - key: web.requests.spam.max-open-contact
        type: int
        min: 1
        max: 10000
        name: {de: Höchstens offene Kontaktanfragen, en: At most open contact requests}
      - key: web.requests.spam.proof-of-work
        type: int
        min: 0
        max: 24
        name: {de: Rechenaufgabe gegen Spam, en: Calculation against spam}
        help: {de: "0 = aus, 16 = etwa eine Sekunde am Handy, jede +1 verdoppelt.", en: "0 = off, 16 = about one second on a phone, every +1 doubles."}

  - id: player-web
    name: {de: Spielerseite, en: Player page}
    help: {de: "Jeder Spieler bekommt unter <public-url>/me seine eigene Seite - Anmeldung mit dem Code aus /web.", en: "Every player gets their own page under <public-url>/me - sign-in with the code from /web."}
