# Form of config.yml for the web interface (Plugins -> MRadmin -> Configuration).
# Every field names a key of config.yml, its type and limits, and a name and help text in German and English.
# Format: docs/MODULE-API.md, section "Konfiguration im Browser". Texts with a comma need quotes.
# Not in the form (only in the file): admin-mode.menu.buttons, web.roles and web.players (free lists of own entries),
# new ticket categories (existing ones are in the table).
sections:
  - id: general
    name: {de: Allgemein, en: General}
    group: {de: "Grundlagen", en: "Basics"}
    help: {de: "Sprache der Texte im Spiel, in Discord und Mails, Zeitzone.", en: "Language of the texts in game, on Discord and in mails, time zone."}
    fields:
      - key: general.language
        type: choice
        name: {de: Sprache der Spieler, en: Language of the players}
        help: {de: "Automatisch = jeder Spieler bekommt die Sprache seines Minecraft-Clients. Die Weboberfläche folgt dem Browser.", en: "Automatic = every player gets the language of their Minecraft client. The web interface follows the browser."}
        options:
          - {value: auto, de: Automatisch, en: Automatic}
          - {value: de, de: Deutsch, en: German}
          - {value: en, de: Englisch, en: English}
      - key: general.fallback-language
        type: choice
        name: {de: Ersatzsprache, en: Fallback language}
        help: {de: Für Spieler mit einer Sprache ohne eigene Datei., en: For players whose language has no file of its own.}
        when: general.language=auto
        options:
          - {value: de, de: Deutsch, en: German}
          - {value: en, de: Englisch, en: English}
      - key: general.server-language
        type: choice
        name: {de: Server-Sprache, en: Server language}
        help: {de: "Discord, Serverliste während der Wartung, Push, Mails, Notizen in Tickets.", en: "Discord, server list during maintenance, push, mails, notes in tickets."}
        options:
          - {value: de, de: Deutsch, en: German}
          - {value: en, de: Englisch, en: English}
      - key: general.timezone
        type: string
        max-length: 64
        name: {de: Zeitzone, en: Time zone}
        help: {de: "Z.B. Europe/Vienna. Leer = Zeitzone des Servers.", en: "E.g. Europe/Vienna. Empty = the server's time zone."}

  - id: features
    name: {de: Funktionen, en: Features}
    group: {de: "Grundlagen", en: "Basics"}
    help: {de: "Eine abgeschaltete Funktion verschwindet ganz - gespeicherte Daten bleiben und sind beim Einschalten wieder da.", en: "A switched-off feature disappears completely - stored data is kept and back when switching it on."}
    fields:
      - key: features.maintenance
        type: bool
        name: {de: Wartungsmodus, en: Maintenance mode}
        help: {de: "Countdown, Bossbar, MOTD, Join-Sperre (inkl. Uptime Kuma).", en: "Countdown, boss bar, MOTD, join lock (incl. Uptime Kuma)."}
      - key: features.announce
        type: bool
        name: {de: Ankündigungen, en: Announcements}
        help: {de: "Ankündigungen mit /mradmin announce und das Ankündigungs-Menü im Dashboard.", en: "Announcements with /mradmin announce and the announcement menu in the dashboard."}
      - key: features.admin-mode
        type: bool
        name: {de: Admin-Modus, en: Admin mode}
        help: {de: Wer gerade im Admin-Modus ist bekommt sein Inventar sofort zurück., en: Whoever is in admin mode gets their inventory back right away.}
      - key: features.teleport
        type: bool
        name: {de: Zu Spielern teleportieren, en: Teleport to players}
        help: {de: "Zu Spielern teleportieren: im Spieler-Menü und mit /mradmin tp.", en: "Teleport to players: in the player menu and with /mradmin tp."}
      - key: features.summon
        type: bool
        name: {de: Spieler herholen, en: Summon players}
        help: {de: "Einen Spieler zu dir holen (Spieler-Menü).", en: "Summon a player to you (player menu)."}
      - key: features.inventory
        type: bool
        name: {de: Inventar ansehen, en: View inventory}
        help: {de: "Inventar und Endertruhe eines Spielers ansehen - nur lesend.", en: "View a player's inventory and ender chest - read only."}
      - key: features.freeze
        type: bool
        name: {de: Einfrieren, en: Freeze}
        help: {de: "Spieler einfrieren. Beim Ausschalten sind eingefrorene Spieler sofort frei.", en: "Freeze players. Switching it off frees frozen players right away."}
      - key: features.server-status
        type: bool
        name: {de: Serverzustand, en: Server status}
        help: {de: "Serverzustand: /mradmin status und die Server-Kachel im Dashboard.", en: "Server status: /mradmin status and the server tile in the dashboard."}
      - key: features.tickets
        type: bool
        name: {de: Tickets & Meldungen, en: Tickets & reports}
        help: {de: "Tickets und Meldungen: /report für Spieler, /mradmin tickets für das Team.", en: "Tickets and reports: /report for players, /mradmin tickets for the team."}
      - key: features.staff-chat
        type: bool
        name: {de: Staff-Chat (/sc), en: Staff chat (/sc)}
        help: {de: "Staff-Chat mit /sc - nur das Team liest mit.", en: "Staff chat with /sc - only the team reads it."}

  - id: integrations
    name: {de: Andere Plugins, en: Other plugins}
    group: {de: "Grundlagen", en: "Basics"}
    help: {de: "MRadmin erkennt sie von selbst. Aus = nicht verbinden, auch wenn das Plugin installiert ist.", en: "MRadmin detects them by itself. Off = do not connect, even if the plugin is installed."}
    fields:
      - key: integrations.mrsleep
        type: bool
        name: {de: MRsleep, en: MRsleep}
        help: {de: "Mit MRsleep zusammenarbeiten (Knopf im Dashboard, Infos im Spieler-Menü). Aus = nicht verbinden, auch wenn MRsleep installiert ist.", en: "Work together with MRsleep (button in the dashboard, info in the player menu). Off = do not connect, even if MRsleep is installed."}
      - key: integrations.mrchunks
        type: bool
        name: {de: MRchunks, en: MRchunks}
        help: {de: "Mit MRchunks zusammenarbeiten (Chunkloader im Dashboard und Serverzustand, auffällige Loader). Aus = nicht verbinden.", en: "Work together with MRchunks (chunk loaders in the dashboard and server status, conspicuous loaders). Off = do not connect."}
      - key: integrations.mrtoolbar
        type: bool
        name: {de: MRtoolbar, en: MRtoolbar}
        help: {de: "Mit MRtoolbar zusammenarbeiten (Werkzeuggürtel eines Spielers ansehen). Aus = nicht verbinden.", en: "Work together with MRtoolbar (view a player's tool belt). Off = do not connect."}
      - key: integrations.mrpvp
        type: bool
        name: {de: MRpvp, en: MRpvp}
        help: {de: "Mit MRpvp zusammenarbeiten (Duelle im Dashboard und auf der Spielerseite). Aus = nicht verbinden.", en: "Work together with MRpvp (duels in the dashboard and on the player page). Off = do not connect."}
      - key: integrations.libertybans
        type: bool
        name: {de: LibertyBans, en: LibertyBans}
        help: {de: Strafen auf der Spielerseite der Weboberfläche. Es gelten die Rechte von LibertyBans., en: Punishments on the player page of the web interface. LibertyBans' permissions apply.}
      - key: libertybans.durations
        type: strings
        when: integrations.libertybans
        name: {de: Schnellwahl Bann/Mute, en: Quick choices ban/mute}
        help: {de: "Z.B. 1h, 7d - „perm“ = für immer.", en: "E.g. 1h, 7d - \"perm\" = forever."}

  - id: updates
    name: {de: Updates von MRadmin, en: Updates of MRadmin}
    group: {de: "Grundlagen", en: "Basics"}
    help: {de: Hinweis auf neue Versionen in der Konsole und beim Betreten., en: Notice about new versions in the console and on joining.}
    fields:
      - key: updates.enabled
        type: bool
        name: {de: Nach Updates suchen, en: Look for updates}
        help: {de: "Nach neuen Versionen von MRadmin sehen und das Team darauf hinweisen. Installieren geht unter Server → Plugins.", en: "Look for new versions of MRadmin and tell the team. Installing works under Server → Plugins."}
      - key: updates.source
        advanced: true
        type: choice
        when: updates.enabled
        name: {de: Quelle, en: Source}
        help: {de: "Wo nach neuen Versionen gesehen wird: GitHub-Releases (Standard) oder Modrinth.", en: "Where to look for new versions: GitHub releases (default) or Modrinth."}
        options:
          - {value: github, de: GitHub, en: GitHub}
          - {value: modrinth, de: Modrinth, en: Modrinth}
      - key: updates.include-prereleases
        type: bool
        when: updates.enabled
        name: {de: Auch Vorabversionen, en: Pre-releases too}
        help: {de: "Auch Vorabversionen melden. Läuft eine 0.x, werden sie immer gemeldet.", en: "Also report pre-releases. If a 0.x runs, they are always reported."}
      - key: updates.interval-hours
        advanced: true
        type: int
        when: updates.enabled
        min: 1
        max: 168
        unit: {de: Stunden, en: hours}
        name: {de: Prüfen alle, en: Check every}
        help: {de: "So oft wird nach einer neuen Version gesehen.", en: "This often a new version is looked for."}
      - key: updates.notify-on-join
        type: bool
        when: updates.enabled
        name: {de: Team beim Betreten informieren, en: Tell the team on join}
        help: {de: Spieler mit mradmin.admin.update bekommen einen Hinweis., en: Players with mradmin.admin.update get a notice.}

  - id: gui
    name: {de: Menüs, en: Menus}
    group: {de: "Grundlagen", en: "Basics"}
    help: {de: Die Menüs im Spiel., en: The menus in game.}
    fields:
      - key: gui.refresh-ticks
        advanced: true
        type: int
        min: 5
        max: 200
        unit: {de: Ticks, en: ticks}
        name: {de: Aktualisieren alle, en: Refresh every}
        help: {de: 20 Ticks = 1 Sekunde., en: 20 ticks = 1 second.}
      - key: gui.sounds
        type: bool
        name: {de: Klickgeräusche, en: Click sounds}
        help: {de: "Klickgeräusche in den Menüs im Spiel.", en: "Click sounds in the menus in game."}

  - id: server
    name: {de: Starter & geplante Neustarts, en: Starter & planned restarts}
    group: {de: "Server & Neustarts", en: "Server & restarts"}
    help: {de: "Der Starter (mrserver) startet den Server, holt ihn nach Neustart, Absturz und Hänger zurück und hält Paper aktuell. Einrichten mit /mradmin starter setup. Ohne Starter gelten nur die geplanten Neustarts.", en: "The starter (mrserver) starts the server, brings it back after restarts, crashes and hangs and keeps Paper up to date. Set it up with /mradmin starter setup. Without the starter only the planned restarts apply."}
    fields:
      - key: server.memory-min
        heading: {de: "Start", en: "Start"}
        type: string
        name: {de: Arbeitsspeicher min., en: Memory min.}
        help: {de: "Z.B. 1G oder 4096M - ab dem nächsten Start.", en: "E.g. 1G or 4096M - from the next start on."}
      - key: server.memory-max
        type: string
        name: {de: Arbeitsspeicher max., en: Memory max.}
        help: {de: "Z.B. 4G - ab dem nächsten Start.", en: "E.g. 4G - from the next start on."}
      - key: server.java-flags
        type: text
        name: {de: Java-Optionen, en: Java options}
        help: {de: "Nur Optionen zum Abstimmen (z.B. Aikar-Flags). Alles, was Programme startet oder Dateien liest und schreibt, wird ignoriert.", en: "Tuning options only (e.g. Aikar's flags). Anything that starts programs or reads and writes files is ignored."}
      - key: server.paper-update
        heading: {de: "Paper", en: "Paper"}
        type: choice
        name: {de: Paper-Updates, en: Paper updates}
        help: {de: "Nur Builds derselben Minecraft-Version, nie eine neue Minecraft-Version. Startet ein neuer Build nicht, nimmt der Starter wieder den alten.", en: "Only builds of the same Minecraft version, never a new Minecraft version. If a new build does not start, the starter uses the old one again."}
        options:
          - {value: auto, de: Bei jedem Start, en: On every start}
          - {value: notify, de: Nur anzeigen, en: Only show}
          - {value: "off", de: Aus, en: "Off"}
      - key: server.restart-times
        heading: {de: "Geplante Neustarts", en: "Planned restarts"}
        type: strings
        item: time
        name: {de: Täglicher Neustart um, en: Daily restart at}
        help: {de: "Uhrzeiten wie 05:00 (Zeitzone aus Allgemein). Der Countdown beginnt vorher.", en: "Times like 05:00 (time zone from General). The countdown starts before."}
      - key: server.countdown
        type: duration
        name: {de: Countdown, en: Countdown}
        help: {de: "Für geplante Neustarts und mrserver stop/restart ohne Zeitangabe, höchstens 1h.", en: "For planned restarts and mrserver stop/restart without a time, at most 1h."}
      - key: server.plain-stop
        type: choice
        name: {de: Nach /stop, en: After /stop}
        help: {de: "Was ein einfaches /stop (Konsole oder Spiel) mit dem Starter macht: Server bleibt aus, oder er startet neu.", en: "What a plain /stop (console or game) does with the starter: the server stays down, or it restarts."}
        options:
          - {value: stop, de: Server bleibt aus, en: Server stays down}
          - {value: restart, de: Server startet neu, en: Server restarts}
      - key: server.discord-announce
        type: bool
        advanced: true
        name: {de: Countdown im Community-Discord, en: Countdown in the community Discord}
        help: {de: "Neustarts und Stopps zusätzlich im Community-Kanal ankündigen (discord-announce). Das Team-Log bekommt sie immer, mit Grund.", en: "Also announce restarts and stops in the community channel (discord-announce). The team log always gets them, with the reason."}
      - key: server.crashes.max
        heading: {de: "Abstürze & Hänger", en: "Crashes & hangs"}
        type: int
        min: 1
        max: 100
        name: {de: Aufgeben nach Abstürzen, en: Give up after crashes}
        help: {de: "Nach so vielen Abstürzen ...", en: "After this many crashes ..."}
      - key: server.crashes.window-minutes
        type: int
        min: 1
        max: 1440
        unit: {de: Minuten, en: minutes}
        name: {de: innerhalb von, en: within}
        help: {de: "... innerhalb dieser Zeit gibt der Starter auf und der Server bleibt aus, bis jemand nachsieht.", en: "... within this time the starter gives up and the server stays down until someone looks."}
      - key: server.hang-seconds
        type: int
        min: 0
        max: 3600
        unit: {de: Sekunden, en: seconds}
        name: {de: Hänger nach, en: Hang after}
        help: {de: "So lange ohne Tick, dann beendet und startet der Starter den Server. 0 = aus.", en: "That long without a tick, then the starter ends and starts the server. 0 = off."}
      - key: server.stop-timeout-seconds
        advanced: true
        type: int
        min: 30
        max: 3600
        unit: {de: Sekunden, en: seconds}
        name: {de: Herunterfahren höchstens, en: Shutdown at most}
        help: {de: "So lange darf das Herunterfahren dauern, dann beendet der Starter den Server.", en: "Shutting down may take this long, then the starter ends the server."}

  - id: versions
    name: {de: Plugins & Neustart, en: Plugins & restart}
    group: {de: "Server & Neustarts", en: "Server & restarts"}
    help: {de: "Die Seite Plugins: Updates aus den offiziellen Releases, Installation beim nächsten Neustart.", en: "The page Plugins: updates from the official releases, installed on the next restart."}
    fields:
      - key: versions.enabled
        type: bool
        name: {de: Seite Plugins, en: Page Plugins}
        help: {de: "Seite Server → Plugins mit allen MRtechnology-Plugins, Updates und Installieren.", en: "Page Server → Plugins with all MRtechnology plugins, updates and installing."}
      - key: versions.check-interval-hours
        advanced: true
        type: int
        when: versions.enabled
        min: 1
        max: 168
        unit: {de: Stunden, en: hours}
        name: {de: Nach Updates sehen alle, en: Look for updates every}
        help: {de: "So oft wird auf GitHub nach neuen Versionen gesehen.", en: "This often GitHub is asked for new versions."}
      - key: versions.auto-download
        type: choice
        when: versions.enabled
        name: {de: Selbst herunterladen, en: Download by itself}
        help: {de: "Neue Versionen selbst herunterladen: aus, nur Hotfixes (1.2.x), neue Funktionen (1.x) oder alle. Installiert wird beim nächsten Neustart.", en: "Download new versions by itself: off, hotfixes only (1.2.x), new features (1.x) or all. Installed on the next restart."}
        options:
          - {value: "off", de: Aus, en: "Off"}
          - {value: patch, de: Hotfixes, en: Hotfixes}
          - {value: minor, de: Neue Funktionen, en: New features}
          - {value: all, de: Alle, en: All}
      - key: versions.channel
        type: choice
        when: versions.enabled
        name: {de: Standard-Kanal, en: Default channel}
        help: {de: "Welche Releases die Plugins bekommen. Pro Plugin änderbar auf der Seite Server - Plugins, dort auch Dev. Zurück auf Stable stuft nie zurück.", en: "Which releases the plugins get. Per plugin on the page Server - Plugins, there also dev. Back to stable never downgrades."}
        options:
          - {value: stable, de: Stable, en: Stable}
          - {value: beta, de: Beta (auch Vorabversionen), en: Beta (also pre-releases)}
      - key: versions.dev-token
        type: secret
        when: versions.enabled
        advanced: true
        name: {de: Freigabetoken Dev-Kanal, en: Dev channel release token}
        help: {de: "Vom Entwickler. Nur damit lässt sich pro Plugin der Kanal Dev wählen (unfertige Builds). Geheim halten.", en: "From the developer. Only with it the channel dev can be chosen per plugin (unfinished builds). Keep it secret."}
      - key: versions.restart-method
        heading: {de: "Neustart-Knopf", en: "Restart button"}
        type: choice
        when: versions.enabled
        name: {de: Neustart-Knopf, en: Restart button}
        help: {de: "Ein Server startet sich nicht selbst - Stoppen nur, wenn ein Skript, Wächter oder Panel ihn wieder startet.", en: "A server does not start itself - stop only if a script, watchdog or panel starts it again."}
        options:
          - {value: none, de: Kein Knopf, en: No button}
          - {value: stop, de: Stoppen, en: Stop}
          - {value: script, de: restart-script, en: restart-script}
      - key: versions.restart-delays
        type: strings
        when: versions.enabled
        name: {de: Countdown zur Auswahl, en: Countdown choices}
        help: {de: "Normale Neustarts, z.B. 15m, 30m, 60m (Spieler sollen mind. 15 min vorher gewarnt werden).", en: "Normal restarts, e.g. 15m, 30m, 60m (players should get at least 15 minutes warning)."}
      - key: versions.emergency-delays
        type: strings
        when: versions.enabled
        name: {de: Notfall-Countdown, en: Emergency countdown}
        help: {de: "Kurze Zeiten im roten Notfall-Bereich (nur mit Grund) - z.B. 5m, 1m, now.", en: "Short times in the red emergency area (only with a reason) - e.g. 5m, 1m, now."}

  - id: health
    name: {de: Serverzustand, en: Server health}
    group: {de: "Server & Neustarts", en: "Server & restarts"}
    help: {de: "TPS, MSPT, CPU und Speicher jede Sekunde - in der Weboberfläche unter Health.", en: "TPS, MSPT, CPU and memory every second - in the web interface under Health."}
    fields:
      - key: health.history
        type: choice
        name: {de: Verlauf aufheben, en: Keep the history}
        help: {de: "So lange bleibt der Verlauf erhalten: 24h, 7d oder 30d. Die letzte Stunde sekundengenau, ältere Werte als 5-Minuten-Mittel.", en: "How long the history is kept: 24h, 7d or 30d. The last hour per second, older values as 5-minute averages."}
        options:
          - {value: 24h, de: 24 Stunden, en: 24 hours}
          - {value: 7d, de: 7 Tage, en: 7 days}
          - {value: 30d, de: 30 Tage, en: 30 days}
      - key: health.alert.enabled
        heading: {de: "Warnung bei Lag", en: "Lag warning"}
        type: bool
        name: {de: Warnung bei Lag, en: Warning on lag}
        help: {de: An das Team im Spiel und an den Discord-Log - mit Entwarnung danach., en: To the team in game and to the Discord log - with an all-clear afterwards.}
      - key: health.alert.below-tps
        type: decimal
        when: health.alert.enabled
        min: 1
        max: 20
        unit: {de: TPS, en: TPS}
        name: {de: Warnen unter, en: Warn below}
        help: {de: "Warnen (Team im Spiel, Discord-Log und Push-Benachrichtigung), wenn die TPS darunter fallen ...", en: "Warn (team in game, Discord log and push notification) when the TPS fall below this ..."}
      - key: health.alert.minutes
        type: int
        when: health.alert.enabled
        min: 1
        max: 120
        unit: {de: Minuten, en: minutes}
        name: {de: So lange darunter, en: That long below}
        help: {de: "... und zwar so lange am Stück. Kurze Ruckler lösen keine Warnung aus.", en: "... for this long in a row. Short hiccups do not cause a warning."}

  - id: storage
    name: {de: Speicher, en: Storage}
    group: {de: "Server & Neustarts", en: "Server & restarts"}
    help: {de: "Wo Tickets, Wartungen und Web-Konten liegen. Wirkt erst nach einem Neustart; beim ersten Start mit SQLite oder MySQL werden die YAML-Daten übernommen.", en: "Where tickets, maintenance and web accounts are kept. Takes effect after a restart; on the first start with SQLite or MySQL the YAML data is taken over."}
    fields:
      - key: storage.type
        type: choice
        restart: true
        name: {de: Speicherart, en: Storage type}
        help: {de: "Wo Tickets, Wartungen und Web-Konten liegen: Dateien, SQLite (eine Datei, empfohlen für die Weboberfläche) oder MySQL/MariaDB. Beim Wechsel werden die Daten beim nächsten Start übernommen.", en: "Where tickets, maintenance and web accounts are kept: files, SQLite (one file, recommended for the web interface) or MySQL/MariaDB. When switching, the data is taken over on the next start."}
        options:
          - {value: yaml, de: Dateien (YAML), en: Files (YAML)}
          - {value: sqlite, de: SQLite, en: SQLite}
          - {value: mysql, de: MySQL / MariaDB, en: MySQL / MariaDB}
      - key: storage.mysql.host
        heading: {de: "MySQL / MariaDB", en: "MySQL / MariaDB"}
        type: string
        when: storage.type=mysql
        restart: true
        max-length: 200
        name: {de: Host, en: Host}
        help: {de: "Adresse des Datenbankservers, z.B. localhost oder 10.0.0.5.", en: "Address of the database server, e.g. localhost or 10.0.0.5."}
      - key: storage.mysql.port
        type: int
        when: storage.type=mysql
        restart: true
        min: 1
        max: 65535
        name: {de: Port, en: Port}
        help: {de: "Port des Datenbankservers (MySQL/MariaDB meist 3306).", en: "Port of the database server (MySQL/MariaDB usually 3306)."}
      - key: storage.mysql.database
        type: string
        when: storage.type=mysql
        restart: true
        max-length: 100
        name: {de: Datenbank, en: Database}
        help: {de: "Name der Datenbank. Sie muss schon angelegt sein.", en: "Name of the database. It must already exist."}
      - key: storage.mysql.username
        type: string
        when: storage.type=mysql
        restart: true
        max-length: 100
        name: {de: Benutzer, en: User}
        help: {de: "Benutzer der Datenbank.", en: "User of the database."}
      - key: storage.mysql.password
        type: secret
        when: storage.type=mysql
        restart: true
        max-length: 300
        name: {de: Passwort, en: Password}
        help: {de: "Passwort des Datenbank-Benutzers. Wird nie im Browser angezeigt.", en: "Password of the database user. Never shown in the browser."}
      - key: storage.mysql.pool-size
        advanced: true
        type: int
        when: storage.type=mysql
        restart: true
        min: 1
        max: 32
        name: {de: Gleichzeitige Verbindungen, en: Simultaneous connections}
        help: {de: "So viele Verbindungen zur Datenbank hält MRadmin gleichzeitig offen.", en: "MRadmin keeps this many connections to the database open at once."}
      - key: storage.server-id
        heading: {de: "Mehrere Server", en: "Several servers"}
        advanced: true
        type: string
        restart: true
        max-length: 32
        name: {de: Name dieses Servers, en: Name of this server}
        help: {de: Nur wichtig wenn mehrere Server eine Datenbank teilen., en: Only relevant if several servers share one database.}
      - key: storage.table-prefix
        advanced: true
        type: string
        restart: true
        max-length: 32
        name: {de: Tabellen-Präfix, en: Table prefix}
        help: {de: "Steht vor jedem Tabellennamen (z.B. mradmin_tickets) - falls die Datenbank auch für anderes genutzt wird.", en: "Put before every table name (e.g. mradmin_tickets) - in case the database is also used for other things."}

  - id: logging
    name: {de: Protokoll, en: Log}
    group: {de: "Server & Neustarts", en: "Server & restarts"}
    help: {de: "Alle Ereignisse von MRadmin und den Plugins (wie im Discord-Log) und die Aktionen in der Weboberfläche - Seite Protokoll.", en: "All events of MRadmin and the plugins (like in the Discord log) and the actions in the web interface - page Log."}
    fields:
      - key: logging.keep-days
        type: int
        min: 1
        max: 14
        unit: {de: Tage, en: days}
        name: {de: Aufheben, en: Keep}
        help: {de: "So viele Tage bleiben die Einträge der Seite Protokoll erhalten (1-14).", en: "This many days the entries of the page Log are kept (1-14)."}

  - id: notifications
    name: {de: Team-Meldungen, en: Team notices}
    group: {de: "Spieler & Team", en: "Players & team"}
    help: {de: "Neue Tickets, Bewerbungen, Abstürze, Updates ... im Posteingang, als Push und im Spiel. Jedes Teammitglied wählt im Konto selbst, was es wie bekommt.", en: "New tickets, applications, crashes, updates ... in the inbox, as push and in the game. Each team member chooses in their account what they get and how."}
    fields:
      - key: notifications.disabled
        type: choices
        name: {de: Für alle ausgeschaltet, en: Off for everyone}
        help: {de: "Diese Arten gehen an niemanden - weder Posteingang noch Push noch Spiel.", en: "These kinds go to nobody - neither inbox nor push nor game."}
        options:
          - {value: ticket-new, de: Neue Tickets, en: New tickets}
          - {value: ticket-mine, de: Nachrichten in übernommenen Tickets, en: Messages in claimed tickets}
          - {value: ticket-message, de: Alle Ticket-Nachrichten, en: All ticket messages}
          - {value: application, de: Whitelist-Bewerbungen, en: Whitelist applications}
          - {value: server-crash, de: Abstürze und Hänger, en: Crashes and hangs}
          - {value: update-available, de: Updates verfügbar, en: Updates available}
          - {value: update-ready, de: Updates bereit, en: Updates ready}
          - {value: lag, de: Lag-Alarm, en: Lag alarm}
          - {value: maintenance, de: Wartungen, en: Maintenance}
          - {value: chunks-locked, de: Chunkloader gesperrt, en: Chunk loader locked, plugin: MRchunks}
          - {value: chunks-shed, de: Lag-Schutz der Chunkloader, en: Lag protection of the chunk loaders, plugin: MRchunks}
          - {value: pvp-review, de: Duell-Runde wartet auf Prüfung, en: Duel round waits for review, plugin: MRpvp}

  - id: tickets
    name: {de: Tickets & Meldungen, en: Tickets & reports}
    group: {de: "Spieler & Team", en: "Players & team"}
    help: {de: "/report für alle Spieler. Eigene Kategorien legst du in der Datei an (tickets.categories).", en: "/report for all players. Own categories are added in the file (tickets.categories)."}
    fields:
      - key: tickets.cooldown
        heading: {de: "Grenzen", en: "Limits"}
        type: duration
        name: {de: Wartezeit zwischen Tickets, en: Wait between tickets}
        help: {de: Für das Team gilt keine., en: None for the team.}
      - key: tickets.reply-cooldown
        advanced: true
        type: duration
        name: {de: Wartezeit zwischen Nachrichten, en: Wait between messages}
        help: {de: "Mindestabstand zwischen zwei Nachrichten eines Spielers im selben Ticket (gegen Spam).", en: "Minimum time between two messages of a player in the same ticket (against spam)."}
      - key: tickets.max-open-per-player
        type: int
        min: 1
        max: 100
        name: {de: Offene Tickets pro Spieler, en: Open tickets per player}
        help: {de: "Höchstens so viele offene Tickets pro Spieler, alle Kategorien zusammen.", en: "At most this many open tickets per player, all categories together."}
      - key: tickets.min-subject-length
        advanced: true
        type: int
        min: 1
        max: 100
        unit: {de: Zeichen, en: characters}
        name: {de: Betreff mindestens, en: Subject at least}
        help: {de: "Mindestlänge des Betreffs (bei Spielermeldungen gibt es keinen Betreff).", en: "Minimum length of the subject (player reports have no subject)."}
      - key: tickets.max-subject-length
        advanced: true
        type: int
        min: 5
        max: 200
        unit: {de: Zeichen, en: characters}
        name: {de: Betreff höchstens, en: Subject at most}
        help: {de: "Höchstlänge des Betreffs - das Formular lässt nicht mehr zu.", en: "Maximum length of the subject - the form does not allow more."}
      - key: tickets.min-text-length
        advanced: true
        type: int
        min: 1
        max: 1000
        unit: {de: Zeichen, en: characters}
        name: {de: Text mindestens, en: Text at least}
        help: {de: "Mindestlänge der Beschreibung eines neuen Tickets.", en: "Minimum length of the description of a new ticket."}
      - key: tickets.max-text-length
        advanced: true
        type: int
        min: 10
        max: 5000
        unit: {de: Zeichen, en: characters}
        name: {de: Text höchstens, en: Text at most}
        help: {de: "Höchstlänge der Texte - das Formular lässt nicht mehr zu.", en: "Maximum length of the texts - the form does not allow more."}
      - key: tickets.notify-creator
        heading: {de: "Ablauf", en: "Handling"}
        type: bool
        name: {de: Spieler beim Schließen informieren, en: Tell the player on closing}
        help: {de: "Den Spieler benachrichtigen, wenn das Team sein Ticket schließt (wenn er online ist). Neue Antworten meldet MRadmin immer, offline beim nächsten Join.", en: "Let the player know when the team closes their ticket (if online). New replies are always reported, when offline on the next join."}
      - key: tickets.show-staff-names
        type: bool
        name: {de: Namen des Teams zeigen, en: Show team names}
        help: {de: Aus = Spieler sehen nur „Team“., en: Off = players only see "Team".}
      - key: tickets.team-icon
        type: string
        when: "!tickets.show-staff-names"
        max-length: 64
        name: {de: Bild für das Team, en: Picture for the team}
        help: {de: "Item-Name, z.B. NETHER_STAR.", en: "Item name, e.g. NETHER_STAR."}
      - key: tickets.auto-claim
        type: bool
        name: {de: Wer zuerst antwortet übernimmt, en: First to answer takes over}
        help: {de: "Wer aus dem Team zuerst antwortet, übernimmt das Ticket - weitere Nachrichten des Spielers gehen dann nur an ihn, solange er online ist.", en: "Whoever from the team answers first takes over the ticket - further messages of the player then only go to them while online."}
      - key: tickets.shown-messages
        advanced: true
        type: int
        min: 5
        max: 200
        name: {de: Gezeigte Nachrichten, en: Messages shown}
        help: {de: "Das Ticket zeigt so viele der neuesten Nachrichten, ältere werden ausgeblendet.", en: "The ticket shows this many of the latest messages, older ones are hidden."}
      - key: tickets.sound
        type: string
        max-length: 80
        name: {de: Ton für neue Tickets, en: Sound for new tickets}
        help: {de: Leer = kein Ton., en: Empty = no sound.}
      - key: tickets.keep-closed
        heading: {de: "Aufheben & Darstellung", en: "Keeping & look"}
        type: duration
        name: {de: Geschlossene aufheben, en: Keep closed ones}
        help: {de: "So lange bleiben geschlossene Tickets erhalten (auch für den Spieler sichtbar), danach werden sie gelöscht.", en: "Closed tickets are kept this long (also visible to the player), then deleted."}
      - key: tickets.plugin-reports
        type: bool
        name: {de: Automatische Tickets der Plugins, en: Automatic tickets from plugins}
        help: {de: "Z.B. MRchunks bei einer Lag-Sperre - der Spieler kann dort erklären, was passiert ist.", en: "E.g. MRchunks on a lag lock - the player can explain there what happened."}
      - key: tickets.icon
        advanced: true
        type: string
        max-length: 64
        name: {de: Symbol der Tickets, en: Icon of the tickets}
        help: {de: "Symbol aller Tickets in den Menüs, als Item-Name (z.B. NAME_TAG).", en: "Icon of all tickets in the menus, as an item name (e.g. NAME_TAG)."}
      - key: tickets.categories
        heading: {de: "Kategorien", en: "Categories"}
        type: table
        name: {de: Kategorien, en: Categories}
        help: {de: "Name leer = Text aus der Sprachdatei. Spielermeldung = zuerst einen Spieler wählen. Permission leer = alle.", en: "Empty name = text from the language file. Player report = pick a player first. Empty permission = everyone."}
        columns:
          - {key: name, type: string, name: {de: Name, en: Name}, default: ""}
          - {key: player, type: bool, name: {de: Spielermeldung, en: Player report}, default: false}
          - {key: permission, type: string, name: {de: Permission, en: Permission}, default: ""}
          - {key: enabled, type: bool, name: {de: Aktiv, en: Active}, default: true}
        rows:
          cheating: {de: Cheating, en: Cheating}
          chat: {de: Chat, en: Chat}
          griefing: {de: Griefing, en: Griefing}
          scam: {de: Betrug, en: Scam}
          bug: {de: Fehler, en: Bug}
          other: {de: Sonstiges, en: Other}

  - id: admin-mode
    name: {de: Admin-Modus, en: Admin mode}
    group: {de: "Spieler & Team", en: "Players & team"}
    help: {de: "Inventar und Position werden gesichert, du bekommst nur das Admin-Menü-Item. Eigene Knöpfe fürs Dashboard stehen in der Datei (admin-mode.menu.buttons).", en: "Inventory and position are saved, you only get the admin menu item. Own dashboard buttons are in the file (admin-mode.menu.buttons)."}
    fields:
      - key: admin-mode.gamemode
        type: choice
        name: {de: Spielmodus, en: Game mode}
        help: {de: Im Zuschauermodus lassen sich Menüs nicht anklicken., en: Menus cannot be clicked in spectator mode.}
        options:
          - {value: CREATIVE, de: Kreativ, en: Creative}
          - {value: SPECTATOR, de: Zuschauer, en: Spectator}
      - key: admin-mode.return-to-start
        type: bool
        name: {de: Zurück zum Startpunkt, en: Back to the starting point}
        help: {de: "Beim Beenden des Admin-Modus zurück an die Stelle, an der er begonnen wurde.", en: "When admin mode ends, go back to where it started."}
      - key: admin-mode.compass-material
        type: string
        max-length: 64
        name: {de: Item des Admin-Menüs, en: Item of the admin menu}
        help: {de: "Nicht den Kompass nehmen - WorldEdit teleportiert damit.", en: "Do not use the compass - WorldEdit teleports with it."}
      - key: admin-mode.compass-slot
        advanced: true
        type: int
        min: 0
        max: 8
        name: {de: Platz in der Hotbar, en: Hotbar slot}
        help: {de: 0 bis 8., en: 0 to 8.}
      - key: admin-mode.prevent-drop
        type: bool
        name: {de: Nichts fallen lassen, en: No dropping}
        help: {de: "Im Admin-Modus keine Items fallen lassen - schützt vor Kreativ-Items im Überlebensmodus.", en: "No dropping items in admin mode - protects against creative items in survival."}
      - key: admin-mode.prevent-pickup
        type: bool
        name: {de: Nichts aufheben, en: No picking up}
        help: {de: "Im Admin-Modus keine Items aufheben.", en: "No picking up items in admin mode."}
      - key: admin-mode.end-on-quit
        type: bool
        name: {de: Beim Verlassen beenden, en: End on leaving}
        help: {de: "Aus = beim nächsten Betreten geht es im Admin-Modus weiter.", en: "Off = it continues in admin mode on the next join."}

  - id: announce
    name: {de: Ankündigungen, en: Announcements}
    group: {de: "Spieler & Team", en: "Players & team"}
    help: {de: "Aussehen von /mradmin announce. Eigene Vorlagen legst du in der Weboberfläche unter Kommunikation an.", en: "Look of /mradmin announce. Own presets are made in the web interface under Communication."}
    fields:
      - key: announce.fade-in
        advanced: true
        type: decimal
        min: 0
        max: 10
        unit: {de: Sekunden, en: seconds}
        name: {de: Einblenden, en: Fade in}
        help: {de: "So lange blendet der Titel einer Ankündigung ein.", en: "How long the title of an announcement fades in."}
      - key: announce.stay
        type: decimal
        min: 0
        max: 60
        unit: {de: Sekunden, en: seconds}
        name: {de: Anzeigen, en: Stay}
        help: {de: "So lange bleibt der Titel auf dem Bildschirm.", en: "How long the title stays on screen."}
      - key: announce.fade-out
        advanced: true
        type: decimal
        min: 0
        max: 10
        unit: {de: Sekunden, en: seconds}
        name: {de: Ausblenden, en: Fade out}
        help: {de: "So lange blendet der Titel aus.", en: "How long the title fades out."}
      - key: announce.chat
        type: bool
        name: {de: Auch im Chat, en: In the chat too}
        help: {de: "Die Ankündigung zusätzlich in den Chat schreiben.", en: "Also write the announcement into the chat."}
      - key: announce.sound
        type: string
        max-length: 80
        name: {de: Ton, en: Sound}
        help: {de: Leer = kein Ton., en: Empty = no sound.}
      - key: announce.volume
        advanced: true
        type: decimal
        min: 0
        max: 10
        name: {de: Lautstärke, en: Volume}
        help: {de: "Lautstärke des Tons (0 bis 1, darüber hört man ihn weiter weg).", en: "Volume of the sound (0 to 1, above that it is heard further away)."}
      - key: announce.pitch
        advanced: true
        type: decimal
        min: 0.5
        max: 2
        name: {de: Tonhöhe, en: Pitch}
        help: {de: "Tonhöhe des Tons (0,5 tief bis 2 hoch, 1 = normal).", en: "Pitch of the sound (0.5 low to 2 high, 1 = normal)."}

  - id: maintenance
    name: {de: Wartung, en: Maintenance}
    group: {de: "Spieler & Team", en: "Players & team"}
    help: {de: "Während der Wartung kommen nur Spieler mit mradmin.maintenance.bypass auf den Server.", en: "During maintenance only players with mradmin.maintenance.bypass can join."}
    fields:
      - key: maintenance.warn-before
        heading: {de: "Ankündigen", en: "Announcing"}
        type: duration
        name: {de: Bossbar ab, en: Boss bar from}
        help: {de: So lange vor dem Beginn erscheint die Bossbar mit Countdown., en: The boss bar with countdown appears this long before the start.}
      - key: maintenance.bossbar.enabled
        heading: {de: "Bossbar", en: "Boss bar"}
        type: bool
        name: {de: Bossbar, en: Boss bar}
        help: {de: "Bossbar mit Countdown vor dem Beginn (für alle) und mit der Restzeit während der Wartung (nur Team).", en: "Boss bar with a countdown before the start (everyone) and the remaining time during maintenance (team only)."}
      - key: maintenance.bossbar.color
        type: choice
        when: maintenance.bossbar.enabled
        name: {de: Farbe, en: Colour}
        help: {de: "Farbe der Bossbar vor dem Beginn.", en: "Colour of the boss bar before the start."}
        options: &barColors
          - {value: YELLOW, de: Gelb, en: Yellow}
          - {value: RED, de: Rot, en: Red}
          - {value: GREEN, de: Grün, en: Green}
          - {value: BLUE, de: Blau, en: Blue}
          - {value: PINK, de: Rosa, en: Pink}
          - {value: PURPLE, de: Lila, en: Purple}
          - {value: WHITE, de: Weiß, en: White}
      - key: maintenance.bossbar.final-color
        type: choice
        when: maintenance.bossbar.enabled
        name: {de: Farbe kurz vor dem Beginn, en: Colour shortly before the start}
        help: {de: "In den letzten Sekunden vor dem Beginn wechselt die Bossbar auf diese Farbe.", en: "In the last seconds before the start the boss bar changes to this colour."}
        options: *barColors
      - key: maintenance.bossbar.final-seconds
        advanced: true
        type: int
        when: maintenance.bossbar.enabled
        min: 0
        max: 3600
        unit: {de: Sekunden, en: seconds}
        name: {de: Kurz vor dem Beginn heißt, en: Shortly before means}
        help: {de: "Ab wie vielen Sekunden vor dem Beginn die Farbe wechselt.", en: "How many seconds before the start the colour changes."}
      - key: maintenance.bossbar.overlay
        advanced: true
        type: choice
        when: maintenance.bossbar.enabled
        name: {de: Unterteilung, en: Segments}
        help: {de: "Durchgehender Balken oder in 6, 10, 12 bzw. 20 Abschnitte geteilt.", en: "A continuous bar or split into 6, 10, 12 or 20 segments."}
        options:
          - {value: PROGRESS, de: Durchgehend, en: Continuous}
          - {value: NOTCHED_6, de: 6 Teile, en: 6 parts}
          - {value: NOTCHED_10, de: 10 Teile, en: 10 parts}
          - {value: NOTCHED_12, de: 12 Teile, en: 12 parts}
          - {value: NOTCHED_20, de: 20 Teile, en: 20 parts}
      - key: maintenance.bossbar.show-during-maintenance
        type: bool
        when: maintenance.bossbar.enabled
        name: {de: Restzeit fürs Team, en: Remaining time for the team}
        help: {de: Während der Wartung eine Bossbar mit der Restzeit (wenn das Ende bekannt ist)., en: During maintenance a boss bar with the remaining time (if the end is known).}
      - key: maintenance.bossbar.during-color
        type: choice
        when: maintenance.bossbar.show-during-maintenance
        name: {de: Farbe während der Wartung, en: Colour during maintenance}
        help: {de: "Farbe der Bossbar während der Wartung (sieht nur das Team).", en: "Colour of the boss bar during maintenance (only the team sees it)."}
        options: *barColors
      - key: maintenance.reminders
        heading: {de: "Erinnerungen & Ton", en: "Reminders & sound"}
        type: strings
        item: duration
        name: {de: Erinnerungen im Chat, en: Reminders in the chat}
        help: {de: So lange vor dem Beginn jeweils eine Nachricht., en: A message this long before the start each.}
      - key: maintenance.title-countdown-seconds
        type: int
        min: 0
        max: 300
        unit: {de: Sekunden, en: seconds}
        name: {de: Großer Countdown ab, en: Big countdown from}
        help: {de: "Countdown in der Bildschirmmitte, 0 = aus.", en: "Countdown in the middle of the screen, 0 = off."}
      - key: maintenance.sound
        type: string
        max-length: 80
        name: {de: Ton, en: Sound}
        help: {de: "Bukkit-Name, z.B. BLOCK_NOTE_BLOCK_PLING. Leer = kein Ton.", en: "Bukkit name, e.g. BLOCK_NOTE_BLOCK_PLING. Empty = no sound."}
      - key: maintenance.kick-on-start
        heading: {de: "Beginn", en: "At the start"}
        type: bool
        name: {de: Beim Beginn kicken, en: Kick at the start}
        help: {de: Spieler ohne Bypass werden vom Server geworfen., en: Players without bypass are kicked from the server.}
      - key: maintenance.kick-delay-seconds
        advanced: true
        type: int
        when: maintenance.kick-on-start
        min: 0
        max: 300
        unit: {de: Sekunden, en: seconds}
        name: {de: Kicken nach, en: Kick after}
        help: {de: "So viele Sekunden nach dem Beginn werden Spieler ohne Zugang gekickt - Zeit, die Nachricht noch zu lesen.", en: "Players without access are kicked this many seconds after the start - time to still read the message."}
      - key: maintenance.motd.enabled
        heading: {de: "Serverliste", en: "Server list"}
        type: bool
        name: {de: Eigene MOTD in der Serverliste, en: Own MOTD in the server list}
        help: {de: "Während der Wartung zeigt die Serverliste den Text „maintenance-motd“ aus der Sprachdatei statt der normalen MOTD.", en: "During maintenance the server list shows the text maintenance-motd from the language file instead of the normal MOTD."}
      - key: maintenance.motd.replace-version
        type: bool
        when: maintenance.motd.enabled
        name: {de: „Wartung“ statt Spielerzahl, en: "\"Maintenance\" instead of the player count"}
        help: {de: "Statt der Spielerzahl steht rechts in der Serverliste „Wartung“ in Rot (Text „maintenance-version-text“).", en: "Instead of the player count, Maintenance appears on the right of the server list in red (text maintenance-version-text)."}

  - id: uptime-kuma
    name: {de: Uptime Kuma, en: Uptime Kuma}
    group: {de: "Spieler & Team", en: "Players & team"}
    help: {de: "MRadmin meldet sich bei Uptime Kuma an und übernimmt die Wartungsfenster live.", en: "MRadmin logs in to Uptime Kuma and follows the maintenance windows live."}
    fields:
      - key: uptime-kuma.enabled
        heading: {de: "Wartungen aus Kuma", en: "Maintenance from Kuma"}
        type: bool
        name: {de: Wartungen aus Uptime Kuma, en: Maintenance from Uptime Kuma}
        help: {de: "Geplante Wartungen aus Uptime Kuma übernehmen (braucht Adresse und Anmeldung). Für Vorfälle der Statusseiten reicht die Adresse.", en: "Take over planned maintenance from Uptime Kuma (needs address and login). For incidents of status pages the address is enough."}
      - key: uptime-kuma.url
        type: string
        max-length: 300
        name: {de: Adresse, en: Address}
        help: {de: "Z.B. https://status.deinserver.at - auch für die Vorfälle der Statusseiten nötig.", en: "E.g. https://status.yourserver.com - also needed for the incidents of the status pages."}
      - key: uptime-kuma.username
        type: string
        when: uptime-kuma.enabled
        max-length: 120
        name: {de: Benutzername, en: Username}
        help: {de: "Benutzer für die Anmeldung bei Uptime Kuma (alternativ ein Token).", en: "User for the login to Uptime Kuma (or a token instead)."}
      - key: uptime-kuma.password
        type: secret
        when: uptime-kuma.enabled
        max-length: 300
        name: {de: Passwort, en: Password}
        help: {de: "Passwort zum Benutzer oben. Wird nie im Browser angezeigt.", en: "Password of the user above. Never shown in the browser."}
      - key: uptime-kuma.token
        type: secret
        when: uptime-kuma.enabled
        max-length: 2000
        name: {de: Token statt Passwort, en: Token instead of password}
        help: {de: "Nötig mit 2FA: im Browser bei Kuma anmelden, F12 → Local Storage → Wert von „token“.", en: "Needed with 2FA: log in to Kuma in the browser, F12 → Local Storage → value of \"token\"."}
      - key: uptime-kuma.monitor-ids
        type: ints
        when: uptime-kuma.enabled
        min: 0
        max: 1000000
        name: {de: Monitor-IDs, en: Monitor IDs}
        help: {de: "Wartungen, die einen dieser Monitore betreffen. Beide Listen leer = jede Wartung.", en: "Maintenance affecting one of these monitors. Both lists empty = every maintenance."}
      - key: uptime-kuma.maintenance-ids
        type: ints
        when: uptime-kuma.enabled
        min: 0
        max: 1000000
        name: {de: Wartungs-IDs, en: Maintenance IDs}
        help: {de: Genau diese Wartungsfenster., en: Exactly these maintenance windows.}
      - key: uptime-kuma.refresh-seconds
        advanced: true
        type: int
        when: uptime-kuma.enabled
        min: 10
        max: 3600
        unit: {de: Sekunden, en: seconds}
        name: {de: Liste zusätzlich holen alle, en: Fetch the list again every}
        help: {de: "Änderungen kommen sofort an; zur Sicherheit wird die ganze Liste zusätzlich so oft neu geholt.", en: "Changes arrive right away; to be safe the whole list is also fetched again this often."}
      - key: uptime-kuma.reconnect-seconds
        advanced: true
        type: int
        when: uptime-kuma.enabled
        min: 5
        max: 3600
        unit: {de: Sekunden, en: seconds}
        name: {de: Neu verbinden nach, en: Reconnect after}
        help: {de: "Nach einer abgebrochenen Verbindung so lange warten, dann neu verbinden.", en: "After a lost connection, wait this long and connect again."}
      - key: uptime-kuma.keep-schedule-when-offline
        advanced: true
        type: bool
        when: uptime-kuma.enabled
        name: {de: Plan behalten wenn Kuma weg ist, en: Keep the schedule when Kuma is gone}
        help: {de: "Ist Kuma nicht erreichbar, gilt der zuletzt bekannte Plan weiter (an) oder wird verworfen (aus).", en: "If Kuma cannot be reached, the last known schedule stays valid (on) or is discarded (off)."}
      - key: uptime-kuma.status-pages
        heading: {de: "Vorfälle der Statusseiten", en: "Incidents of status pages"}
        type: strings
        name: {de: Statusseiten für Vorfälle, en: Status pages for incidents}
        help: {de: "Slugs, z.B. main für /status/main. Angeheftete Vorfälle erscheinen auf der Spielerseite und im Spiel. Braucht nur die Adresse.", en: "Slugs, e.g. main for /status/main. Pinned incidents show on the player page and in game. Only needs the address."}
      - key: uptime-kuma.incidents
        type: bool
        name: {de: Vorfälle übernehmen, en: Take over incidents}
        help: {de: "Auf den Statusseiten angeheftete Vorfälle (z.B. bei einem Ausfall) als Warnung auf der Spielerseite und im Spiel zeigen.", en: "Show incidents pinned on the status pages (e.g. during an outage) as a warning on the player page and in game."}
      - key: uptime-kuma.incident-seconds
        advanced: true
        type: int
        when: uptime-kuma.incidents
        min: 5
        max: 3600
        unit: {de: Sekunden, en: seconds}
        name: {de: Vorfälle lesen alle, en: Read incidents every}
        help: {de: "Wie oft die Statusseiten nach Vorfällen abgefragt werden.", en: "How often the status pages are read for incidents."}

  - id: web
    name: {de: Weboberfläche, en: Web interface}
    group: {de: "Weboberfläche & Karte", en: "Web interface & map"}
    help: {de: "Der eingebaute Webserver hört nur lokal - erreichbar über deinen Reverse-Proxy mit HTTPS. Änderungen starten den Webserver neu.", en: "The built-in web server only listens locally - reachable through your reverse proxy with HTTPS. Changes restart the web server."}
    fields:
      - key: web.enabled
        heading: {de: "Adresse & Proxy", en: "Address & proxy"}
        type: bool
        name: {de: Weboberfläche an, en: Web interface on}
        help: {de: "Aus schaltet auch diese Seite ab - zurück nur über die Datei.", en: "Off also switches this page off - back only through the file."}
      - key: web.bind
        type: string
        max-length: 64
        name: {de: Adresse des Webservers, en: Address of the web server}
        help: {de: "Nur ändern, wenn der Proxy auf einem anderen Rechner läuft (dann z.B. 0.0.0.0 + Firewall).", en: "Only change if the proxy runs on another machine (then e.g. 0.0.0.0 + firewall)."}
      - key: web.port
        type: int
        min: 1
        max: 65535
        name: {de: Port, en: Port}
        help: {de: "Port des eingebauten Webservers. Dein Reverse-Proxy leitet auf ihn weiter.", en: "Port of the built-in web server. Your reverse proxy forwards to it."}
      - key: web.public-url
        type: string
        max-length: 300
        name: {de: Öffentliche Adresse, en: Public address}
        help: {de: "Z.B. https://admin.deinserver.at - für Links, Anmeldung, Passkeys und die Spielerseite.", en: "E.g. https://admin.yourserver.com - for links, sign-in, passkeys and the player page."}
      - key: web.trusted-proxies
        type: strings
        name: {de: Vertrauenswürdige Proxys, en: Trusted proxies}
        help: {de: Nur ihnen glaubt MRadmin die echte Besucher-IP (X-Forwarded-For)., en: MRadmin only trusts these for the real visitor IP (X-Forwarded-For).}
      - key: web.login.require-2fa
        heading: {de: "Anmeldung", en: "Sign-in"}
        type: bool
        name: {de: 2FA fürs Team erzwingen, en: Require 2FA for the team}
        help: {de: "Das Team braucht für die Verwaltung zusätzlich 2FA (Code aus einer App). Sonst reicht eine eigene Anmeldung (Passwort, Passkey oder Discord).", en: "The team additionally needs 2FA (code from an app) for the administration. Otherwise an own sign-in (password, passkey or Discord) is enough."}
      - key: web.login.passkeys
        type: bool
        name: {de: Anmeldung mit Passkey, en: Sign-in with passkey}
        help: {de: "Anmelden mit Fingerabdruck, Face ID, Windows Hello oder Passwort-Manager. Funktioniert nur unter der öffentlichen Adresse.", en: "Sign in with fingerprint, Face ID, Windows Hello or a password manager. Only works under the public address."}
      - key: web.login.password
        type: bool
        name: {de: Anmeldung mit Passwort, en: Sign-in with password}
        help: {de: "Mit Spielername oder bestätigter E-Mail-Adresse - mit Code aus der App, wenn 2FA an ist.", en: "With the player name or a confirmed e-mail address - with a code from the app if 2FA is on."}
      - key: web.login.discord.enabled
        type: bool
        name: {de: Anmeldung mit Discord, en: Sign-in with Discord}
        help: {de: "Discord-Anwendung anlegen, Weiterleitung <public-url>/api/discord/callback eintragen.", en: "Create a Discord application, add the redirect <public-url>/api/discord/callback."}
      - key: web.login.discord.client-id
        type: string
        when: web.login.discord.enabled
        max-length: 64
        name: {de: Discord Client-ID, en: Discord client ID}
        help: {de: "Client-ID deiner Discord-Anwendung (Developer Portal) für „Mit Discord anmelden“.", en: "Client ID of your Discord application (developer portal) for Sign in with Discord."}
      - key: web.login.discord.client-secret
        type: secret
        when: web.login.discord.enabled
        max-length: 200
        name: {de: Discord Client-Secret, en: Discord client secret}
        help: {de: "Client-Secret derselben Discord-Anwendung. Wird nie im Browser angezeigt.", en: "Client secret of the same Discord application. Never shown in the browser."}
      - key: web.item-icons
        heading: {de: "Darstellung & Rechtliches", en: "Display & legal"}
        advanced: true
        type: bool
        name: {de: Item-Bilder, en: Item pictures}
        help: {de: "Texturen einmal aus dem offiziellen Minecraft-Client laden (ca. 40 MB). Aus = Kürzel statt Bilder.", en: "Load the textures once from the official Minecraft client (about 40 MB). Off = short labels instead of pictures."}
      - key: web.legal.imprint-url
        type: string
        max-length: 300
        name: {de: Impressum-Link, en: Imprint link}
        help: {de: Leer = Text aus plugins/MRadmin/web/impressum.md., en: Empty = text from plugins/MRadmin/web/impressum.md.}
      - key: web.legal.privacy-url
        type: string
        max-length: 300
        name: {de: Datenschutz-Link, en: Privacy link}
        help: {de: Leer = Text aus plugins/MRadmin/web/datenschutz.md., en: Empty = text from plugins/MRadmin/web/datenschutz.md.}
      - key: web.push.contact
        advanced: true
        type: string
        max-length: 200
        name: {de: Kontakt für Push, en: Contact for push}
        help: {de: "mailto:du@deinserver.at oder https-Adresse. Leer = public-url. Apple braucht einen gültigen Kontakt.", en: "mailto:you@yourserver.com or an https address. Empty = public-url. Apple needs a valid contact."}
      - key: web.privacy.audit-retention
        heading: {de: "Datenschutz", en: "Privacy"}
        type: duration
        name: {de: Protokoll aufheben, en: Keep the log}
        help: {de: "Einträge im Protokoll der Weboberfläche (mit IP-Adressen) nach dieser Zeit automatisch löschen.", en: "Delete entries in the web interface's log (with IP addresses) automatically after this time."}
      - key: web.privacy.mask-ip
        type: bool
        name: {de: IP-Adressen kürzen, en: Shorten IP addresses}
        help: {de: 1.2.3.4 → 1.2.3.0 im Protokoll und bei den Geräten., en: 1.2.3.4 → 1.2.3.0 in the log and for the devices.}

  - id: console
    name: {de: Web-Konsole, en: Web console}
    group: {de: "Weboberfläche & Karte", en: "Web interface & map"}
    help: {de: "Konsolenausgabe im Protokoll und Befehle im Browser (Seite Konsole). Vor dem Öffnen der Konsole fragt die Seite den Code aus der App ab.", en: "Console output on the page Log and commands in the browser (page Console). Before opening the console, the page asks for the code from the app."}
    fields:
      - key: web.console.enabled
        type: bool
        name: {de: Web-Konsole an, en: Web console on}
        help: {de: "Seite Konsole im Browser: Server-Ausgabe lesen und Befehle ausführen (nur Admins, nach Entsperren mit einem frischen Code).", en: "Page Console in the browser: read the server output and run commands (admins only, after unlocking with a fresh code)."}
      - key: web.console.unlock-minutes
        advanced: true
        type: int
        when: web.console.enabled
        min: 1
        max: 240
        unit: {de: Minuten, en: minutes}
        name: {de: Offen bleiben nach dem Code, en: Stay open after the code}
        help: {de: "So lange bleibt die Konsole nach dem Code entsperrt (pro Gerät).", en: "The console stays unlocked this long after the code (per device)."}
      - key: web.console.lines
        advanced: true
        type: int
        when: web.console.enabled
        min: 100
        max: 10000
        name: {de: Gemerkte Zeilen, en: Lines kept}
        help: {de: "So viele der neuesten Zeilen merkt sich MRadmin für die Konsole.", en: "MRadmin keeps this many of the newest lines for the console."}
      - key: web.console.blocked
        type: strings
        when: web.console.enabled
        name: {de: Gesperrte Befehle, en: Blocked commands}
        help: {de: "Gehen nie über die Web-Konsole - auch nicht versteckt in execute … run.", en: "Never work through the web console - not even hidden in execute … run."}
      - key: web.console.hide-links
        type: bool
        when: web.console.enabled
        name: {de: Links ausblenden, en: Hide links}
        help: {de: "Links in der Ausgabe ausblenden (z.B. Einrichtungslinks).", en: "Hide links in the output (e.g. setup links)."}
      - key: web.console.hide-ips
        type: bool
        when: web.console.enabled
        name: {de: IP-Adressen ausblenden, en: Hide IP addresses}
        help: {de: "IP-Adressen in der Ausgabe ausblenden (z.B. beim Join).", en: "Hide IP addresses in the output (e.g. on join)."}

  - id: branding
    name: {de: Aussehen, en: Appearance}
    group: {de: "Weboberfläche & Karte", en: "Web interface & map"}
    help: {de: "Name, Farbe und Fußzeile der Weboberfläche - mit Vorschau und Logo-Upload unter Server → Aussehen.", en: "Name, colour and footer of the web interface - with preview and logo upload under Server → Appearance."}
    fields:
      - key: branding.name
        type: string
        name: {de: Name des Servers, en: Name of the server}
        help: {de: "Statt „MRadmin“ in Browser-Tab, Anmeldung, Leiste, Mails, 2FA-App und bei Passkeys. Leer = Text mail-server-name.", en: "Instead of \"MRadmin\" in the browser tab, sign-in, bar, mails, 2FA app and passkeys. Empty = text mail-server-name."}
      - key: branding.tagline
        type: string
        name: {de: Spruch, en: Tagline}
        help: {de: Kurze Zeile unter dem Namen auf der Anmeldeseite., en: Short line under the name on the sign-in page.}
      - key: branding.accent
        type: color
        name: {de: Akzentfarbe, en: Accent colour}
        help: {de: "Knöpfe und Hervorhebungen; die Schriftfarbe darauf wählt die Seite selbst.", en: "Buttons and highlights; the text colour on it is chosen by the page."}
      - key: branding.footer-text
        type: string
        name: {de: Text in der Fußzeile, en: Footer text}
        help: {de: Auf der Seite und in den Mails. Leer = keiner., en: On the page and in the mails. Empty = none.}
      - key: branding.links
        type: table
        name: {de: Links in der Fußzeile, en: Footer links}
        help: {de: "Bis zu 4 Links, z.B. Discord, Website, Regeln. Ohne Name oder Adresse wird ein Link nicht gezeigt.", en: "Up to 4 links, e.g. Discord, website, rules. Without a label or address a link is not shown."}
        columns:
          - {key: label, type: string, name: {de: Name, en: Label}, default: ""}
          - {key: url, type: string, name: {de: Adresse, en: Address}, default: ""}
        rows:
          link-1: {de: Link 1, en: Link 1}
          link-2: {de: Link 2, en: Link 2}
          link-3: {de: Link 3, en: Link 3}
          link-4: {de: Link 4, en: Link 4}

  - id: player-web
    name: {de: Spielerseite, en: Player page}
    group: {de: "Weboberfläche & Karte", en: "Web interface & map"}
    help: {de: "Jeder Spieler bekommt unter <public-url>/me seine eigene Seite - Anmeldung mit dem Code aus /web.", en: "Every player gets their own page under <public-url>/me - sign-in with the code from /web."}
    fields:
      - key: player-web.enabled
        heading: {de: "Anmeldung", en: "Sign-in"}
        type: bool
        name: {de: Spielerseite an, en: Player page on}
        help: {de: Braucht die Weboberfläche und die öffentliche Adresse., en: Needs the web interface and the public address.}
      - key: player-web.session-days
        type: int
        when: player-web.enabled
        min: 1
        max: 365
        unit: {de: Tage, en: days}
        name: {de: Angemeldet höchstens, en: Signed in at most}
        help: {de: "So lange bleibt ein Browser nach dem Code aus /web höchstens angemeldet. Danach fragt die Seite nach einem neuen Code - das Lesezeichen bleibt gültig.", en: "A browser stays signed in at most this long after the code from /web. Then the page asks for a new code - the bookmark keeps working."}
      - key: player-web.idle-days
        type: int
        when: player-web.enabled
        min: 1
        max: 365
        unit: {de: Tage, en: days}
        name: {de: Abmelden nach ungenutzt, en: Sign out after unused}
        help: {de: "... und wird früher abgemeldet, wenn die Seite so lange nicht geöffnet wurde.", en: "... and is signed out earlier if the page was not opened for this long."}
      - key: player-web.code-seconds
        advanced: true
        type: int
        when: player-web.enabled
        min: 30
        max: 3600
        unit: {de: Sekunden, en: seconds}
        name: {de: Code gilt, en: Code works for}
        help: {de: "So lange gilt der 6-stellige Code aus /web - und nur einmal.", en: "The 6-digit code from /web works this long - and only once."}
      - key: player-web.max-devices
        advanced: true
        type: int
        when: player-web.enabled
        min: 1
        max: 50
        name: {de: Geräte pro Spieler, en: Devices per player}
        help: {de: "Höchstens so viele Browser pro Spieler. Meldet er einen weiteren an, wird der am längsten ungenutzte abgemeldet.", en: "At most this many browsers per player. Signing in one more signs out the one unused the longest."}
      - key: player-web.rankings.enabled
        heading: {de: "Statistik & Ranglisten", en: "Statistics & rankings"}
        type: bool
        when: player-web.enabled
        name: {de: Ranglisten, en: Rankings}
        help: {de: "Reiter Statistik mit Server-Ranglisten (Minecraft-Statistiken und Ranglisten der Plugins). Spieler können sich austragen.", en: "Tab Statistics with server rankings (Minecraft statistics and the plugins' rankings). Players can opt out."}
      - key: player-web.rankings.top
        type: int
        when: player-web.rankings.enabled
        min: 3
        max: 100
        name: {de: Plätze pro Rangliste, en: Places per ranking}
        help: {de: "So viele Plätze pro Rangliste. Der eigene Platz erscheint zusätzlich, wenn er weiter unten liegt.", en: "This many places per ranking. The viewer's own place is shown in addition if it is further down."}
      - key: player-web.rankings.statistics
        type: choices
        when: player-web.rankings.enabled
        name: {de: Statistiken in den Ranglisten, en: Statistics in the rankings}
        help: {de: "Welche Minecraft-Statistiken als Rangliste erscheinen, in dieser Reihenfolge. Leer = nur die Ranglisten der Plugins.", en: "Which Minecraft statistics appear as rankings, in this order. Empty = only the plugins' rankings."}
        options: &stats
          - {value: play-time, de: Spielzeit, en: Play time}
          - {value: xp-level, de: XP-Level, en: XP level}
          - {value: blocks-mined, de: Abgebaute Blöcke, en: Blocks mined}
          - {value: blocks-placed, de: Gesetzte Blöcke, en: Blocks placed}
          - {value: items-crafted, de: Hergestellte Items, en: Items crafted}
          - {value: mob-kills, de: Getötete Mobs, en: Mob kills}
          - {value: deaths, de: Tode, en: Deaths}
          - {value: totems, de: Totems, en: Totems}
          - {value: distance, de: Gelaufen, en: Distance}
          - {value: distance-swum, de: Geschwommen, en: Swum}
          - {value: distance-flown, de: Geflogen, en: Flown}
          - {value: jumps, de: Sprünge, en: Jumps}
          - {value: fish-caught, de: Gefangene Fische, en: Fish caught}
          - {value: times-slept, de: Geschlafen, en: Times slept}
      - key: player-web.personal-stats
        type: choices
        when: player-web.enabled
        name: {de: Eigene Statistik auf der Startseite, en: Own statistics on the start page}
        help: {de: In dieser Reihenfolge - die erste groß. Keine = keine Kachel., en: In this order - the first one big. None = no tile.}
        options: *stats
      - key: player-web.news.enabled
        heading: {de: "Startseite (Karussell)", en: "Start page (slideshow)"}
        type: bool
        when: player-web.enabled
        name: {de: Karussell auf der Startseite, en: Slideshow on the start page}
        help: {de: "Karussell auf der Startseite der Spielerseite: Warnungen, Wartung, Neustart, Hinweise der Plugins, Ticket-Antworten und neueste Beiträge.", en: "Slideshow on the start page of the player page: warnings, maintenance, restart, plugin notices, ticket answers and newest posts."}
      - key: player-web.news.seconds
        advanced: true
        type: int
        when: player-web.news.enabled
        min: 0
        max: 120
        unit: {de: Sekunden, en: seconds}
        name: {de: Pro Folie, en: Per slide}
        help: {de: 0 = nur von Hand., en: 0 = only by hand.}
      - key: player-web.news.show-maintenance
        type: bool
        when: player-web.news.enabled
        name: {de: Geplante Wartung zeigen, en: Show planned maintenance}
        help: {de: "Eine geplante oder laufende Wartung im Karussell zeigen.", en: "Show a planned or running maintenance in the slideshow."}
      - key: player-web.news.show-restart
        type: bool
        when: player-web.news.enabled
        name: {de: Geplanten Neustart zeigen, en: Show a planned restart}
        help: {de: "Einen geplanten Neustart (Countdown) im Karussell zeigen.", en: "Show a planned restart (countdown) in the slideshow."}
      - key: player-web.news.show-plugin-notices
        type: bool
        when: player-web.news.enabled
        name: {de: Hinweise der Plugins zeigen, en: Show notices of the plugins}
        help: {de: "Z.B. MRchunks: Loader gesperrt oder über dem Budget.", en: "E.g. MRchunks: loader locked or over the budget."}
      - key: player-web.news.show-tickets
        type: bool
        when: player-web.news.enabled
        name: {de: Ticket-Antworten zeigen, en: Show ticket answers}
        help: {de: "Eigene Tickets mit neuer, ungelesener Antwort des Teams (oder geschlossen) im Karussell zeigen.", en: "Show own tickets with a new, unread answer of the team (or closed) in the slideshow."}
      - key: player-web.news.chat-preview.enabled
        heading: {de: "Neuigkeiten im Chat", en: "News in the chat"}
        type: bool
        when: player-web.enabled
        name: {de: Neuigkeiten als Vorschau im Chat, en: News as a preview in the chat}
        help: {de: Einmal pro Spieler mit Link zum ganzen Beitrag., en: Once per player with a link to the whole post.}
      - key: player-web.news.chat-preview.max
        advanced: true
        type: int
        when: player-web.news.chat-preview.enabled
        min: 1
        max: 20
        name: {de: Höchstens auf einmal, en: At most at once}
        help: {de: "Höchstens so viele Beiträge auf einmal als Vorschau im Chat.", en: "At most this many posts at once as a preview in the chat."}
      - key: player-web.news.chat-preview.max-age-days
        advanced: true
        type: int
        when: player-web.news.chat-preview.enabled
        min: 1
        max: 365
        unit: {de: Tage, en: days}
        name: {de: Nicht älter als, en: Not older than}
        help: {de: "Ältere Beiträge kommen nicht mehr als Vorschau in den Chat.", en: "Older posts no longer come into the chat as a preview."}
      - key: player-web.news.alerts.chat
        heading: {de: "Kritische Warnungen", en: "Critical warnings"}
        type: bool
        when: player-web.enabled
        name: {de: Kritische Warnungen im Chat, en: Critical warnings in the chat}
        help: {de: "Kritische Warnungen an alle Online-Spieler in den Chat; wer joint, solange eine aktiv ist, bekommt sie ebenfalls.", en: "Critical warnings to everyone online in the chat; whoever joins while one is active gets it too."}
      - key: player-web.news.alerts.title
        type: bool
        when: player-web.enabled
        name: {de: Kritische Warnungen als Titel, en: Critical warnings as a title}
        help: {de: "Kritische Warnungen zusätzlich als Titel auf dem Bildschirm.", en: "Critical warnings also as a title on the screen."}

  - id: requests
    name: {de: Öffentliche Formulare, en: Public forms}
    group: {de: "Weboberfläche & Karte", en: "Web interface & map"}
    help: {de: "Entbannungsanträge und Kontaktformular - ohne Anmeldung erreichbar, sie landen als Tickets bei dir.", en: "Unban requests and contact form - reachable without signing in, they end up as tickets with you."}
    fields:
      - key: web.requests.unban.enabled
