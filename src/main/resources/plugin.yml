name: MRadmin
version: '${version}'
main: at.marcelr.mradmin.MRAdmin
api-version: '${mcVersion}'
softdepend: [LuckPerms, LibertyBans]
# Database drivers for storage.type sqlite/mysql - Paper downloads them on the first start (folder libraries/).
libraries:
  - com.zaxxer:HikariCP:${hikariVersion}
  - org.xerial:sqlite-jdbc:${sqliteVersion}
  - org.mariadb.jdbc:mariadb-java-client:${mariadbVersion}
author: _therealmarci
website: ${website}/docs/${websiteSlug}/
description: Admin tools - maintenance mode with Uptime Kuma, tickets, announcements, admin mode and web interface.

commands:
  mradmin:
    description: Management of MRadmin (announcements, admin mode, maintenance).
    usage: /mradmin <announce|mode|menu|player|tp|status|tickets|maintenance|discord|reload|version>
    aliases: [mra]
  report:
    description: Ticket menu - report players, report bugs, other requests, own tickets.
    usage: /report [player]
    aliases: [melden, ticket, tickets, support]
  staffchat:
    description: Chat for the team only (without a message it toggles).
    usage: /sc [message]
    aliases: [sc]

# One permission per feature - it applies in game and in the web interface alike. For easy granting there are
# the packages mradmin.support, mradmin.staff and mradmin.admin. The web console is in no package.
permissions:
  # ------------------------------------------------------------------ Packages
  mradmin.support:
    description: "Package support: handle tickets, view players, staff chat, web interface."
    default: op
    children:
      mradmin.dashboard: true
      mradmin.tickets.notify: true
      mradmin.tickets.view: true
      mradmin.tickets.reply: true
      mradmin.tickets.claim: true
      mradmin.tickets.close: true
      mradmin.tickets.reopen: true
      mradmin.player.view: true
      mradmin.staffchat: true
      mradmin.web: true
  mradmin.staff:
    description: "Package staff: support + player tools, admin mode, server status, view and join maintenance."
    default: op
    children:
      mradmin.support: true
      mradmin.tickets.teleport: true
      mradmin.maintenance.view: true
      mradmin.maintenance.bypass: true
      mradmin.maintenance.notify: true
      mradmin.mode: true
      mradmin.player.teleport: true
      mradmin.player.summon: true
      mradmin.player.inventory: true
      mradmin.player.freeze: true
      mradmin.player.kick: true
      mradmin.status: true
      mradmin.status.health: true
  mradmin.admin:
    description: "All permissions of MRadmin - except the web console (mradmin.web.console.*), which is granted individually on purpose."
    default: op
    children:
      mradmin.staff: true
      mradmin.maintenance.manage: true
      mradmin.announce: true
      mradmin.mode.others: true
      mradmin.web.audit: true
      mradmin.web.manage: true
      mradmin.admin.reload: true
      mradmin.admin.storage: true
      mradmin.admin.discord: true
      mradmin.admin.update: true

  # ------------------------------------------------------------ Dashboard
  mradmin.dashboard:
    description: Open the dashboard (/mradmin) or the overview in the web interface.
    default: op
  mradmin.status:
    description: Server status (/mradmin status, server tile, overview in the web).
    default: op
  mradmin.status.health:
    description: Health dashboard - history of TPS, MSPT, CPU, RAM, lag sources.
    default: op

  # -------------------------------------------------------------- Tickets
  mradmin.tickets.create:
    description: /report - open tickets and view, answer and close your own.
    default: true
  mradmin.tickets.notify:
    description: Notice about new tickets and replies, on join the number of open tickets.
    default: op
  mradmin.tickets.view:
    description: View all tickets (/mradmin tickets, dashboard, web). No cooldown when creating.
    default: op
  mradmin.tickets.reply:
    description: Reply in other players' tickets.
    default: op
  mradmin.tickets.claim:
    description: Claim and release tickets.
    default: op
  mradmin.tickets.close:
    description: Close other players' tickets (also the automatic chunk loader tickets).
    default: op
  mradmin.tickets.reopen:
    description: Reopen closed tickets.
    default: op
  mradmin.tickets.teleport:
    description: Teleport to the location of a ticket or to the reported player.
    default: op

  # ---------------------------------------------------------- Maintenance
  mradmin.maintenance.view:
    description: View the maintenance status (/mradmin maintenance, dashboard, web).
    default: op
  mradmin.maintenance.manage:
    description: Start, schedule, extend and end maintenance.
    default: op
  mradmin.maintenance.bypass:
    description: May join during maintenance and is not kicked when it starts.
    default: op
  mradmin.maintenance.notify:
    description: Notices about the maintenance mode (e.g. connection to Uptime Kuma lost).
    default: op

  # ---------------------------------------------- Announcements, mode, chat
  mradmin.announce:
    description: /mradmin announce - announcements on the screen of all players.
    default: op
  mradmin.mode:
    description: /mradmin mode - admin mode for yourself (the compass opens the dashboard).
    default: op
    children:
      mradmin.dashboard: true
  mradmin.mode.others:
    description: /mradmin mode <on|off> <player> - control other players' admin mode.
    default: op
  mradmin.staffchat:
    description: /sc - read and write the staff chat.
    default: op

  # -------------------------------------------------------------- Players
  mradmin.player.view:
    description: Player list and player menu or player profile in the web (info, tickets about the player).
    default: op
  mradmin.player.teleport:
    description: Teleport to players (player list, player menu, /mradmin tp, server status).
    default: op
  mradmin.player.summon:
    description: Summon players to yourself.
    default: op
  mradmin.player.inventory:
    description: View other players' inventory and ender chest (read only).
    default: op
  mradmin.player.freeze:
    description: Freeze and unfreeze players; notice when a frozen player logs out.
    default: op
  mradmin.player.kick:
    description: Kick players from the server.
    default: op

  # --------------------------------------------------------- Web interface
  mradmin.web:
    description: Use the web interface (own account via /mradmin web setup). The web uses the same permissions as the game.
    default: op
  mradmin.web.audit:
    description: View the log of all web actions.
    default: op
  mradmin.web.manage:
    description: Manage other players' web accounts (/mradmin web invite|logout|remove).
    default: op
  mradmin.web.console.view:
    description: View the live console in the web interface. Not included in mradmin.admin.
    default: false
  mradmin.web.console.execute:
    description: Run commands via the web console (as powerful as console access!). Not included in mradmin.admin.
    default: false
    children:
      mradmin.web.console.view: true

  # ------------------------------------------------------------ Management
  mradmin.admin.reload:
    description: /mradmin reload
    default: op
  mradmin.admin.storage:
    description: /mradmin storage - show the storage (YAML, SQLite, MySQL).
    default: op
  mradmin.admin.discord:
    description: /mradmin discord [test]
    default: op
  mradmin.admin.update:
    description: Notice when joining the server if an update is available.
    default: op

