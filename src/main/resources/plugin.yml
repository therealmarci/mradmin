name: MRadmin
version: '${version}'
main: at.marcelr.mradmin.MRAdmin
api-version: '${mcVersion}'
softdepend: [LuckPerms, LibertyBans, Multiverse-Inventories, squaremap]
# Database drivers for storage.type sqlite/mysql - Paper downloads them on the first start (folder libraries/).
libraries:
  - com.zaxxer:HikariCP:${hikariVersion}
  - org.xerial:sqlite-jdbc:${sqliteVersion}
  - org.mariadb.jdbc:mariadb-java-client:${mariadbVersion}
author: _therealmarci
website: ${website}/docs/${websiteSlug}/
description: Admin tools - maintenance mode with Uptime Kuma, tickets, announcements, admin mode, web interface with a map for players.

commands:
  mradmin:
    description: Management of MRadmin (announcements, admin mode, maintenance).
    usage: /mradmin [announce|mode|player|tp|status|tickets|maintenance|web|mail|map|mute|discord|storage|reload|restart|stop|starter|version|help]
    aliases: [mra]
  report:
    description: Ticket menu - report players, report bugs, other requests, own tickets.
    usage: /report [player]
    aliases: [melden, ticket, tickets, support]
  web:
    description: "Your own page in the web interface: its address and a 6-digit code to sign in, /web devices, /web logout."
    usage: /web [devices|logout]
    aliases: [website, me]
  staffchat:
    description: Chat for the team only (without a message it toggles).
    usage: /sc [message]
    aliases: [sc]

# One permission per feature - it applies in game and in the web interface alike. For easy granting there are
# the packages mradmin.support, mradmin.staff and mradmin.admin. The web console is in no package.
permissions:
  # ------------------------------------------------------------------ Groups
  # The same in every MRtechnology plugin: <plugin>.player for players, <plugin>.groups.support / staff / admin for
  # the team - each group contains the one below. The single permissions further down stay usable on their own.
  mradmin.player:
    description: "Player: /report - open tickets and view, answer and close your own; /web - own page in the web interface; /mradmin map - link to the web map, other players on it; /mradmin version."
    default: op
    children:
      mradmin.version: true
      mradmin.tickets.create: true
      mradmin.web.self: true
      mradmin.map: true
      mradmin.map.players: true
  mradmin.groups.support:
    description: "Group support: overview, server status, handle tickets, view players and their inventory, teleport, staff chat, admin mode, web interface, view maintenance and join during it, view versions."
    default: op
    children:
      mradmin.player: true
      mradmin.dashboard: true
      mradmin.status: true
      mradmin.status.health: true
      mradmin.tickets.notify: true
      mradmin.notify.mute: true
      mradmin.tickets.view: true
      mradmin.tickets.reply: true
      mradmin.tickets.claim: true
      mradmin.tickets.close: true
      mradmin.tickets.reopen: true
      mradmin.tickets.teleport: true
      mradmin.player.view: true
      mradmin.player.teleport: true
      mradmin.player.inventory: true
      mradmin.staffchat: true
      mradmin.web: true
      mradmin.maintenance.view: true
      mradmin.maintenance.bypass: true
      mradmin.maintenance.notify: true
      mradmin.versions.view: true
      mradmin.mode: true
      # LibertyBans (if installed): view punishments, history and the ban and mute lists
      libertybans.commands: true
      libertybans.list.history: true
      libertybans.list.banlist: true
      libertybans.list.mutelist: true
  mradmin.groups.staff:
    description: "Group staff: support + summon, freeze and kick players, read the console output on the page Log; with LibertyBans kick, mute and warn."
    default: op
    children:
      mradmin.groups.support: true
      mradmin.player.summon: true
      mradmin.player.freeze: true
      mradmin.player.kick: true
      mradmin.web.console.view: true
      mradmin.applications: true
      # LibertyBans: kick, mute and warn players (and lift mutes and warns)
      libertybans.kick.do.target.uuid: true
      libertybans.mute.do.target.uuid: true
      libertybans.mute.undo.target.uuid: true
      libertybans.warn.do.target.uuid: true
      libertybans.warn.undo.target.uuid: true
  mradmin.groups.admin:
    description: "Group admin: everything of MRadmin - maintenance, announcements, news for the player page, web accounts, updates, restart, running commands in the web console, setting up the web map; with LibertyBans ban and unban."
    default: op
    children:
      mradmin.groups.staff: true
      mradmin.maintenance.manage: true
      mradmin.announce: true
      mradmin.announce.templates: true
      mradmin.news: true
      mradmin.mode.others: true
      mradmin.web.audit: true
      mradmin.web.manage: true
      mradmin.admin.reload: true
      mradmin.admin.storage: true
      mradmin.admin.discord: true
      mradmin.admin.update: true
      mradmin.versions.install: true
      mradmin.config: true
      mradmin.appearance: true
      mradmin.server.restart: true
      mradmin.server.setup: true
      mradmin.web.console.execute: true
      mradmin.map.admin: true
      # LibertyBans: ban and unban players (also decide unban requests)
      libertybans.ban.do.target.uuid: true
      libertybans.ban.undo.target.uuid: true

  # ------------------------------------------------------------ Version
  mradmin.version:
    description: /mradmin version - version, update status and links.
    default: op

  # ------------------------------------------------------------ Dashboard
  mradmin.dashboard:
    description: Open the dashboard (/mradmin) or the overview in the web interface.
    default: op
  mradmin.status:
    description: Server status (/mradmin status, server tile, overview in the web).
    default: op
  mradmin.status.health:
    description: Health dashboard - history of TPS, MSPT, CPU, RAM, lag sources.
    default: op

  # -------------------------------------------------------------- Tickets
  mradmin.web.self:
    description: "/web - link and sign-in code for the own player page in the web interface (needs player-web.enabled)."
    default: op
  mradmin.tickets.create:
    description: /report - open tickets and view, answer and close your own.
    default: op
  mradmin.tickets.notify:
    description: Notice about new tickets and replies, on join the number of open tickets.
    default: op
  mradmin.notify.mute:
    description: "/mradmin mute [duration|off] - team notices in the game off for a while (inbox and push go on)."
    default: op
  mradmin.tickets.view:
    description: View all tickets (/mradmin tickets, dashboard, web). No cooldown when creating.
    default: op
  mradmin.tickets.reply:
    description: Reply in other players' tickets.
    default: op
  mradmin.tickets.claim:
    description: Claim and release tickets.
    default: op
  mradmin.tickets.close:
    description: Close other players' tickets (also the automatic chunk loader tickets).
    default: op
  mradmin.tickets.reopen:
    description: Reopen closed tickets.
    default: op
  mradmin.tickets.teleport:
    description: Teleport to the location of a ticket or to the reported player.
    default: op

  # ---------------------------------------------------------- Maintenance
  mradmin.maintenance.view:
    description: View the maintenance status (/mradmin maintenance, dashboard, web).
    default: op
  mradmin.maintenance.manage:
    description: Start, schedule, extend and end maintenance.
    default: op
  mradmin.maintenance.bypass:
    description: May join during maintenance and is not kicked when it starts.
    default: op
  mradmin.maintenance.notify:
    description: Notices about the maintenance mode (e.g. connection to Uptime Kuma lost).
    default: op

  # ---------------------------------------------- Announcements, mode, chat
  mradmin.news:
    description: "Web interface: write news and changelogs for the players' own page (/web)."
    default: op
  mradmin.announce:
    description: /mradmin announce - announcements on the screen of all players.
    default: op
  mradmin.announce.templates:
    description: "Web interface: create, change and delete announcement templates (page Communication)."
    default: op
  mradmin.mode:
    description: /mradmin mode - admin mode for yourself (the menu item opens the dashboard).
    default: op
    children:
      mradmin.dashboard: true
  mradmin.mode.others:
    description: /mradmin mode <on|off> <player> - control other players' admin mode.
    default: op
  mradmin.staffchat:
    description: /sc - read and write the staff chat.
    default: op

  # -------------------------------------------------------------- Players
  mradmin.player.view:
    description: Player list and player menu or player profile in the web (info, tickets about the player).
    default: op
  mradmin.player.teleport:
    description: Teleport to players (player list, player menu, /mradmin tp, server status).
    default: op
  mradmin.player.summon:
    description: Summon players to yourself.
    default: op
  mradmin.player.inventory:
    description: View other players' inventory and ender chest (read only).
    default: op
  mradmin.player.freeze:
    description: Freeze and unfreeze players; notice when a frozen player logs out.
    default: op
  mradmin.player.kick:
    description: Kick players from the server.
    default: op

  # --------------------------------------------------------- Web interface
  mradmin.web:
    description: "Use the administration of the web interface (sign in with /web, plus an own sign-in: password, passkey or Discord). The web uses the same permissions as the game."
    default: op
  mradmin.web.audit:
    description: View the log of all web actions.
    default: op
  mradmin.web.manage:
    description: "Manage other players' web accounts (/mradmin web sessions|logout|reset|remove)."
    default: op
  mradmin.web.console.view:
    description: Read the console output on the page Log of the web interface (no commands).
    default: false
  mradmin.web.console.execute:
    description: "Page Console of the web interface: run commands (as powerful as console access!), after unlocking with a code."
    default: false
    children:
      mradmin.web.console.view: true

  # ------------------------------------------------------------ Management
  mradmin.admin.reload:
    description: /mradmin reload
    default: op
  mradmin.admin.storage:
    description: /mradmin storage - show the storage (YAML, SQLite, MySQL).
    default: op
  mradmin.admin.discord:
    description: /mradmin discord [test]
    default: op
  mradmin.admin.update:
    description: Notice when joining the server if an update is available.
    default: op
  mradmin.versions.view:
    description: "Web interface: page Plugins - all MRtechnology plugins, their versions and updates (view only)."
    default: op
  mradmin.config:
    description: "Web interface: view and change the config.yml of MRadmin and the other MRtechnology plugins in the browser (saved and reloaded right away)."
    default: op
  mradmin.appearance:
    description: "Web interface: change the look - name, logo, browser icon, accent colour and footer (Server -> Appearance)."
    default: op
  mradmin.applications:
    description: "Web interface: accept (puts the player on the whitelist) or reject whitelist applications in their tickets."
    default: op
  mradmin.versions.install:
    description: "Web interface: check for updates now, download updates and install missing MRtechnology plugins (loaded on the next start)."
    default: op
    children:
      mradmin.versions.view: true
  mradmin.server.restart:
    description: "Restart or stop the server with a countdown: web interface and /mradmin restart|stop; /mradmin starter shows the starter."
    default: op
  mradmin.server.setup:
    description: "/mradmin starter setup - write the starter files (mrserver.sh, mrserver.cmd) into the server folder."
    default: op

  # ------------------------------------------------------------ Web map
  mradmin.map:
    description: /mradmin map - link to the map on the player page.
    default: op
  mradmin.map.players:
    description: "Map of the player page: see the other online players (map.player-page.players.others)."
    default: op
  mradmin.map.admin:
    description: "/mradmin map [setup] - status of the map and of squaremap (which draws it), set up squaremap again."
    default: op
