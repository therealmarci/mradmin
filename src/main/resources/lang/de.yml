# ==============================================================================
#   MRadmin - Sprachdatei: Deutsch (de)
# ==============================================================================
#   Aktivieren: in der config.yml  language: de
#   Eigene Sprache: diese Datei kopieren (z.B. als fr.yml), übersetzen und language: fr setzen.
#   Fehlende Texte werden bei Updates automatisch ergänzt - deine Änderungen bleiben erhalten.
#
#   Format: MiniMessage - https://docs.advntr.dev/minimessage/format.html
#   Leerer Text ("") = Nachricht wird nicht gesendet.
# ==============================================================================

# Nicht ändern - damit erkennt das Plugin bei Updates, welche Texte erneuert werden müssen.
lang-version: 8

prefix: "<dark_gray>[<gold>MRadmin</gold>]</dark_gray> "

# --- Allgemein ---------------------------------------------------------------
no-permission: "<prefix><red>Dazu hast du keine Berechtigung."
players-only: "<prefix><red>Dieser Befehl kann nur von Spielern genutzt werden."
player-not-found: "<prefix><red>Spieler <white><player></white> ist nicht online."
reloaded: "<prefix><green>Konfiguration und Sprachdatei neu geladen."
reload-invalid: "<prefix><red>config.yml hat einen Fehler bei Zeile <white><line></white> oder kurz davor</red> <gray>- häufig ein fehlendes Anführungszeichen oder falsche Einrückung. Die bisherige Konfiguration bleibt aktiv. <dark_gray>(<error>)"
# Uhrzeiten (Java-Muster): time-format für heute, date-format für andere Tage.
time-format: "HH:mm 'Uhr'"
date-format: "dd.MM.yyyy 'um' HH:mm 'Uhr'"
# Anzeige, wenn kein Ende feststeht.
time-open-end: "offen"

# --- Hilfe (/mradmin) --------------------------------------------------------
# Jede Zeile erscheint nur, wenn man den Befehl nutzen darf.
help-header: "<prefix><gray>Befehle:"
help-announce: "<gold>/mradmin announce <text|preset></gold> <dark_gray>- <gray>Ankündigung an alle <dark_gray>(Presets: <presets>)"
help-mode: "<gold>/mradmin mode [on|off|list]</gold> <dark_gray>- <gray>Admin-Modus (Creative + Admin-Kompass mit Menü)"
help-maintenance: "<gold>/mradmin maintenance [status|on|schedule|extend|off|refresh]</gold> <dark_gray>- <gray>Wartungsarbeiten"
help-discord: "<gold>/mradmin discord [test [announce]]</gold> <dark_gray>- <gray>Status der Discord-Webhooks (Admin-Log und Ankündigungen)"
help-reload: "<gold>/mradmin reload</gold> <dark_gray>- <gray>Konfiguration neu laden"
help-version: "<gold>/mradmin version</gold> <dark_gray>- <gray>Version und Updates"
help-menu: "<gold>/mradmin</gold> <dark_gray>- <gray>Admin-Dashboard, <gold>/mradmin player <spieler></gold> <dark_gray>- <gray>Spieler-Menü, <gold>/mradmin help</gold> <dark_gray>- <gray>diese Liste"
help-status: "<gold>/mradmin status</gold> <dark_gray>- <gray>Serverzustand: TPS, RAM, Chunks mit den meisten Entities"
help-reports: "<gold>/mradmin reports</gold> <dark_gray>- <gray>offene Reports"
help-staffchat: "<gold>/sc [text]</gold> <dark_gray>- <gray>Staff-Chat (ohne Text: umschalten)"

# --- Ankündigungen -------------------------------------------------------------
announce-usage: |-
  <prefix><gray>Verwendung:
  <gold>/mradmin announce <text></gold> <dark_gray>- <gray>eigener Text, mit <white>|</white> getrennt: <white>Titel | Untertitel</white>
  <gold>/mradmin announce <preset> [werte...]</gold> <dark_gray>- <gray>Presets: <white><presets>
  <gray>Mit <white>-d</white> geht ein eigener Text auch in den Community-Discord, mit <white>-q</white> ein Preset nicht.
announce-sent: "<prefix><green>Ankündigung gesendet."
# Überschrift bei eigenem Text ohne "|"
announce-custom-title: "<gold><bold>Ankündigung"
# Chat-Ausgabe bei eigenem Text. Platzhalter: <title> <message>
announce-custom-chat: "<dark_gray>[<gold>📢</gold>]</dark_gray> <title> <dark_gray>»</dark_gray> <white><message>"

# Vorbereitete Ankündigungen: /mradmin announce <name> [werte...]
# Je Preset: title (groß), subtitle (darunter), chat (optional, "" = keine Chat-Nachricht).
# discord (optional): Text für den Community-Discord (Markdown, Platzhalter {args} {arg1} ...), "" = nicht posten.
# Platzhalter: <arg1> <arg2> ... = einzelne Werte, <args> = alle Werte zusammen.
# Eigene Presets einfach dazuschreiben, der Name ist frei wählbar (ohne Leerzeichen).
announce-presets:
  restart:
    title: "<red><bold>Neustart"
    subtitle: "<gray>Der Server startet in <white><args></white> neu"
    chat: "<dark_gray>[<red>⟳</red>]</dark_gray> <gray>Der Server startet in <white><args></white> neu. Bitte sucht euch einen sicheren Ort!"
    discord: "🔄 Der Server startet in **{args}** neu."
  restart-now:
    title: "<red><bold>Neustart"
    subtitle: "<gray>Der Server startet <white>jetzt</white> neu - bis gleich!"
    chat: "<dark_gray>[<red>⟳</red>]</dark_gray> <gray>Der Server startet jetzt neu - bis gleich!"
    discord: ""
  update:
    title: "<aqua><bold>Update"
    subtitle: "<gray>Gleich gibt es ein Server-Update"
    chat: "<dark_gray>[<aqua>⬆</aqua>]</dark_gray> <gray>Gleich gibt es ein Server-Update. <white><args>"
    discord: "⬆️ Gleich gibt es ein Server-Update. {args}"
  event:
    title: "<light_purple><bold>Event"
    subtitle: "<white><args>"
    chat: "<dark_gray>[<light_purple>★</light_purple>]</dark_gray> <gray>Event: <white><args>"
    discord: "⭐ **Event:** {args}"
