# Texte der Discord-Logs (Markdown wie in Discord). An/aus und Farbe stehen in der config.yml.
# Platzhalter: {title} {start} {end} {source} {url} {admin} {text} {player} {world} {x} {y} {z} {duration}
discord:
  test-message: "🔧 Testnachricht von MRadmin - der Webhook funktioniert!"
  maintenance-scheduled: "🗓️ Wartung geplant: **{start}** bis **{end}** - {title} ({source})"
  maintenance-changed: "✏️ Wartung geändert: jetzt **{start}** bis **{end}** - {title} ({source})"
  maintenance-cancelled: "❎ Wartung abgesagt: {title} ({source})"
  maintenance-start: "🔧 Wartung hat begonnen - nur Staff kann joinen. Ende: **{end}** ({source})"
  maintenance-end: "✅ Wartung beendet - der Server ist wieder offen."
  kuma-connected: "🔗 Mit Uptime Kuma verbunden ({url})."
  kuma-disconnected: "⚠️ Verbindung zu Uptime Kuma verloren ({url})."
  announce: "📢 **{admin}**: {text}"
  admin-mode-on: "🛡️ **{player}** ist im Admin-Modus ({world} {x}, {y}, {z})."
  admin-mode-off: "🛡️ **{player}** hat den Admin-Modus beendet (nach {duration})."
  admin-reload: "🔄 **{admin}** hat die MRadmin-Konfiguration neu geladen."
  report: "🚩 **Report #{id}** von **{reporter}** über **{player}**: {reason} ({world} {x}, {y}, {z})"
  report-closed: "✅ Report #{id} über **{player}** wurde von **{admin}** erledigt."
  player-freeze: "🧊 **{admin}** hat **{player}** eingefroren."
  player-unfreeze: "💧 **{admin}** hat **{player}** wieder aufgetaut."
  player-freeze-quit: "⚠️ **{player}** hat sich eingefroren ausgeloggt."
  staff-chat: "💬 **{player}**: {text}"
# Texte für den Community-Discord (discord-announce in der config.yml). Markdown wie in Discord.
# Platzhalter: {title} (Thema) {start} {end} (Discord-Zeitstempel, jeder sieht seine Zeitzone) {start-relative} {end-relative} ("in 2 Stunden").
discord-announce:
  test-message: "🔧 Testnachricht von MRadmin - der Ankündigungs-Webhook funktioniert!"
  open-end: "offen"
  maintenance-topic-line: "**Thema:** {title}"
  maintenance-scheduled-title: "🛠️ Wartungsarbeiten geplant"
  maintenance-scheduled: "Der Server ist ab **{start}** ({start-relative}) wegen Wartungsarbeiten nicht erreichbar.\n**Geschätztes Ende:** {end}"
  maintenance-started-title: "🔧 Wartungsarbeiten laufen"
  maintenance-started: "Der Server ist gerade im Wartungsmodus.\n**Geschätztes Ende:** {end} {end-relative}"
  maintenance-ended-title: "✅ Server wieder online"
  maintenance-ended: "Die Wartungsarbeiten sind abgeschlossen - viel Spaß beim Spielen!"
  maintenance-cancelled-title: "❎ Wartung abgesagt"
  maintenance-cancelled: "~~Geplant ab {start}~~ - die Wartung findet nicht statt."
  maintenance-changed-note: "✏️ *Die Zeiten wurden aktualisiert.*"

