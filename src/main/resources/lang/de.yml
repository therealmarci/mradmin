# --- Wartungsarbeiten ----------------------------------------------------------
# Platzhalter: <title> (Thema der Wartung, z.B. aus Uptime Kuma), <title-line> / <kick-title-line> (Zeile mit dem Thema, leer ohne Thema),
# <start> <end> (Uhrzeit), <in> (Zeit bis Beginn, z.B. 14m 30s), <countdown> (z.B. 0:14:30), <remaining> (Zeit bis Ende)
maintenance-title-line: "<newline>  <dark_gray>▪</dark_gray> <gray>Thema: <white><title>"
maintenance-kick-title-line: "<newline><white><title>"
maintenance-source-manual: "per Befehl"
# Bossbar vor Beginn (alle) und während der Wartung (Staff)
maintenance-bossbar: "<yellow>⚠ Wartungsarbeiten in <white><bold><countdown></bold></white> <gray>(um <start>)"
maintenance-bossbar-active: "<light_purple>🔧 Wartung läuft <dark_gray>- <gray>noch <white><countdown></white> <gray>(bis <end>)"
maintenance-bossbar-active-open: "<light_purple>🔧 Wartung läuft <dark_gray>- <gray>Ende offen"
maintenance-announced: |-
  <prefix><yellow><bold>⚠ Wartungsarbeiten</bold></yellow> <gray>in <white><in></white><title-line>
    <dark_gray>▪</dark_gray> <gray>Beginn: <white><start></white> <dark_gray>·</dark_gray> <gray>Ende: <white><end></white>
    <dark_gray>▪</dark_gray> <gray>Danach können nur Teammitglieder joinen.
maintenance-reminder: "<prefix><yellow>⚠ Die Wartungsarbeiten beginnen in <white><in></white>."
maintenance-rescheduled: "<prefix><yellow>Die Wartung wurde verschoben: <gray>Beginn jetzt <white><start></white>, Ende <white><end></white>."
maintenance-cancelled: "<prefix><green>Die geplanten Wartungsarbeiten wurden abgesagt."
# Großer Countdown in den letzten Sekunden (maintenance.title-countdown-seconds). <seconds> = verbleibende Sekunden
maintenance-countdown-title: "<red><bold><seconds>"
maintenance-countdown-subtitle: "<gray>Wartungsarbeiten beginnen"
maintenance-started: |-
  <prefix><red><bold>🔧 Wartungsarbeiten haben begonnen</bold></red><title-line>
    <dark_gray>▪</dark_gray> <gray>Geschätztes Ende: <white><end></white>
maintenance-start-title: "<red><bold>Wartungsarbeiten"
maintenance-start-subtitle: "<gray>Bis später - voraussichtlich bis <white><end>"
# An Staff (mradmin.maintenance.bypass):
maintenance-extended: "<prefix><yellow>Die Wartung wurde verlängert: <gray>Ende jetzt <white><end></white>."
maintenance-shortened: "<prefix><green>Die Wartung endet früher: <gray>Ende jetzt <white><end></white>."
maintenance-join-staff: "<prefix><light_purple>Wartungsmodus aktiv <gray>- nur das Team kann joinen. Ende: <white><end></white>."
maintenance-ended: "<prefix><green>✔ Die Wartungsarbeiten sind beendet - der Server ist wieder für alle offen."
# Bildschirm beim Kick / wenn jemand während der Wartung joinen will
maintenance-kick: |-
  <red><bold>Wartungsarbeiten</bold></red><kick-title-line>

  <gray>Der Server wird gerade gewartet.
  <gray>Geschätztes Ende: <white><end></white>

  <dark_gray>Danke für deine Geduld!
# Serverliste während der Wartung (2 Zeilen)
