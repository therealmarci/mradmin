# --- Ankündigungen -------------------------------------------------------------
announce-usage: |-
  <prefix><gray>Verwendung:
  <gold>/mradmin announce <text></gold> <dark_gray>- <gray>eigener Text, mit <white>|</white> getrennt: <white>Titel | Untertitel</white>
  <gold>/mradmin announce <preset> [werte...] [name="wert"...]</gold> <dark_gray>- <gray>Presets: <white><presets>
  <gold>/mradmin announce title="..." subtitle="..." chat="..." discord="..."</gold> <dark_gray>- <gray>frei zusammengesetzt (für Scripts), dazu actionbar, sound, stay, to, id
  <gray>Mit <white>-d</white> geht ein eigener Text auch in den Community-Discord, mit <white>-q</white> ein Preset nicht.
announce-sent: "<prefix><green>Ankündigung gesendet."
announce-invalid-part: "<prefix><red>Ungültiger Wert für <white><part></white>: <white><value></white> <gray>(Zahlen in Sekunden, Töne als Bukkit-Name oder Key)"
# Überschrift bei eigenem Text ohne "|"
announce-custom-title: "<gold><bold>Ankündigung"
# Chat-Ausgabe bei eigenem Text. Platzhalter: <title> <message>
announce-custom-chat: "<dark_gray>[<gold>📢</gold>]</dark_gray> <title> <dark_gray>»</dark_gray> <white><message>"

# Vorbereitete Ankündigungen: /mradmin announce <name> [werte...]
# Je Preset: title (groß), subtitle (darunter), chat (optional, "" = keine Chat-Nachricht).
# discord (optional): Text für den Community-Discord (Markdown, Platzhalter {args} {arg1} ...), "" = nicht posten.
# Platzhalter: <arg1> <arg2> ... = einzelne Werte, <args> = alle Werte zusammen.
# Eigene Presets einfach dazuschreiben, der Name ist frei wählbar (ohne Leerzeichen).
announce-presets:
  restart:
    title: "<red><bold>Neustart"
    subtitle: "<gray>Der Server startet in <white><args></white> neu"
    chat: "<dark_gray>[<red>⟳</red>]</dark_gray> <gray>Der Server startet in <white><args></white> neu. Bitte sucht euch einen sicheren Ort!"
    discord: "🔄 Der Server startet in **{args}** neu."
  restart-now:
    title: "<red><bold>Neustart"
    subtitle: "<gray>Der Server startet <white>jetzt</white> neu - bis gleich!"
    chat: "<dark_gray>[<red>⟳</red>]</dark_gray> <gray>Der Server startet jetzt neu - bis gleich!"
    discord: ""
  update:
    title: "<aqua><bold>Update"
    subtitle: "<gray>Gleich gibt es ein Server-Update"
    chat: "<dark_gray>[<aqua>⬆</aqua>]</dark_gray> <gray>Gleich gibt es ein Server-Update. <white><args>"
    discord: "⬆️ Gleich gibt es ein Server-Update. {args}"
  event:
    title: "<light_purple><bold>Event"
    subtitle: "<white><args>"
    chat: "<dark_gray>[<light_purple>★</light_purple>]</dark_gray> <gray>Event: <white><args>"
    discord: "⭐ **Event:** {args}"
