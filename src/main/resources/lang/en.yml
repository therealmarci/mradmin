report-notify-teleport-hover: "<gray>To the player or to where the report was made"
report-notify-list: "<yellow>[All reports]"
report-notify-list-hover: "<gray>Open the reports menu"
report-join: "<prefix><gold>There are <white><count></white> open reports.</gold> <list>"
