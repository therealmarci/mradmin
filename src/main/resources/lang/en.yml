report-not-found: "<prefix><red>Report <white><id></white> does not exist."
staffchat-on: "<prefix><green>Staff chat on - your messages only go to the team. <gray>Off: <white>/sc"
staffchat-off: "<prefix><gray>Staff chat off - you write in the normal chat again."
staffchat-usage: "<prefix><gray>Usage: <gold>/sc <message>"
staffchat-format: "<dark_gray>[<red>Staff</red>]</dark_gray> <white><player></white><dark_gray>:</dark_gray> <aqua><message>"

# Texts of the Discord logs (Markdown like in Discord). On/off and colour are in config.yml.
# Placeholders: {title} {start} {end} {source} {url} {admin} {text} {player} {world} {x} {y} {z} {duration}
discord:
  test-message: "🔧 Test message from MRadmin - the webhook works!"
  maintenance-scheduled: "🗓️ Maintenance scheduled: **{start}** to **{end}** - {title} ({source})"
  maintenance-changed: "✏️ Maintenance changed: now **{start}** to **{end}** - {title} ({source})"
  maintenance-cancelled: "❎ Maintenance cancelled: {title} ({source})"
  maintenance-start: "🔧 Maintenance started - only staff can join. End: **{end}** ({source})"
  maintenance-end: "✅ Maintenance over - the server is open again."
  kuma-connected: "🔗 Connected to Uptime Kuma ({url})."
  kuma-disconnected: "⚠️ Lost the connection to Uptime Kuma ({url})."
  announce: "📢 **{admin}**: {text}"
  admin-mode-on: "🛡️ **{player}** entered admin mode ({world} {x}, {y}, {z})."
  admin-mode-off: "🛡️ **{player}** left admin mode (after {duration})."
  admin-reload: "🔄 **{admin}** reloaded the MRadmin configuration."
  report: "🚩 **Report #{id}** by **{reporter}** about **{player}**: {reason} ({world} {x}, {y}, {z})"
  report-closed: "✅ Report #{id} about **{player}** was handled by **{admin}**."
  player-freeze: "🧊 **{admin}** froze **{player}**."
  player-unfreeze: "💧 **{admin}** unfroze **{player}**."
  player-freeze-quit: "⚠️ **{player}** logged out while frozen."
  staff-chat: "💬 **{player}**: {text}"
# Texts for the community Discord (discord-announce in config.yml). Markdown like in Discord.
# Placeholders: {title} (topic) {start} {end} (Discord timestamps, everyone sees their own timezone) {start-relative} {end-relative} ("in 2 hours").
discord-announce:
  test-message: "🔧 Test message from MRadmin - the announcement webhook works!"
  open-end: "open"
  maintenance-topic-line: "**Topic:** {title}"
  maintenance-scheduled-title: "🛠️ Maintenance scheduled"
  maintenance-scheduled: "The server will be unavailable for maintenance from **{start}** ({start-relative}).\n**Estimated end:** {end}"
  maintenance-started-title: "🔧 Maintenance in progress"
  maintenance-started: "The server is in maintenance mode right now.\n**Estimated end:** {end} {end-relative}"
  maintenance-ended-title: "✅ Server back online"
  maintenance-ended: "Maintenance is complete - have fun playing!"
  maintenance-cancelled-title: "❎ Maintenance cancelled"
  maintenance-cancelled: "~~Planned from {start}~~ - the maintenance will not take place."
  maintenance-changed-note: "✏️ *The times have been updated.*"

