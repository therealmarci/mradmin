# ==============================================================================
#   MRadmin - Language file: English (en)
# ==============================================================================
#   Enable: in config.yml  language: en
#   Own language: copy this file (e.g. as fr.yml), translate it and set language: fr.
#   Missing texts are added automatically on updates - your changes are kept.
#
#   Format: MiniMessage - https://docs.advntr.dev/minimessage/format.html
#   Empty text ("") = the message is not sent.
# ==============================================================================

# Do not change - lets the plugin know which texts must be renewed on updates.
lang-version: 8

prefix: "<dark_gray>[<gold>MRadmin</gold>]</dark_gray> "

# --- General -----------------------------------------------------------------
no-permission: "<prefix><red>You don't have permission to do that."
players-only: "<prefix><red>This command can only be used by players."
player-not-found: "<prefix><red>Player <white><player></white> is not online."
reloaded: "<prefix><green>Configuration and language file reloaded."
reload-invalid: "<prefix><red>config.yml has an error at line <white><line></white> or just before</red> <gray>- often a missing quote or wrong indentation. The current configuration stays active. <dark_gray>(<error>)"
# Times (Java pattern): time-format for today, date-format for other days.
time-format: "h:mm a"
date-format: "MMM d, yyyy 'at' h:mm a"
# Shown when there is no fixed end.
time-open-end: "open"

# --- Help (/mradmin) ---------------------------------------------------------
# Every line only appears if the player may use that command.
help-header: "<prefix><gray>Commands:"
help-announce: "<gold>/mradmin announce <text|preset></gold> <dark_gray>- <gray>announcement to everyone <dark_gray>(presets: <presets>)"
help-mode: "<gold>/mradmin mode [on|off|list]</gold> <dark_gray>- <gray>admin mode (creative + admin compass with menu)"
help-maintenance: "<gold>/mradmin maintenance [status|on|schedule|extend|off|refresh]</gold> <dark_gray>- <gray>maintenance"
help-discord: "<gold>/mradmin discord [test [announce]]</gold> <dark_gray>- <gray>status of the Discord webhooks (admin log and announcements)"
help-reload: "<gold>/mradmin reload</gold> <dark_gray>- <gray>reload the configuration"
help-version: "<gold>/mradmin version</gold> <dark_gray>- <gray>version and updates"
help-menu: "<gold>/mradmin</gold> <dark_gray>- <gray>admin dashboard, <gold>/mradmin player <player></gold> <dark_gray>- <gray>player menu, <gold>/mradmin help</gold> <dark_gray>- <gray>this list"
help-status: "<gold>/mradmin status</gold> <dark_gray>- <gray>server health: TPS, RAM, chunks with the most entities"
help-reports: "<gold>/mradmin reports</gold> <dark_gray>- <gray>open reports"
help-staffchat: "<gold>/sc [text]</gold> <dark_gray>- <gray>staff chat (without text: toggle)"

# --- Announcements -------------------------------------------------------------
announce-usage: |-
  <prefix><gray>Usage:
  <gold>/mradmin announce <text></gold> <dark_gray>- <gray>own text, split with <white>|</white>: <white>Title | Subtitle</white>
  <gold>/mradmin announce <preset> [values...]</gold> <dark_gray>- <gray>presets: <white><presets>
  <gray>With <white>-d</white> an own text also goes to the community Discord, with <white>-q</white> a preset does not.
announce-sent: "<prefix><green>Announcement sent."
# Heading for own texts without "|"
announce-custom-title: "<gold><bold>Announcement"
# Chat line for own texts. Placeholders: <title> <message>
announce-custom-chat: "<dark_gray>[<gold>📢</gold>]</dark_gray> <title> <dark_gray>»</dark_gray> <white><message>"

# Prepared announcements: /mradmin announce <name> [values...]
# Per preset: title (large), subtitle (below), chat (optional, "" = no chat message).
# discord (optional): text for the community Discord (Markdown, placeholders {args} {arg1} ...), "" = not posted.
# Placeholders: <arg1> <arg2> ... = single values, <args> = all values together.
# Add your own presets below, the name is free to choose (no spaces).
announce-presets:
  restart:
    title: "<red><bold>Restart"
    subtitle: "<gray>The server restarts in <white><args></white>"
    chat: "<dark_gray>[<red>⟳</red>]</dark_gray> <gray>The server restarts in <white><args></white>. Please find a safe spot!"
    discord: "🔄 The server restarts in **{args}**."
  restart-now:
    title: "<red><bold>Restart"
    subtitle: "<gray>The server restarts <white>now</white> - see you soon!"
    chat: "<dark_gray>[<red>⟳</red>]</dark_gray> <gray>The server restarts now - see you soon!"
    discord: ""
  update:
    title: "<aqua><bold>Update"
    subtitle: "<gray>A server update is coming"
    chat: "<dark_gray>[<aqua>⬆</aqua>]</dark_gray> <gray>A server update is coming. <white><args>"
    discord: "⬆️ A server update is coming. {args}"
  event:
    title: "<light_purple><bold>Event"
    subtitle: "<white><args>"
    chat: "<dark_gray>[<light_purple>★</light_purple>]</dark_gray> <gray>Event: <white><args>"
    discord: "⭐ **Event:** {args}"
