# --- Maintenance ---------------------------------------------------------------
# Placeholders: <title> (topic of the maintenance, e.g. from Uptime Kuma), <title-line> / <kick-title-line> (line with the topic, empty without topic),
# <start> <end> (time), <in> (time until start, e.g. 14m 30s), <countdown> (e.g. 0:14:30), <remaining> (time until end)
maintenance-title-line: "<newline>  <dark_gray>▪</dark_gray> <gray>Topic: <white><title>"
maintenance-kick-title-line: "<newline><white><title>"
maintenance-source-manual: "by command"
# Bossbar before the start (everyone) and during the maintenance (staff)
maintenance-bossbar: "<yellow>⚠ Maintenance in <white><bold><countdown></bold></white> <gray>(at <start>)"
maintenance-bossbar-active: "<light_purple>🔧 Maintenance running <dark_gray>- <white><countdown></white> <gray>left (until <end>)"
maintenance-bossbar-active-open: "<light_purple>🔧 Maintenance running <dark_gray>- <gray>open end"
maintenance-announced: |-
  <prefix><yellow><bold>⚠ Maintenance</bold></yellow> <gray>in <white><in></white><title-line>
    <dark_gray>▪</dark_gray> <gray>Start: <white><start></white> <dark_gray>·</dark_gray> <gray>End: <white><end></white>
    <dark_gray>▪</dark_gray> <gray>After that, only team members can join.
maintenance-reminder: "<prefix><yellow>⚠ Maintenance starts in <white><in></white>."
maintenance-rescheduled: "<prefix><yellow>The maintenance was moved: <gray>now starts <white><start></white>, ends <white><end></white>."
maintenance-cancelled: "<prefix><green>The planned maintenance was cancelled."
# Big countdown in the last seconds (maintenance.title-countdown-seconds). <seconds> = seconds left
maintenance-countdown-title: "<red><bold><seconds>"
maintenance-countdown-subtitle: "<gray>Maintenance is starting"
maintenance-started: |-
  <prefix><red><bold>🔧 Maintenance has started</bold></red><title-line>
    <dark_gray>▪</dark_gray> <gray>Estimated end: <white><end></white>
maintenance-start-title: "<red><bold>Maintenance"
maintenance-start-subtitle: "<gray>See you later - expected until <white><end>"
# To staff (mradmin.maintenance.bypass):
maintenance-extended: "<prefix><yellow>The maintenance was extended: <gray>now ends <white><end></white>."
maintenance-shortened: "<prefix><green>The maintenance ends earlier: <gray>now ends <white><end></white>."
maintenance-join-staff: "<prefix><light_purple>Maintenance mode active <gray>- only the team can join. End: <white><end></white>."
maintenance-ended: "<prefix><green>✔ Maintenance is over - the server is open for everyone again."
# Screen when kicked / when someone tries to join during maintenance
maintenance-kick: |-
  <red><bold>Maintenance</bold></red><kick-title-line>

  <gray>The server is under maintenance.
  <gray>Estimated end: <white><end></white>

  <dark_gray>Thanks for your patience!
# Server list during maintenance (2 lines)
maintenance-motd: "<red><bold>Maintenance</bold></red> <dark_gray>»</dark_gray> <yellow><countdown><newline><gray>Estimated end: <aqua><end>"
maintenance-motd-open: "<red><bold>Maintenance</bold></red><newline><gray>Estimated end: <aqua><end>"
# Shown in the server list instead of the player count (maintenance.motd.replace-version)
maintenance-version-text: "<red>Maintenance"
kuma-lost: "<prefix><red>Lost the connection to Uptime Kuma. <gray>Reconnecting automatically."

# /mradmin maintenance
maintenance-usage: |-
  <prefix><gray>Maintenance:
  <gold>/mradmin maintenance</gold> <dark_gray>- <gray>status (also Uptime Kuma)
  <gold>/mradmin maintenance on [duration] [title]</gold> <dark_gray>- <gray>start now (without duration until "off")
  <gold>/mradmin maintenance schedule <in> [duration] [title]</gold> <dark_gray>- <gray>plan with countdown, e.g. <white>schedule 15m 1h
  <gold>/mradmin maintenance extend <duration></gold> <dark_gray>- <gray>move the end (e.g. <white>30m</white> or <white>-15m</white>)
  <gold>/mradmin maintenance off</gold> <dark_gray>- <gray>end or cancel
  <gold>/mradmin maintenance refresh</gold> <dark_gray>- <gray>fetch maintenances from Uptime Kuma now
maintenance-cmd-on: "<prefix><green>Maintenance started. <gray>End: <white><end></white>."
maintenance-cmd-scheduled: "<prefix><green>Maintenance scheduled for <white><start></white>."
maintenance-cmd-extended: "<prefix><green>New end: <white><end></white>."
